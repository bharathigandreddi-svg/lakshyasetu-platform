name: Patch student-v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'automated student-v2 patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student-v2
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('student-v2.html')
          s=p.read_text(encoding='utf-8')
          open_series = r'''async function openSeries(id){clearErr();const r=await sb.from('ls_test_series').select('*').eq('id',id).single();if(r.error)return err(r.error.message);selectedSeries=r.data;historyState=['series'];showOnly('testsSection');document.getElementById('pageTitle').textContent=r.data.title;document.getElementById('testsTitle').textContent=r.data.title+' — Tests';const t=await sb.from('ls_tests').select('*').eq('test_series_id',id).eq('published',true).eq('archived',false).order('id');if(t.error)return err(t.error.message);document.getElementById('tests').innerHTML=(t.data||[]).map(x=>{const fee=Number(x.price||0);return `<article class="card"><h3>${esc(x.title)}</h3><p>${esc(x.description||'Practice test')}</p><div class="meta"><span class="tag">${money(fee)}</span>${x.duration_minutes?`<span class="tag">${esc(x.duration_minutes)} min</span>`:''}</div><button class="action" onclick="openTest(${x.id})">${fee?'Buy / Start Test':'Start Test'}</button></article>`}).join('')||'<div class="status">No published tests in this series.</div>'}
'''
          s,n=re.subn(r'async function openSeries\(id\)\{.*?\n\}',open_series,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('openSeries function not found')
          init = r'''async function init(){clearErr();const courseId=qs.get('course'),seriesId=qs.get('series'),testId=qs.get('test');if(testId)return openTest(Number(testId));if(courseId)return openCourse(Number(courseId));if(seriesId)return openSeries(Number(seriesId));await Promise.all([loadCourses(),loadSeries()])}
init();'''
          s,n=re.subn(r'async function init\(\)\{.*?\ninit\(\);',init,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('init block not found')
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: automated student-v2 patch'
          git push
