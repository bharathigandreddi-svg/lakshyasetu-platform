# LakshyaSetu GitHub Pages deployment
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare published website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text=p.read_text(encoding='utf-8')
              marker='site-experience-v2.js'
              if marker not in text and '</body>' in text:
                  text=text.replace('</body>','<script src="site-experience-v2.js?v=20260901-1600" defer></script></body>')
              if p.name.lower()=='admin.html' and 'exam-experience-v8.js' not in text and '</body>' in text:
                  text=text.replace('</body>','<script src="exam-experience-v8.js?v=20260901-1600" defer></script></body>')
              if p.name.lower()=='home.html':
                  # Only remove the duplicate standalone Published Tests section.
                  text=text.replace('src="config.js"','src="config.js?v=20260910-0800"')
                  text=re.sub(r'<section class="section">(?:(?!</section>).)*<div id="testCards"\b.*?</section>','',text,flags=re.S)
                  # Preserve the existing JS target so the unchanged homepage logic does not throw.
                  if 'id="testCards"' not in text:
                      text=text.replace('</main>','<div id="testCards" style="display:none"></div></main>',1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
