# LakshyaSetu GitHub Pages deployment
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare published website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text=p.read_text(encoding='utf-8')
              marker='site-experience-v2.js'
              if marker not in text and '</body>' in text:
                  text=text.replace('</body>','<script src="site-experience-v2.js?v=20260901-1600" defer></script></body>')
              if p.name.lower()=='admin.html' and 'exam-experience-v8.js' not in text and '</body>' in text:
                  text=text.replace('</body>','<script src="exam-experience-v8.js?v=20260901-1600" defer></script></body>')
              if p.name.lower()=='home.html':
                  text=text.replace('src="config.js"','src="config.js?v=20260910-0800"')
                  text=re.sub(r'<section class="section">(?:(?!</section>).)*<div id="testCards"\b.*?</section>','',text,flags=re.S)
                  if 'id="testCards"' not in text:
                      text=text.replace('</main>','<div id="testCards" style="display:none"></div></main>',1)
              if p.name.lower()=='test-builder-v2.html' and '</body>' in text:
                  patch='''<script>(function(){function boot(){const series=document.getElementById("series"),subject=document.getElementById("subject"),topic=document.getElementById("topic");if(!series||!subject||!topic||String(series.value)!=="4"||subject.dataset.caStable)return;subject.dataset.caStable="1";const original=subject.onchange;subject.onchange=async function(){const chosen=String(this.value);if(chosen==="19"){if(original)await original.call(this);this.value="19";topic.innerHTML="<option value=\\"\\">Choose…</option><option value=\\"54\\">National Current Affairs</option><option value=\\"new\\">＋ Create New Topic</option>";topic.value="54";return;}if(original)await original.call(this)};if(String(subject.value)==="19")subject.onchange()}const tick=setInterval(()=>{if(String(document.getElementById("series")?.value)==="4"){boot();clearInterval(tick)}},100);setTimeout(()=>clearInterval(tick),15000)})();</script>'''
                  text=text.replace('</body>',patch+'</body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
