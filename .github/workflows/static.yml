# LakshyaSetu GitHub Pages deployment
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject universal website experience
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text=p.read_text(encoding='utf-8')
              marker='site-experience-v2.js'
              if marker not in text and '</body>' in text:
                  text=text.replace('</body>','<script src="site-experience-v2.js?v=20260901-1600" defer></script></body>')
              if p.name.lower()=='admin.html' and 'exam-experience-v8.js' not in text and '</body>' in text:
                  text=text.replace('</body>','<script src="exam-experience-v8.js?v=20260901-1600" defer></script></body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
