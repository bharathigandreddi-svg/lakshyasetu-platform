<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LakshyaSetu | Earth Civils Seed v2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260906-5"></script><style>body{font-family:Inter,Arial;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:20px;margin-bottom:16px}.btn{border:0;border-radius:8px;padding:12px 16px;background:#16794c;color:#fff;font-weight:800;cursor:pointer}.status{padding:12px;border-radius:8px;background:#eef4ff}.ok{background:#e8f7ee;color:#166534}.err{background:#feeceb;color:#991b1b}select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}</style></head><body><main class="wrap"><div class="card"><h1>Earth Structure & Interior — Civils 50</h1><p>This version uses the existing question-table schema and omits both <b>difficulty</b> and <b>published</b>, because those columns are not accepted by the current database schema. The test remains Draft.</p><div id="status" class="status">Checking admin access…</div></div><div id="app" class="card" style="display:none"><b>Select Draft Test</b><select id="test"></select><p id="info"></p><button class="btn" id="seed">Insert 50 Civils MCQs</button></div></main><script>const db=getLakshyaSetuDb(),$=x=>document.getElementById(x);let raw='',tests=[];const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));function say(t,c=''){const e=$('status');e.className='status '+(c==='ok'?'ok':c==='err'?'err':'');e.textContent=t}async function start(){const s=(await db.auth.getSession())?.data?.session;if(!s){location.href='login.html?next='+encodeURIComponent(location.href);return}const p=await db.from('profiles').select('role').eq('id',s.user.id).maybeSingle();const role=p.data?.role||s.user.app_metadata?.role||s.user.user_metadata?.role||'';if(p.error||role!=='admin'){say('Admin access required.','err');return}const d=await fetch('data/earth-structure-civils-50.txt?v=20260906-1');if(!d.ok){say('Could not load the 50-question dataset.','err');return}raw=await d.text();const r=await db.from('ls_tests').select('id,title,question_count').eq('archived',false).eq('published',false).order('id');if(r.error){say(r.error.message,'err');return}tests=r.data||[];const preferred=tests.find(t=>/earth structure.*interior/i.test(t.title))||tests.find(t=>/earth.*interior/i.test(t.title));$('test').innerHTML=tests.map(t=>`<option value="${t.id}">${esc(t.title)} — ${t.question_count||0} questions — DRAFT</option>`).join('');if(preferred)$('test').value=preferred.id;$('app').style.display='block';await refresh();say('Admin verified. Dataset loaded. Ready.','ok')}async function refresh(){const id=Number($('test').value);if(!id)return;const r=await db.from('ls_test_questions').select('id',{count:'exact',head:true}).eq('test_id',id);$('info').textContent=`Selected test ID ${id}. Existing questions: ${r.count||0}.`}$('test').onchange=refresh;function parse(x){return x.trim().split(/\n(?=Q\d+\n)/).map((b,i)=>{const q={display_order:i+1,marks:1,negative_marks:.33,statements:{}};for(const line of b.split('\n')){if(/^Q\d+$/.test(line))continue;if(line.startsWith('Question: '))q.question=line.slice(10);else if(line.startsWith('A: '))q.option_a=line.slice(3);else if(line.startsWith('B: '))q.option_b=line.slice(3);else if(line.startsWith('C: '))q.option_c=line.slice(3);else if(line.startsWith('D: '))q.option_d=line.slice(3);else if(line.startsWith('Answer: '))q.correct_option=line.slice(8).trim();else if(line.startsWith('Explanation: '))q.explanation=line.slice(13);else if(line.startsWith('Marks: '))q.marks=Number(line.slice(7))||1;else if(line.startsWith('Negative: '))q.negative_marks=Number(line.slice(10))||.33;else if(line.startsWith('Concept: '))q.concept_tag=line.slice(9);else if(line.startsWith('Source: '))q.source_reference=line.slice(8)}return q}).filter(q=>q.question&&q.option_a&&q.option_b&&q.option_c&&q.option_d&&q.correct_option&&q.explanation)}$('seed').onclick=async()=>{const id=Number($('test').value);if(!id)return alert('Select a draft test.');const qs=parse(raw);if(qs.length!==50)return say('Dataset parsed as '+qs.length+' questions, expected 50.','err');const chk=await db.from('ls_test_questions').select('id',{count:'exact',head:true}).eq('test_id',id);if((chk.count||0)>0&&!confirm(`This test already has ${chk.count} questions. Append 50 more?`))return;$('seed').disabled=true;$('seed').textContent='Inserting…';try{for(let i=0;i<50;i+=10){const batch=qs.slice(i,i+10).map((q,j)=>({...q,test_id:id,display_order:(chk.count||0)+i+j+1}));const r=await db.from('ls_test_questions').insert(batch);if(r.error)throw new Error('Batch '+(i+1)+'–'+(i+10)+': '+r.error.message)}const u=await db.from('ls_tests').update({question_count:(chk.count||0)+50,published:false}).eq('id',id);if(u.error)throw u.error;say('SUCCESS — 50 Civils MCQs inserted. Test remains DRAFT / unpublished.','ok');$('seed').textContent='Inserted 50 ✓';await refresh()}catch(e){say('Import failed: '+(e.message||e),'err');$('seed').disabled=false;$('seed').textContent='Insert 50 Civils MCQs'}};start();</script></body></html>
