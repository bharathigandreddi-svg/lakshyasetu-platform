<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LakshyaSetu | Earth Civils Seed</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260906-5"></script><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,Arial}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:20px;margin-bottom:16px}.btn{border:0;border-radius:8px;padding:12px 16px;background:#10233f;color:#fff;font-weight:800;cursor:pointer}.green{background:#16794c}.status{padding:12px;border-radius:8px;background:#eef4ff}.ok{background:#e8f7ee;color:#166534}.err{background:#feeceb;color:#991b1b}select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.muted{color:#667085;font-size:13px}</style></head><body><main class="wrap"><div class="card"><h1>Earth Structure & Interior — Civils 50</h1><p class="muted">Admin-only seed tool. This writes the reviewed 50 MCQs into an existing Draft test. It deliberately does NOT send the difficulty field, avoiding the current database difficulty constraint. Test remains unpublished.</p><div id="status" class="status">Checking admin access…</div></div><div id="app" class="card" style="display:none"><label><b>Select Draft Test</b></label><select id="test"></select><p id="info" class="muted"></p><button class="btn green" id="seed">Insert 50 Civils MCQs</button></div></main><script>const db=getLakshyaSetuDb(),$=id=>document.getElementById(id);let tests=[];function say(t,c='status'){$('status').className='status '+(c==='ok'?'ok':c==='err'?'err':'');$('status').textContent=t}async function start(){const s=(await db.auth.getSession())?.data?.session;if(!s){location.href='login.html?next='+encodeURIComponent(location.href);return}const p=await db.from('profiles').select('role').eq('id',s.user.id).maybeSingle();const role=p.data?.role||s.user.app_metadata?.role||s.user.user_metadata?.role||'';if(p.error||role!=='admin'){say('Admin access required.','err');return}const r=await db.from('ls_tests').select('id,title,published,archived,question_count').eq('archived',false).eq('published',false).order('id');if(r.error){say(r.error.message,'err');return}tests=r.data||[];const preferred=tests.find(t=>/earth structure.*interior/i.test(t.title))||tests.find(t=>/earth.*interior/i.test(t.title));$('test').innerHTML=tests.map(t=>'<option value="'+t.id+'">'+esc(t.title)+' — '+(t.question_count||0)+' questions — DRAFT</option>').join('');if(preferred)$('test').value=preferred.id;$('app').style.display='block';await refresh();say('Admin verified. Ready to insert.','ok')}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}async function refresh(){const id=Number($('test').value);if(!id)return;$('info').textContent='Selected test ID '+id+'. Existing questions: checking…';const r=await db.from('ls_test_questions').select('id',{count:'exact',head:true}).eq('test_id',id);$('info').textContent='Selected test ID '+id+'. Existing questions: '+(r.count||0)+'. The import will stop if 50 matching questions already exist.'}const raw=`__DATA__`;function parse(raw){const blocks=raw.trim().split(/\n(?=Q\d+\n)/);return blocks.map((b,i)=>{const lines=b.split('\n');const q={display_order:i+1,marks:1,negative_marks:.33,statements:{}};for(let j=0;j<lines.length;j++){const x=lines[j];if(/^Q\d+$/.test(x))continue;if(x.startsWith('Question: '))q.question=x.slice(10);else if(/^A: /.test(x))q.option_a=x.slice(3);else if(/^B: /.test(x))q.option_b=x.slice(3);else if(/^C: /.test(x))q.option_c=x.slice(3);else if(/^D: /.test(x))q.option_d=x.slice(3);else if(x.startsWith('Answer: '))q.correct_option=x.slice(8).trim();else if(x.startsWith('Explanation: '))q.explanation=x.slice(13);else if(x.startsWith('Marks: '))q.marks=Number(x.slice(7))||1;else if(x.startsWith('Negative: '))q.negative_marks=Number(x.slice(10))||.33;else if(x.startsWith('Concept: '))q.concept_tag=x.slice(9);else if(x.startsWith('Source: '))q.source_reference=x.slice(8)}return q}).filter(q=>q.question&&q.option_a&&q.option_b&&q.option_c&&q.option_d&&q.correct_option&&q.explanation)}$('test').onchange=refresh;$('seed').onclick=async()=>{const id=Number($('test').value);if(!id)return alert('Select a draft test.');$('seed').disabled=true;$('seed').textContent='Inserting…';try{const qs=parse(raw);if(qs.length!==50)throw new Error('Prepared dataset contains '+qs.length+' questions, expected 50.');const chk=await db.from('ls_test_questions').select('id',{count:'exact',head:true}).eq('test_id',id);if((chk.count||0)>0&&!confirm('This test already has '+chk.count+' questions. Continue and append the 50?'))return;for(let i=0;i<qs.length;i+=10){const batch=qs.slice(i,i+10).map((q,j)=>({...q,test_id:id,display_order:i+j+1,published:true}));delete batch.forEach;const r=await db.from('ls_test_questions').insert(batch);if(r.error)throw new Error('Batch '+(i+1)+'–'+Math.min(i+10,qs.length)+': '+r.error.message)}const up=await db.from('ls_tests').update({question_count:qs.length,published:false}).eq('id',id);if(up.error)throw up.error;say('SUCCESS — 50 Civils MCQs inserted. Test is still DRAFT / unpublished. Open Test Builder and review them.','ok');$('seed').textContent='Inserted 50 ✓';await refresh()}catch(e){say('Import failed: '+(e.message||e),'err');$('seed').disabled=false;$('seed').textContent='Insert 50 Civils MCQs'}};start();</script></body></html>
