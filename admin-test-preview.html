<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Test Preview | LakshyaSetu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260913-4"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{background:#10233f;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:30}.brand{font-weight:900;font-size:20px}.sub{font-size:11px;color:#c8d8eb;margin-top:2px}.top a{color:#fff;text-decoration:none;font-size:12px;font-weight:800}.wrap{width:min(1180px,94%);margin:18px auto 50px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:18px;box-shadow:0 3px 14px #10233f0a}.notice{background:#f8fbff;border-color:#d7e4f5;color:#506078;font-size:12px;line-height:1.5}.error{background:#fff1f1;border-color:#f2c5c5;color:#9b1c1c}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.hero h1{margin:0;color:#10233f;font-size:23px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#2457a6;font-size:11px;font-weight:900}.timer{font-size:19px;font-weight:900;color:#10233f;white-space:nowrap}.progress-wrap{height:8px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress{height:100%;background:#2457a6;width:0;transition:width .2s}.qcard{padding:24px}.qnum{font-size:12px;font-weight:900;color:#6b7c95;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}.question{font-size:20px;font-weight:800;line-height:1.55;color:#172033;margin-bottom:20px}.option{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:14px 15px;margin:10px 0;border:1px solid #d5deea;border-radius:11px;background:#fff;cursor:pointer;font:inherit;color:#172033;line-height:1.45}.option:hover{background:#f7faff;border-color:#a9bfdd}.option.selected{border:2px solid #2457a6;background:#eef4ff;padding:13px 14px}.letter{font-weight:900;min-width:22px;color:#2457a6}.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{padding:11px 17px;border:0;border-radius:9px;background:#10233f;color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#edf2f8;color:#173b67}.btn.submit{background:#16784c}.btn.start{background:#16784c;padding:13px 24px;font-size:15px}.btn:disabled{opacity:.4;cursor:not-allowed}.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}.sidebar{position:sticky;top:82px}.navigator h3{margin:0 0 10px;font-size:14px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.num{border:1px solid #d6deea;background:#fff;border-radius:7px;padding:8px 3px;font-size:11px;font-weight:900;cursor:pointer;color:#53627a}.num.current{background:#2457a6;color:#fff;border-color:#2457a6}.num.answered{box-shadow:inset 0 -3px 0 #20a060}.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.result h2{margin-top:0;color:#10233f}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{border:1px solid #dfe6ef;border-radius:10px;padding:13px}.stat b{display:block;font-size:22px;color:#10233f}.stat span{font-size:11px;color:#667085}.review{margin-top:18px}.review-item{border:1px solid #dfe6ef;border-radius:11px;padding:14px;margin:9px 0}.correct{border-left:4px solid #20a060}.wrong{border-left:4px solid #d04444}.unanswered{border-left:4px solid #a0a8b5}.muted{color:#667085;font-size:12px}.test-row{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid #dbe4ef;border-radius:10px;padding:15px;margin:10px 0}.hidden{display:none}.instructions{max-width:900px;margin:28px auto}.instructions h1{margin:0 0 6px;color:#10233f}.instructions h2{margin:20px 0 10px;font-size:17px}.instruction-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.instruction-box{border:1px solid #dfe6ef;border-radius:10px;padding:13px}.instruction-box b{display:block;font-size:20px;color:#10233f}.rules{padding-left:20px;line-height:1.7;font-size:14px;color:#344054}.ready{margin-top:20px;padding:18px;border:1px solid #cfe8d9;background:#f2fbf5;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:15px}.ready b{color:#166534}@media(max-width:800px){.exam-layout{grid-template-columns:1fr}.sidebar{position:static}.nums{grid-template-columns:repeat(10,1fr)}.question{font-size:17px}.hero{align-items:flex-start;flex-direction:column}.instruction-grid{grid-template-columns:1fr}.ready{align-items:flex-start;flex-direction:column}.navrow{flex-wrap:wrap}.navrow .btn{flex:1}.timer{font-size:17px}}@media(max-width:520px){.nums{grid-template-columns:repeat(5,1fr)}}</style></head><body><header class="top"><div><div class="brand">LakshyaSetu</div><div class="sub">Student Test Preview · Admin only · Draft safe mode</div></div><div><a href="admin-v2.html">Control Center</a></div></header><main class="wrap"><div id="status" class="card">Checking admin session...</div><div id="app"></div></main><script>
const sb=getLakshyaSetuDb(),params=new URLSearchParams(location.search);let requestedId=Number(params.get('test')||params.get('test_id')||0),test=null,qs=[],idx=0,answers={},secondsLeft=0,timerHandle=null,submitted=false,started=false;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
async function guard(){const r=await sb.auth.getSession(),s=r?.data?.session;if(!s){location.href='login.html?next='+encodeURIComponent(location.href);return false}const p=await sb.from('profiles').select('role').eq('id',s.user.id).maybeSingle();const role=p.data?.role||s.user.app_metadata?.role||s.user.user_metadata?.role||'';if(p.error||role!=='admin'){$('status').className='card error';$('status').textContent='Admin access required.';return false}$('status').innerHTML='<b>Admin preview active.</b> Simulated student mode — no payment, real attempt, rank or publication is affected.';return true}
async function init(){if(!await guard())return;if(requestedId){await loadTest(requestedId);return}const r=await sb.from('ls_tests').select('id,title,question_count,duration_minutes,published,archived').eq('archived',false).order('id',{ascending:false});if(r.error){showError(r.error.message);return}const rows=r.data||[];const earth=rows.find(x=>/earth structure.*interior/i.test(x.title||''));if(earth){requestedId=earth.id;await loadTest(earth.id);return}showPicker(rows)}
function showError(m){$('app').innerHTML='<div class="card error">'+esc(m)+'</div>'}function showPicker(rows){$('app').innerHTML='<div class="card"><h2>Student Test Preview</h2><p class="muted">Select a test. Draft tests are included for examiner review.</p>'+rows.map(x=>'<div class="test-row"><div><b>'+esc(x.title)+'</b><div class="muted">Test ID '+x.id+' · '+esc(x.question_count??'—')+' questions · '+esc(x.duration_minutes??'—')+' min · '+(x.published?'Published':'Draft')+'</div></div><button class="btn" onclick="loadTest('+x.id+')">Start Preview</button></div>').join('')||'<p class="muted">No non-archived tests found.</p>'+'</div>'}
async function loadTest(id){stopTimer();submitted=false;started=false;answers={};idx=0;const tr=await sb.from('ls_tests').select('*').eq('id',id).eq('archived',false).maybeSingle();if(tr.error||!tr.data){showError(tr.error?.message||'Test not found.');return}test=tr.data;const qr=await sb.from('ls_test_questions').select('*').eq('test_id',id).order('display_order').order('id');if(qr.error){showError(qr.error.message);return}qs=qr.data||[];if(!qs.length){showError('This test has no questions yet.');return}secondsLeft=Math.max(60,Number(test.duration_minutes||test.duration||60)*60);renderInstructions()}
function renderInstructions(){const duration=Math.ceil(secondsLeft/60);$('app').innerHTML='<div class="card instructions"><div class="badge">DRAFT PREVIEW · EXAMINER MODE</div><h1>Ready to Begin?</h1><p class="muted">Please read the instructions carefully before starting the test.</p><div class="instruction-grid"><div class="instruction-box"><b>'+qs.length+'</b><span class="muted">Total Questions</span></div><div class="instruction-box"><b>'+duration+' min</b><span class="muted">Duration</span></div><div class="instruction-box"><b>1 mark</b><span class="muted">Per Question</span></div></div><h2>General Instructions</h2><ol class="rules"><li>This preview contains <b>'+qs.length+' multiple-choice questions</b>.</li><li>Each question carries <b>1 mark</b>.</li><li>Each incorrect answer carries a <b>0.33 mark negative penalty</b>.</li><li>Unanswered questions receive <b>0 marks</b> and no negative marking.</li><li>Only <b>one question is displayed at a time</b>. Select the most appropriate option.</li><li>Use <b>Save & Next</b> to move forward and <b>Previous</b> to revisit a question.</li><li>The <b>Question Navigator</b> lets you directly move to any question and shows which questions you have answered.</li><li>The timer starts only after you click <b>Start Test</b>. When time expires, the test is submitted automatically.</li><li>You can submit the test from the Question Navigator. If questions are unanswered, you will be asked to confirm submission.</li><li><b>Correct answers, explanations and sources are hidden during the test</b> and are shown only after submission.</li></ol><div class="notice"><b>Preview mode:</b> This is an admin examination preview. Your responses are simulated for review and do not create a real student attempt, payment, rank or percentile.</div><div class="ready"><div><b>You are ready to begin the test.</b><div class="muted">Once you click Start Test, the timer will begin.</div></div><button class="btn start" onclick="startTest()">Start Test →</button></div></div>'}
function startTest(){started=true;idx=0;answers={};secondsLeft=Math.max(60,Number(test.duration_minutes||test.duration||60)*60);renderTest();startTimer();window.scrollTo({top:0,behavior:'smooth'})}
function startTimer(){stopTimer();timerHandle=setInterval(()=>{if(submitted||!started)return;secondsLeft--;updateTimer();if(secondsLeft<=0){stopTimer();submitTest(true)}},1000);updateTimer()}function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}function updateTimer(){const el=$('timer');if(!el)return;const m=Math.floor(secondsLeft/60),s=secondsLeft%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function renderTest(){const q=qs[idx],answered=Object.keys(answers).length,pct=((idx+1)/qs.length)*100;$('app').innerHTML='<div class="card hero"><div><h1>'+esc(test.title)+'</h1><div class="meta"><span class="badge">DRAFT PREVIEW</span><span class="badge">Question '+(idx+1)+' of '+qs.length+'</span><span class="badge">Answered '+answered+'/'+qs.length+'</span></div></div><div class="timer" id="timer">--:--</div></div><div class="progress-wrap"><div class="progress" style="width:'+pct+'%"></div></div><div class="exam-layout"><div class="card qcard"><div class="qnum">Question '+(idx+1)+' of '+qs.length+'</div><div class="question">'+esc(q.question)+'</div>'+[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>'<button class="option '+(answers[q.id]===o[0]?'selected':'')+'" onclick="choose(\''+o[0]+'\')"><span class="letter">'+o[0]+'.</span><span>'+esc(o[1])+'</span></button>').join('')+'<div class="navrow"><button class="btn secondary" onclick="prev()" '+(idx===0?'disabled':'')+'>← Previous</button><button class="btn" onclick="next()" '+(idx===qs.length-1?'disabled':'')+'>Save & Next →</button></div></div><aside class="card navigator sidebar"><h3>Question Navigator</h3><div class="muted" style="margin-bottom:10px">Answered: '+answered+' / '+qs.length+'</div><div class="nums">'+qs.map((x,i)=>'<button class="num '+(i===idx?'current ':'')+(answers[x.id]?'answered':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('')+'</div><div class="summary" style="margin-top:14px"><span class="muted">Green underline = answered</span><button class="btn submit" onclick="confirmSubmit()">Submit Test</button></div></aside></div>'}
function choose(a){if(submitted||!started)return;answers[qs[idx].id]=a;renderTest();updateTimer()}function prev(){if(idx>0){idx--;renderTest();updateTimer();window.scrollTo({top:0,behavior:'smooth'})}}function next(){if(idx<qs.length-1){idx++;renderTest();updateTimer();window.scrollTo({top:0,behavior:'smooth'})}}function go(i){idx=i;renderTest();updateTimer();window.scrollTo({top:0,behavior:'smooth'})}
function confirmSubmit(){const unanswered=qs.length-Object.keys(answers).length;if(unanswered&&!confirm('You have '+unanswered+' unanswered question(s). Submit the test anyway?'))return;submitTest(false)}
function submitTest(auto){submitted=true;started=false;stopTimer();renderResult(auto)}
function renderResult(auto){let correct=0,wrong=0,unanswered=0;qs.forEach(q=>{const a=answers[q.id];if(!a)unanswered++;else if(a===q.correct_option)correct++;else wrong++});const score=correct-(wrong*(Number(test.negative_marks||test.negative_mark||0.33)));$('app').innerHTML='<div class="card result"><h2>Test Submitted</h2><p class="muted">Admin Student Preview — this result is simulated and does not create a real attempt, payment, rank or percentile.</p>'+ (auto?'<div class="notice error"><b>Time expired.</b> The test was auto-submitted.</div>':'')+'<div class="result-grid"><div class="stat"><b>'+correct+'</b><span>Correct</span></div><div class="stat"><b>'+wrong+'</b><span>Wrong</span></div><div class="stat"><b>'+unanswered+'</b><span>Unanswered</span></div></div><p><b>Simulated Score:</b> '+score.toFixed(2)+'</p><button class="btn" onclick="loadTest(test.id)">Restart Preview</button></div>'}
init();
</script></body></html>
