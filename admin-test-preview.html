<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Active Test Preview | LakshyaSetu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260903-1400"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font-family:Arial,sans-serif}.top{background:#173b67;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:700}.wrap{width:min(1100px,94%);margin:22px auto}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #0000000d}.hero{background:linear-gradient(135deg,#173b67,#285da7);color:#fff}.muted{color:#64748b}.q{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:18px}.option{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:1px solid #ccd6e3;border-radius:9px;background:#f8fafc;cursor:pointer;font-size:15px}.option:hover{background:#eef4ff}.option.selected{border:2px solid #2457a6;background:#eef4ff}.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px}.btn{padding:11px 16px;border:0;border-radius:8px;background:#173b67;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.45;cursor:not-allowed}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8eef7;color:#172b4d;font-size:12px;margin-right:6px}.ok{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.test-row{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid #dbe4ef;border-radius:10px;padding:15px;margin:10px 0}@media(max-width:650px){.top{align-items:flex-start;gap:10px;flex-direction:column}.q{font-size:17px}.test-row{align-items:flex-start;flex-direction:column}}
</style></head>
<body><header class="top"><div><strong>LakshyaSetu</strong><div style="font-size:12px;opacity:.8">Active Test Preview · Admin only</div></div><div><a href="admin-v2.html">Control Center</a> &nbsp;|&nbsp; <a href="mcq-verifier.html">MCQ Verification</a></div></header><main class="wrap"><div id="status" class="card">Checking admin session...</div><div id="app"></div></main>
<script>
const sb=getLakshyaSetuDb(),params=new URLSearchParams(location.search),requestedId=Number(params.get('test')||params.get('test_id')||0);let test=null,qs=[],idx=0,answers={};const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
async function guard(){const r=await sb.auth.getSession(),s=r?.data?.session;if(!s){location.href='login.html?next='+encodeURIComponent(location.href);return false}const p=await sb.from('profiles').select('role').eq('id',s.user.id).single();if(p.error||p.data?.role!=='admin'){$('status').innerHTML='<div class="error">Admin access required.</div>';return false}$('status').innerHTML='<span class="badge ok">Admin preview session active — no attempt, payment or rank is affected.</span>';return true}
async function init(){if(!await guard())return;if(!requestedId){await showTestPicker();return}const tr=await sb.from('ls_tests').select('*').eq('id',requestedId).eq('published',true).eq('archived',false).single();if(tr.error){$('app').innerHTML='<div class="card error">This test is not an active published test and cannot be previewed.</div>';return}test=tr.data;await loadQuestions()}
async function showTestPicker(){const r=await sb.from('ls_tests').select('id,title,question_count,duration_minutes').eq('published',true).eq('archived',false).order('id',{ascending:false});if(r.error){$('app').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';return}const rows=r.data||[];$('app').innerHTML='<div class="card"><h2>Active Test Preview</h2><p class="muted">Only published, non-archived tests are shown. Each active test must contain exactly 50 MCQs.</p>'+rows.map(x=>'<div class="test-row"><div><h3 style="margin:0 0 5px">'+esc(x.title)+'</h3><div class="muted">Test ID '+x.id+' · '+esc(x.question_count??'—')+' questions · '+esc(x.duration_minutes??'—')+' min</div></div><a class="btn" href="admin-test-preview.html?test='+x.id+'">Preview</a></div>').join('')||'<p>No active tests are published yet.</p>'+'</div>'}
async function loadQuestions(){const qr=await sb.from('ls_test_questions').select('*').eq('test_id',test.id).order('display_order').order('id');if(qr.error){$('app').innerHTML='<div class="card error">'+esc(qr.error.message)+'</div>';return}qs=qr.data||[];if(qs.length!==50){$('app').innerHTML='<div class="card error"><b>Launch blocked for preview.</b><p>This test currently contains '+qs.length+' MCQs. It must contain exactly 50.</p></div>';return}render()}
function render(){const q=qs[idx];$('app').innerHTML='<div class="card hero"><h1 style="margin-top:0">'+esc(test.title)+'</h1><div><span class="badge">ACTIVE TEST</span><span class="badge">50 MCQs</span><span class="badge">Question '+(idx+1)+' of 50</span></div></div><div class="card"><div class="q">Q'+(idx+1)+'. '+esc(q.question)+'</div>'+[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>'<button class="option '+(answers[q.id]===o[0]?'selected':'')+'" onclick="choose(\''+o[0]+'\')"><b>'+o[0]+'.</b> '+esc(o[1])+'</button>').join('')+'<div class="nav"><button class="btn" onclick="prev()" '+(idx===0?'disabled':'')+'>← Previous</button><button class="btn" onclick="next()" '+(idx===qs.length-1?'disabled':'')+'>Next →</button></div></div><div class="card"><button class="btn" onclick="showAnswer()">Show Correct Answer & Explanation</button><button class="btn" onclick="clearAnswer()">Hide Answer</button><div id="solution"></div></div>'}
function choose(a){answers[qs[idx].id]=a;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(idx<qs.length-1){idx++;render()}}function showAnswer(){const q=qs[idx];$('solution').innerHTML='<div class="card" style="margin-top:15px;background:#f8fafc"><b>Correct answer: '+esc(q.correct_option||'Not set')+'</b><p class="muted">'+esc(q.explanation||'No explanation provided.')+'</p><div><b>Source:</b> '+esc(q.source_reference||'Not provided')+'</div></div>'}function clearAnswer(){$('solution').innerHTML=''}
init();
</script></body></html>
