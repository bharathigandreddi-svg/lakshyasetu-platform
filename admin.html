<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | LakshyaSetu</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div class="brand">LakshyaSetu Admin <small>Content Management</small></div><button id="logout" class="btn alt" style="display:none">Logout</button></header>
<main class="wrap"><div id="msg" class="message"></div>
<section id="adminLogin" class="auth panel" style="display:none"><h1>Admin Login</h1><p class="muted">Sign in with your Admin account to manage courses and lessons.</p><form id="adminLoginForm" class="form"><label>Email</label><input id="adminEmail" type="email" required><label>Password</label><input id="adminPassword" type="password" required><button class="btn">Login</button></form></section>
<div id="adminDashboard" style="display:none"><div class="stats"><div class="stat"><strong id="courseCount">0</strong>Courses</div><div class="stat"><strong id="lessonCount">0</strong>Lessons</div><div class="stat"><strong id="mcqCount">0</strong>MCQs</div><div class="stat"><strong>Admin</strong>Role</div></div>
<section class="panel"><h2>Add Geography Lesson</h2><form id="lessonForm" class="form"><label>Course</label><select id="courseSelect" required></select><label>Lesson title</label><input id="lessonTitle" value="Latitude and Longitude" required><label>Description</label><textarea id="lessonDescription">Understand latitude, longitude, important parallels and meridians, time calculation and Indian Standard Time.</textarea><label>Video URL</label><input id="videoUrl" placeholder="Temporary video URL"><label>PDF URL</label><input id="pdfUrl" placeholder="Temporary PDF URL"><label><input id="published" type="checkbox" checked> Publish lesson</label><button class="btn">Save Lesson to Database</button></form></section>
<section class="panel"><h2>Existing Lessons</h2><div id="lessons" class="list"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=window.supabase.createClient(LAKSHYASETU_CONFIG.supabaseUrl,LAKSHYASETU_CONFIG.supabasePublishableKey);
function show(t,e=false){msg.textContent=t;msg.className="message show"+(e?" error":"")}
function showLogin(){adminLogin.style.display="";adminDashboard.style.display="none";logout.style.display="none"}
function showDashboard(){adminLogin.style.display="none";adminDashboard.style.display="";logout.style.display=""}
async function boot(){const s=await sb.auth.getSession();const user=s.data&&s.data.session&&s.data.session.user;if(!user){showLogin();return}const p=await sb.from("profiles").select("full_name,role").eq("id",user.id).single();if(p.error){show("Could not verify admin access. Please refresh and try again.",true);return}if(p.data.role!=="admin"){location.href="student.html";return}showDashboard();load()}
adminLoginForm.onsubmit=async e=>{e.preventDefault();show("Signing in...");const r=await sb.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});if(r.error){show(r.error.message,true);return}boot()}
async function load(){const c=await sb.from("courses").select("*").order("id");if(c.error){show(c.error.message,true);return}courseCount.textContent=c.data.length;courseSelect.innerHTML=c.data.map(x=>'<option value="'+x.id+'">'+x.title+'</option>').join("");const l=await sb.from("lessons").select("*").order("sort_order");if(l.error){show(l.error.message,true);return}lessonCount.textContent=l.data.length;lessons.innerHTML=l.data.map(x=>'<div class="item"><b>'+x.title+'</b><p class="muted">'+(x.description||"")+'</p><span class="status">'+(x.published?"Published":"Draft")+"</span></div>").join("")||'<div class="item">No lessons yet.</div>'}
lessonForm.onsubmit=async e=>{e.preventDefault();show("Saving...");const r=await sb.from("lessons").insert({course_id:Number(courseSelect.value),title:lessonTitle.value.trim(),description:lessonDescription.value.trim(),video_url:videoUrl.value.trim()||null,pdf_url:pdfUrl.value.trim()||null,sort_order:1,published:published.checked});if(r.error){show(r.error.message,true);return}show("Lesson saved successfully.");load()}
logout.onclick=async()=>{await sb.auth.signOut();showLogin()};sb.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")showLogin()});boot();
</script></body></html>
