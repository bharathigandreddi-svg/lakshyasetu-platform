<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Manager | LakshyaSetu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font-family:Arial,sans-serif}.top{background:#173b67;color:#fff;padding:18px 24px}.top a{color:#fff}.wrap{width:min(1180px,95%);margin:20px auto}.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700;font-size:13px;display:block;margin-bottom:5px}select,input,textarea{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:6px}textarea{min-height:90px}.primary{background:#173b67;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}.secondary{background:#e8eef7;color:#173b67;border:0;border-radius:6px;padding:7px 10px;font-weight:700;cursor:pointer}.msg{padding:11px;border-radius:7px;margin-bottom:14px;display:none}.ok{background:#e9f8ef;color:#146c43}.bad{background:#ffe9e7;color:#9b1c13}.row{border:1px solid #dce4ee;border-radius:8px;padding:12px;margin:9px 0}.muted{color:#64748b;font-size:13px}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><h2>LakshyaSetu Content Manager</h2><div>Course → Subject → Topic → Lesson &nbsp; <a href="admin-v2.html">Back to Admin</a></div></header><main class="wrap"><div id="msg" class="msg"></div><div class="card"><h2>1. Course</h2><div class="grid"><div><label>Existing Course</label><select id="course"></select></div><div><label>Course Title (for new course)</label><input id="newCourseTitle"></div><div><label>Course Slug</label><input id="newCourseSlug"></div><div><label>Exam Code</label><input id="newCourseCode" placeholder="e.g. UPSC_CSE, APPSC_GROUP_1"></div><div style="grid-column:1/-1"><label>Description</label><textarea id="newCourseDescription"></textarea></div></div><br><button class="primary" onclick="saveCourse()">Create New Course</button><p class="muted">Existing published courses are available for selection. New courses are created as Draft until approved.</p></div><div class="card"><h2>2. Course Subjects</h2><div class="grid"><div><label>Existing Subject</label><select id="subject"></select></div><div><label>Subject Title (for new subject)</label><input id="newSubjectTitle"></div><div><label>Subject Slug</label><input id="newSubjectSlug"></div><div><label>Display Order</label><input id="order" type="number" value="0"></div><div style="grid-column:1/-1"><label>Description</label><textarea id="newSubjectDescription"></textarea></div></div><br><button class="primary" onclick="saveSubject()">Create New Subject</button> <button class="secondary" onclick="saveMapping()">Save / Update Mapping</button><div id="mappings"></div></div><div class="card"><h2>3. Topics for Selected Subject</h2><div class="grid"><div><label>Existing Topic</label><select id="topic"></select></div><div><label>Topic Fee</label><input id="topicFee" type="number" min="0"></div><div><label>Validity Days</label><input id="topicValidity" type="number" min="0"></div><div><label>Display Order</label><input id="topicOrder" type="number" value="0"></div><div><label>New Topic Title</label><input id="newTopicTitle"></div><div><label>New Topic Slug</label><input id="newTopicSlug"></div></div><br><button class="primary" onclick="saveTopic()">Create / Update Topic</button></div><div class="card"><h2>4. Lessons for Selected Topic</h2><div class="grid"><div><label>Lesson Title</label><input id="lessonTitle"></div><div><label>Video URL</label><input id="video"></div><div><label>PDF URL</label><input id="pdf"></div><div><label>Fee</label><input id="lessonFee" type="number" min="0"></div><div><label>Validity Days</label><input id="lessonValidity" type="number" min="0"></div><div><label>Trial</label><select id="trial"><option value="false">No</option><option value="true">Yes</option></select></div><div style="grid-column:1/-1"><label>Description</label><textarea id="description"></textarea></div></div><br><button class="primary" onclick="saveLesson()">Create Lesson</button><div id="lessons"></div></div></main><script>
const db=getLakshyaSetuDb();let courses=[],subjects=[],maps=[],topics=[],lessons=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function msg(t,bad=false){$('msg').textContent=t;$('msg').className='msg '+(bad?'bad':'ok');$('msg').style.display='block'}async function guard(){const r=await db.auth.getSession();if(!r?.data?.session){location.href='login.html?next='+encodeURIComponent(location.href);return false}const s=r.data.session,p=await db.from('profiles').select('role').eq('id',s.user.id).maybeSingle(),role=p.data?.role||s.user.app_metadata?.role||s.user.user_metadata?.role||'';if(p.error||role!=='admin'){msg('Admin access required.',true);return false}return true}function slug(v){return v.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
async function load(){const r=await Promise.all([db.from('ls_courses').select('id,title,published,archived').eq('archived',false).order('display_order'),db.from('ls_subjects').select('id,title,description,published,archived').eq('archived',false).order('display_order'),db.from('ls_course_subjects').select('id,course_id,subject_id,display_order,published,archived').eq('archived',false).order('display_order'),db.from('ls_topics').select('id,course_subject_id,title,slug,description,display_order,topic_fee,validity_days,published,archived').eq('archived',false).order('display_order'),db.from('ls_lessons').select('id,topic_id,title,description,video_url,pdf_url,display_order,video_fee,validity_days,is_trial,published').eq('archived',false).order('display_order')]);for(const x of r)if(x.error)throw x.error;[courses,subjects,maps,topics,lessons]=r.map(x=>x.data||[]);fill('course',courses.filter(x=>x.published),'title','Select course');refreshCourse()}
function fill(id,arr,label,empty='Select'){ $(id).innerHTML='<option value="">'+empty+'</option>'+(arr||[]).map(x=>`<option value="${x.id}">${esc(typeof label==='function'?label(x):x[label])}</option>`).join('') }
function refreshCourse(){const cid=+$('course').value,ms=maps.filter(x=>x.course_id===cid&&!x.archived),ids=ms.filter(x=>x.published).map(x=>x.subject_id);$('mappings').innerHTML=ms.map(m=>{const s=subjects.find(x=>x.id===m.subject_id);return `<div class="row"><b>${esc(s?.title||'Unknown')}</b> <span class="muted">order ${m.display_order??0} · ${m.published?'Published':'Hidden'}</span> <button class="secondary" onclick="selectMap(${m.subject_id},${m.display_order??0})">Manage</button></div>`}).join('')||'<p class="muted">No subjects mapped yet.</p>';fill('subject',subjects.filter(x=>ids.includes(x.id)&&x.published&&!x.archived),'title','Select mapped subject');$('topic').innerHTML='<option value="">Select subject first</option>';if($('subject').value)refreshSubject()}
function selectMap(sid,ord){$('subject').value=sid;$('order').value=ord;refreshSubject()}
function refreshSubject(){const cid=+$('course').value,sid=+$('subject').value,m=maps.find(x=>x.course_id===cid&&x.subject_id===sid&&!x.archived);if(!m){$('topic').innerHTML='<option value="">Select subject first</option>';return}const ts=topics.filter(x=>x.course_subject_id===m.id&&!x.archived);fill('topic',ts,'title','Select topic');$('lessons').innerHTML='';if(ts.length){$('topic').value=ts[0].id;refreshTopic()}}
function refreshTopic(){const tid=+$('topic').value,t=topics.find(x=>x.id===tid);if(t){$('topicFee').value=t.topic_fee??'';$('topicValidity').value=t.validity_days??'';$('topicOrder').value=t.display_order??0}$('lessons').innerHTML=lessons.filter(x=>x.topic_id===tid).map(x=>`<div class="row"><b>${esc(x.title)}</b><div class="muted">${x.is_trial?'Trial':'Paid'} · ${x.published?'Published':'Draft'}${x.video_url?' · Video':''}${x.pdf_url?' · PDF':''}</div></div>`).join('')||'<p class="muted">No lessons for this topic yet.</p>'}
$('course').onchange=refreshCourse;$('subject').onchange=refreshSubject;$('topic').onchange=refreshTopic;
async function saveCourse(){try{const title=$('newCourseTitle').value.trim();if(!title)throw Error('Enter a Course Title.');const p={title,slug:$('newCourseSlug').value.trim()||slug(title),exam_code:$('newCourseCode').value.trim()||null,description:$('newCourseDescription').value.trim()||null,display_order:courses.length,published:false,archived:false};const r=await db.from('ls_courses').insert(p).select('id').single();if(r.error)throw r.error;msg('New Course created as Draft. Approve it before publishing.');['newCourseTitle','newCourseSlug','newCourseCode','newCourseDescription'].forEach(x=>$(x).value='');await load()}catch(e){msg(e.message,true)}}
async function saveSubject(){try{const title=$('newSubjectTitle').value.trim();if(!title)throw Error('Enter a Subject Title.');const p={title,slug:$('newSubjectSlug').value.trim()||slug(title),description:$('newSubjectDescription').value.trim()||null,display_order:+$('order').value||0,published:false,archived:false};const r=await db.from('ls_subjects').insert(p).select('id').single();if(r.error)throw r.error;msg('New Subject created as Draft. Map it to a Course after approval.');['newSubjectTitle','newSubjectSlug','newSubjectDescription'].forEach(x=>$(x).value='');await load()}catch(e){msg(e.message,true)}}
async function saveMapping(){try{const cid=+$('course').value,sid=+$('subject').value;if(!cid||!sid)throw Error('Select both Course and Subject.');const old=maps.find(x=>x.course_id===cid&&x.subject_id===sid),p={course_id:cid,subject_id:sid,display_order:+$('order').value||0,published:true,archived:false};const r=old?await db.from('ls_course_subjects').update(p).eq('id',old.id):await db.from('ls_course_subjects').insert(p);if(r.error)throw r.error;msg('Course-Subject mapping saved.');await load();$('course').value=cid;refreshCourse();$('subject').value=sid;refreshSubject()}catch(e){msg(e.message,true)}}
async function saveTopic(){try{const cid=+$('course').value,sid=+$('subject').value,m=maps.find(x=>x.course_id===cid&&x.subject_id===sid&&!x.archived);if(!m)throw Error('Map the Subject to this Course first.');const tid=+$('topic').value,title=$('newTopicTitle').value.trim(),p={course_subject_id:m.id,topic_fee:$('topicFee').value===''?null:+$('topicFee').value,validity_days:$('topicValidity').value===''?null:+$('topicValidity').value,display_order:+$('topicOrder').value||0,published:false,archived:false};let r;if(tid){p.published=topics.find(x=>x.id===tid)?.published??false;r=await db.from('ls_topics').update(p).eq('id',tid)}else{if(!title)throw Error('Enter a New Topic Title.');p.title=title;p.slug=$('newTopicSlug').value.trim()||slug(title);r=await db.from('ls_topics').insert(p)}if(r.error)throw r.error;msg(tid?'Topic updated.':'New Topic created as Draft.');await load();$('course').value=cid;refreshCourse();$('subject').value=sid;refreshSubject()}catch(e){msg(e.message,true)}}
async function saveLesson(){try{const tid=+$('topic').value,title=$('lessonTitle').value.trim();if(!tid)throw Error('Select a Topic first.');if(!title)throw Error('Enter a Lesson Title.');const p={topic_id:tid,title,description:$('description').value.trim()||null,video_url:$('video').value.trim()||null,pdf_url:$('pdf').value.trim()||null,video_fee:$('lessonFee').value===''?null:+$('lessonFee').value,validity_days:$('lessonValidity').value===''?null:+$('lessonValidity').value,is_trial:$('trial').value==='true',published:false,archived:false};const r=await db.from('ls_lessons').insert(p);if(r.error)throw r.error;msg('New Lesson created as Draft. Approve it before publishing.');['lessonTitle','video','pdf','lessonFee','lessonValidity','description'].forEach(x=>$(x).value='');await load()}catch(e){msg(e.message,true)}}
(async()=>{if(await guard())try{await load()}catch(e){msg(e.message,true)}})();
</script></body></html>
