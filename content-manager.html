<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LakshyaSetu Content Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font-family:Arial,sans-serif}.top{background:#173b67;color:#fff;padding:18px 24px}.wrap{width:min(1180px,95%);margin:20px auto}.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700;font-size:13px;display:block;margin-bottom:5px}select,input,textarea{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:6px}textarea{min-height:90px}.primary{background:#173b67;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}.secondary{background:#e8eef7;color:#173b67;border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}.msg{padding:11px;border-radius:7px;margin-bottom:14px;display:none}.ok{background:#e9f8ef;color:#146c43}.bad{background:#ffe9e7;color:#9b1c13}.row{border:1px solid #dce4ee;border-radius:8px;padding:12px;margin:9px 0}.muted{color:#64748b;font-size:13px}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><h2>LakshyaSetu Content Manager</h2><div>Course → Subject → Topic → Lesson</div></header>
<main class="wrap">
<div id="msg" class="msg"></div>
<div class="card"><h2>1. Select Course</h2><select id="course"></select><p class="muted">Only the selected course controls the rest of this screen.</p></div>
<div class="card"><h2>2. Course Subjects</h2><div class="grid"><div><label>Subject</label><select id="subject"></select></div><div><label>Display Order</label><input id="order" type="number" value="0"></div></div><br><button class="primary" onclick="saveMapping()">Save / Update Mapping</button><div id="mappings"></div></div>
<div class="card"><h2>3. Topics for Selected Subject</h2><div class="grid"><div><label>Topic</label><select id="topic"></select></div><div><label>Topic Fee</label><input id="topicFee" type="number"></div><div><label>Validity Days</label><input id="topicValidity" type="number"></div><div><label>Display Order</label><input id="topicOrder" type="number" value="0"></div><div><label>Topic Title (for new topic)</label><input id="newTopicTitle"></div><div><label>Topic Slug</label><input id="newTopicSlug"></div></div><br><button class="primary" onclick="saveTopic()">Save Topic</button></div>
<div class="card"><h2>4. Lessons for Selected Topic</h2><div class="grid"><div><label>Lesson Title</label><input id="lessonTitle"></div><div><label>Video URL</label><input id="video"></div><div><label>PDF URL</label><input id="pdf"></div><div><label>Fee</label><input id="lessonFee" type="number"></div><div><label>Validity Days</label><input id="lessonValidity" type="number"></div><div><label>Trial</label><select id="trial"><option value="false">No</option><option value="true">Yes</option></select></div><div class="full"><label>Description</label><textarea id="description"></textarea></div></div><br><button class="primary" onclick="saveLesson()">Create Lesson</button><div id="lessons"></div></div>
</main>
<script>
const db=getLakshyaSetuDb();let courses=[],subjects=[],maps=[],topics=[],lessons=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(t,bad=false){$('msg').textContent=t;$('msg').className='msg '+(bad?'bad':'ok');$('msg').style.display='block'}
async function guard(){const r=await db.auth.getSession();if(!r?.data?.session){location.href='login.html?next='+encodeURIComponent(location.href);return false}return true}
function fill(id,arr,label,empty='Select'){ $(id).innerHTML='<option value="">'+empty+'</option>'+arr.map(x=>`<option value="${x.id}">${esc(typeof label==='function'?label(x):x[label])}</option>`).join('') }
async function load(){
let r=await Promise.all([db.from('ls_courses').select('id,title,published,archived').order('display_order'),db.from('ls_subjects').select('id,title,published,archived').order('display_order'),db.from('ls_course_subjects').select('*').order('display_order'),db.from('ls_topics').select('*').order('display_order'),db.from('ls_lessons').select('*').order('display_order')]);
for(const x of r)if(x.error)throw x.error;[courses,subjects,maps,topics,lessons]=r.map(x=>x.data||[]);fill('course',courses.filter(x=>x.published&&!x.archived),'title');fill('subject',subjects.filter(x=>x.published&&!x.archived),'title');refreshCourse();}
function refreshCourse(){const cid=+$('course').value;const ms=maps.filter(x=>x.course_id===cid);$('mappings').innerHTML=ms.map(m=>{const s=subjects.find(x=>x.id===m.subject_id);return `<div class="row"><b>${esc(s?.title||'Unknown')}</b> <span class="muted">order ${m.display_order??0}</span> <button class="secondary" onclick="selectMap(${m.subject_id},${m.display_order??0})">Manage</button></div>`}).join('')||'<p class="muted">No subjects mapped to this course yet.</p>';refreshSubject();}
function selectMap(sid,ord){$('subject').value=sid;$('order').value=ord;refreshSubject()}
function refreshSubject(){const cid=+$('course').value,sid=+$('subject').value;const m=maps.find(x=>x.course_id===cid&&x.subject_id===sid);if(m)$('order').value=m.display_order??0;const ts=topics.filter(x=>x.course_subject_id===m?.id);fill('topic',ts,'title');refreshTopic();}
function refreshTopic(){const tid=+$('topic').value;const ls=lessons.filter(x=>x.topic_id===tid);$('lessons').innerHTML=ls.map(x=>`<div class="row"><b>${esc(x.title)}</b><div class="muted">${x.is_trial?'Trial':'Paid'} · ${x.published?'Published':'Draft'}</div></div>`).join('')||'<p class="muted">No lessons for this topic yet.</p>';}
$('course').onchange=refreshCourse;$('subject').onchange=refreshSubject;$('topic').onchange=refreshTopic;
async function saveMapping(){try{const cid=+$('course').value,sid=+$('subject').value;if(!cid||!sid)throw Error('Select both Course and Subject.');const old=maps.find(x=>x.course_id===cid&&x.subject_id===sid);const p={course_id:cid,subject_id:sid,display_order:+$('order').value||0,published:true,archived:false};const r=old?await db.from('ls_course_subjects').update(p).eq('id',old.id):await db.from('ls_course_subjects').insert(p);if(r.error)throw r.error;msg('Course-Subject mapping saved.');await load();$('course').value=cid;refreshCourse();$('subject').value=sid;refreshSubject();}catch(e){msg(e.message,true)}}
async function saveTopic(){try{const cid=+$('course').value,sid=+$('subject').value;let m=maps.find(x=>x.course_id===cid&&x.subject_id===sid);if(!m)throw Error('Map the Subject to this Course first.');let tid=+$('topic').value;let title=$('newTopicTitle').value.trim();let p={course_subject_id:m.id,title:title||undefined,slug:$('newTopicSlug').value.trim()||undefined,topic_fee:$('topicFee').value===''?null:+$('topicFee').value,validity_days:$('topicValidity').value===''?null:+$('topicValidity').value,display_order:+$('topicOrder').value||0,published:true,archived:false};let r;if(tid){delete p.title;delete p.slug;r=await db.from('ls_topics').update(p).eq('id',tid)}else{if(!title)throw Error('Enter a Topic Title for a new topic.');r=await db.from('ls_topics').insert(p)}if(r.error)throw r.error;msg(tid?'Topic updated.':'Topic created.');await load();$('course').value=cid;refreshCourse();$('subject').value=sid;refreshSubject();}catch(e){msg(e.message,true)}}
async function saveLesson(){try{const tid=+$('topic').value;if(!tid)throw Error('Select a Topic first.');const p={topic_id:tid,title:$('lessonTitle').value.trim(),description:$('description').value.trim()||null,video_url:$('video').value.trim()||null,pdf_url:$('pdf').value.trim()||null,video_fee:$('lessonFee').value===''?null:+$('lessonFee').value,validity_days:$('lessonValidity').value===''?null:+$('lessonValidity').value,is_trial:$('trial').value==='true',published:true};if(!p.title)throw Error('Enter a Lesson Title.');const r=await db.from('ls_lessons').insert(p);if(r.error)throw r.error;msg('Lesson created.');['lessonTitle','video','pdf','lessonFee','lessonValidity','description'].forEach(x=>$(x).value='');await load();$('course').value=+$('course').value;refreshCourse();$('subject').value=+$('subject').value;refreshSubject();$('topic').value=tid;refreshTopic();}catch(e){msg(e.message,true)}}
(async()=>{if(await guard())try{await load()}catch(e){msg(e.message,true)}})();
</script></body></html>
