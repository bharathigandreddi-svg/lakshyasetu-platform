<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Subject Mapping | LakshyaSetu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font-family:Arial}.top{background:#173b67;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.wrap{width:min(1100px,94%);margin:20px auto}.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:18px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}select,input{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:6px}button{border:0;border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:700;background:#173b67;color:#fff}.secondary{background:#e8eef7;color:#173b67}.item{border:1px solid #dce4ee;border-radius:8px;padding:14px;margin:10px 0}.ok{color:#166534}.bad{color:#991b1b}.muted{color:#64748b;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
<header class="top"><strong>LakshyaSetu — Course Subject Mapping</strong><a href="admin.html">Back to Admin</a></header>
<main class="wrap">
<div class="card"><h2>Course → Subject Mapping</h2><p class="muted">Select the course and subject. IDs are never required. Existing mappings are updated instead of duplicated.</p><div class="grid"><div><label>Course</label><select id="course"></select></div><div><label>Subject</label><select id="subject"></select></div><div><label>Display Order</label><input id="order" type="number" value="0"></div><div><label>Subject Fee</label><input id="fee" type="number" min="0" value="0"></div><div><label>Validity Days</label><input id="validity" type="number" min="0" placeholder="Optional"></div></div><p><label><input id="published" type="checkbox" checked style="width:auto"> Published</label></p><button onclick="saveMapping()">Save Mapping</button><span id="msg" style="margin-left:10px"></span></div>
<div class="card"><h2>Current Mappings</h2><div id="list">Loading...</div></div>
</main>
<script>
const sb=window.getLakshyaSetuDb?getLakshyaSetuDb():window.supabase.createClient(LAKSHYASETU_CONFIG.supabaseUrl,LAKSHYASETU_CONFIG.supabasePublishableKey);const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));let mappings=[];
async function guard(){const s=await sb.auth.getSession();if(!s.data.session){location='login.html';return false}return true}
async function load(){if(!(await guard()))return;const [c,s,m]=await Promise.all([sb.from('ls_courses').select('id,title').eq('archived',false).order('display_order').order('id'),sb.from('ls_subjects').select('id,title').eq('archived',false).order('display_order').order('id'),sb.from('ls_course_subjects').select('id,course_id,subject_id,display_order,published,archived,subject_fee,validity_days,ls_courses(title),ls_subjects(title)').order('course_id').order('display_order')]);if(c.error||s.error||m.error){setMsg(c.error?.message||s.error?.message||m.error?.message,true);return}$('course').innerHTML='<option value="">Select Course</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');$('subject').innerHTML='<option value="">Select Subject</option>'+(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');mappings=m.data||[];render()}
function render(){$('list').innerHTML=mappings.map(x=>`<div class="item"><strong>${esc(x.ls_courses?.title||'Course')}</strong> — ${esc(x.ls_subjects?.title||'Subject')} <span class="muted">| Order ${x.display_order||0} | Fee ₹${Number(x.subject_fee||0).toLocaleString('en-IN')} | ${x.validity_days?x.validity_days+' days':'No validity'} | ${x.published?'Published':'Hidden'}</span><button class="secondary" style="float:right" onclick="loadMapping(${x.id})">Edit</button></div>`).join('')||'<p>No mappings yet.</p>'}
function loadMapping(id){const x=mappings.find(v=>v.id==id);if(!x)return;$('course').value=x.course_id;$('subject').value=x.subject_id;$('order').value=x.display_order??0;$('fee').value=x.subject_fee??0;$('validity').value=x.validity_days??'';$('published').checked=!!x.published;window.scrollTo({top:0,behavior:'smooth'})}
function setMsg(t,bad=false){$('msg').textContent=t;$('msg').className=bad?'bad':'ok'}
async function saveMapping(){if(!(await guard()))return;if(!$('course').value||!$('subject').value){setMsg('Select both Course and Subject.',true);return}setMsg('Saving...');const payload={course_id:Number($('course').value),subject_id:Number($('subject').value),display_order:Number($('order').value||0),subject_fee:Number($('fee').value||0),validity_days:$('validity').value===''?null:Number($('validity').value),published:$('published').checked,archived:false};const existing=await sb.from('ls_course_subjects').select('id').eq('course_id',payload.course_id).eq('subject_id',payload.subject_id).limit(1).maybeSingle();if(existing.error){setMsg(existing.error.message,true);return}const r=existing.data?await sb.from('ls_course_subjects').update(payload).eq('id',existing.data.id):await sb.from('ls_course_subjects').insert(payload);if(r.error){setMsg(r.error.message,true);return}setMsg(existing.data?'Mapping updated.':'Mapping created.');await load()}
load();
</script>
</body>
</html>
