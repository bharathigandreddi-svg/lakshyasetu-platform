<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Subject Mapping | LakshyaSetu</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font-family:Arial}.top{background:#173b67;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.wrap{width:min(1100px,94%);margin:20px auto}.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:18px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}select,input{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:6px}button{border:0;border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:700;background:#173b67;color:#fff}.item{border:1px solid #dce4ee;border-radius:8px;padding:14px;margin:10px 0}.ok{color:#166534}.bad{color:#991b1b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><strong>LakshyaSetu — Course Subject Mapping</strong><a href="admin.html" style="color:#fff">Back to Admin</a></header><main class="wrap"><div class="card"><h2>Map Subject to Course</h2><p>Select Course and Subject. No IDs need to be typed.</p><div class="grid"><div><label>Course</label><select id="course"></select></div><div><label>Subject</label><select id="subject"></select></div><div><label>Display Order</label><input id="order" type="number" value="0"></div><div><label>Subject Fee</label><input id="fee" type="number" value="0"></div></div><p><label><input id="published" type="checkbox" checked style="width:auto"> Published</label></p><button onclick="save()">Save Mapping</button><span id="msg"></span></div><div class="card"><h2>Current Mappings</h2><div id="list">Loading...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=window.supabase.createClient(LAKSHYASETU_CONFIG.supabaseUrl,LAKSHYASETU_CONFIG.supabasePublishableKey);const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));async function load(){const [c,s]=await Promise.all([sb.from('ls_courses').select('id,title').eq('archived',false).order('display_order').order('id'),sb.from('ls_subjects').select('id,title').eq('archived',false).order('display_order').order('id')]);if(c.error||s.error){msg.textContent=c.error?.message||s.error?.message;msg.className='bad';return}course.innerHTML=(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');subject.innerHTML=(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');await list()}async function list(){const r=await sb.from('ls_course_subjects').select('id,course_id,subject_id,display_order,published,archived,subject_fee,ls_courses(title),ls_subjects(title)').order('course_id').order('display_order');if(r.error){document.getElementById('list').textContent=r.error.message;return}document.getElementById('list').innerHTML=(r.data||[]).map(x=>`<div class="item"><strong>${esc(x.ls_courses?.title||'Course')}</strong> → ${esc(x.ls_subjects?.title||'Subject')} <small> | Order ${x.display_order||0} | ₹${Number(x.subject_fee||0).toLocaleString('en-IN')} | ${x.published?'Published':'Hidden'}</small></div>`).join('')||'No mappings yet.'}async function save(){msg.textContent='Saving...';msg.className='';const r=await sb.from('ls_course_subjects').insert({course_id:Number(course.value),subject_id:Number(subject.value),display_order:Number(order.value||0),subject_fee:Number(fee.value||0),published:published.checked,archived:false});if(r.error){msg.textContent=r.error.message;msg.className='bad';return}msg.textContent=' Saved';msg.className='ok';await list()}load();</script></body></html>
