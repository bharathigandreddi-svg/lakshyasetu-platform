<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course | LakshyaSetu</title><style>body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 20px}.brand{font-weight:900;color:#183b75;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:18px}.meta{color:#64748b;font-size:13px}.btn{display:inline-block;background:#173b67;color:#fff;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:800;font-size:13px;margin-top:10px}.back{display:inline-block;margin-bottom:12px;color:#2457a6;font-weight:800;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu</a></header><main class="wrap"><div id="app">Loading…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909"></script><script>(async()=>{const db=getLakshyaSetuDb(),a=document.getElementById('app'),p=new URLSearchParams(location.search),id=Number(p.get('course')),e=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));try{if(!id)throw Error('Missing course ID.');let c=await db.from('ls_courses').select('*').eq('id',id).eq('published',true).eq('archived',false).single();if(c.error)throw c.error;let r=await db.from('ls_course_subjects').select('id,subject_id').eq('course_id',id).eq('published',true).eq('archived',false).order('id'),s=await db.from('ls_subjects').select('id,title,description').eq('published',true).eq('archived',false);if(r.error)throw r.error;if(s.error)throw s.error;let by=Object.fromEntries((s.data||[]).map(x=>[x.id,x]));a.innerHTML='<a class="back" href="courses.html">← Courses</a><h1>'+e(c.data.title)+'</h1><p class="meta">'+e(c.data.description||'')+'</p><div class="grid">'+(r.data||[]).map(m=>{let x=by[m.subject_id]||{};return '<div class="card"><h2>'+e(x.title||'Subject')+'</h2><p class="meta">'+e(x.description||'')+'</p><a class="btn" href="subject.html?course='+id+'&subject='+m.id+'">Open Subject →</a></div>'}).join('')+'</div>'}catch(x){a.innerHTML='<div class="card">Unable to load course. '+e(x.message)+'</div>'}})();</script></body></html>
