<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course | LakshyaSetu</title><link rel="stylesheet" href="styles.css"><style>.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.meta{color:var(--muted);font-size:13px}.price{font-weight:900;color:var(--blue);font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:13px}.btn{display:inline-block;background:#173b67;color:#fff;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:800;font-size:13px;border:0;cursor:pointer}.buy{background:#0f5fc4}.back{display:inline-block;margin-bottom:12px;color:var(--blue);font-weight:800;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu</a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="courses.html">Courses</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><div id="app">Loading…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260910-course-pay"></script><script src="payments-v2.js?v=12"></script><script>(async()=>{const db=getLakshyaSetuDb(),a=document.getElementById('app'),p=new URLSearchParams(location.search),id=Number(p.get('course')),e=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));window.buyCourse=function(cid,name){if(typeof LSBuy!=='function'){alert('Payment module is loading. Please refresh once.');return}LSBuy({product_type:'course',course_id:Number(cid)},'LakshyaSetu - Buy '+name)};try{if(!id)throw Error('Missing course ID.');let c=await db.from('ls_courses').select('*').eq('id',id).eq('published',true).eq('archived',false).single();if(c.error)throw c.error;let r=await db.from('ls_course_subjects').select('id,subject_id,subject_fee,validity_days').eq('course_id',id).eq('published',true).eq('archived',false).order('id'),s=await db.from('ls_subjects').select('id,title,description').eq('published',true).eq('archived',false);if(r.error)throw r.error;if(s.error)throw s.error;let by=Object.fromEntries((s.data||[]).map(x=>[x.id,x])),fee=Number(c.data.course_fee||0);a.innerHTML='<a class="back" href="courses.html">← Courses</a><section class="card"><div class="meta">'+e(c.data.exam_code||'COURSE')+(c.data.validity_days?' · '+Number(c.data.validity_days)+' days':'')+'</div><h1>'+e(c.data.title)+'</h1><p class="meta">'+e(c.data.description||'')+'</p><div class="actions"><span class="price">'+(fee>0?'₹'+fee.toLocaleString('en-IN'):'Free')+'</span>'+(fee>0?'<button class="btn buy" onclick="buyCourse('+Number(c.data.id)+',\''+e(c.data.title).replace(/'/g,"\\'")+'\')">Buy Course</button>':'')+'</div></section><div class="grid">'+(r.data||[]).map(m=>{let x=by[m.subject_id]||{};return '<div class="card"><h2>'+e(x.title||'Subject')+'</h2><p class="meta">'+e(x.description||'')+'</p><div class="meta">Subject access: '+(Number(m.subject_fee||0)>0?'₹'+Number(m.subject_fee).toLocaleString('en-IN'):'Included / Free')+(m.validity_days?' · '+Number(m.validity_days)+' days':'')+'</div><div class="actions"><a class="btn" href="subject.html?course='+id+'&subject='+m.id+'">Open Subject →</a></div></div>'}).join('')+'</div>'}catch(x){a.innerHTML='<div class="card">Unable to load course. '+e(x.message)+'</div>'}})();</script></body></html>
