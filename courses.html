<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses | LakshyaSetu</title><link rel="stylesheet" href="styles.css"><style>.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.meta{color:var(--muted);font-size:13px}.price{font-weight:900;color:var(--blue);font-size:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:13px}.btn{display:inline-block;background:#173b67;color:#fff;padding:10px 13px;border-radius:9px;text-decoration:none;font-weight:800;font-size:13px;border:0;cursor:pointer}.buy{background:#0f5fc4}.empty{padding:18px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu</a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="test-series.html">Test Series</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><h1>Courses</h1><p class="meta">Learn through syllabus-wise subjects, topics and lessons.</p><div id="app">Loading courses…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260910-courses-pay"></script><script src="payments-v2.js?v=12"></script><script>(async()=>{const db=getLakshyaSetuDb(),a=document.getElementById('app'),e=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));window.buyCourse=function(id,name){if(typeof LSBuy!=='function'){alert('Payment module is loading. Please refresh once.');return}LSBuy({product_type:'course',course_id:Number(id)},'LakshyaSetu - Buy '+name)};try{let r=await db.from('ls_courses').select('id,title,description,exam_code,course_fee,validity_days').eq('published',true).eq('archived',false).order('id');if(r.error)throw r.error;let x=r.data||[];a.innerHTML=x.length?'<div class="grid">'+x.map(c=>{const fee=Number(c.course_fee||0);return '<div class="card"><div class="meta">'+e(c.exam_code||'COURSE')+(c.validity_days?' · '+Number(c.validity_days)+' days':'')+'</div><h2>'+e(c.title)+'</h2><p class="meta">'+e(c.description||'Syllabus-wise learning course.')+'</p><div class="actions"><span class="price">'+(fee>0?'₹'+fee.toLocaleString('en-IN'):'Free')+'</span>'+(fee>0?'<button class="btn buy" onclick="buyCourse('+Number(c.id)+',\''+e(c.title).replace(/'/g,"\\'")+'\')">Buy Course</button>':'')+'<a class="btn" href="course.html?course='+c.id+'">Open Course →</a></div></div>'}).join('')+'</div>':'<div class="empty">No published courses yet.</div>'}catch(x){a.innerHTML='<div class="empty">Unable to load courses. '+e(x.message)+'</div>'}})();</script></body></html>
