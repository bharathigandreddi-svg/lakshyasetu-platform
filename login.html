<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | LakshyaSetu</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">LakshyaSetu <small>లక్ష్యసేతు</small></div><a href="home.html" style="color:#fff">Home</a></header><main class="auth panel"><h1>Student Login</h1><p class="muted">Sign in to continue learning and view everything you have purchased.</p><div id="msg" class="message"></div><form id="loginForm" class="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit" style="display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;padding:11px 14px;margin-top:4px;background:#2457a6;color:#fff;border:1px solid #2457a6;border-radius:9px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;visibility:visible;opacity:1">Login</button></form><p>New student? <a href="signup.html">Create an account</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const SUPABASE_URL='https://byounbmdyuytoqqyhgos.supabase.co',SUPABASE_KEY='sb_publishable_tCvBH8eh95-nXOChd2_sLQ__iDZIfNa';const form=document.getElementById('loginForm'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),msgEl=document.getElementById('msg'),button=document.getElementById('loginButton');const show=(text,error=false)=>{msgEl.textContent=text;msgEl.className='message show'+(error?' error':'')};try{if(!window.supabase?.createClient)throw new Error('Login service is still loading. Please refresh once.');const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const next=new URLSearchParams(location.search).get('next');form.addEventListener('submit',async e=>{e.preventDefault();if(button.disabled)return;show('Signing in...');button.disabled=true;try{const email=emailEl.value.trim(),password=passwordEl.value;if(!email||!password)throw new Error('Please enter your email and password.');const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data?.user)throw new Error('Login was not completed. Please try again.');let destination=next||'report-card.html';try{const p=await sb.from('profiles').select('role').eq('id',r.data.user.id).maybeSingle();if(!p.error&&p.data?.role==='admin')destination='admin.html'}catch(_e){}location.replace(destination)}catch(err){show(err?.message||'Unable to sign in. Please check your email and password.',true);button.disabled=false}})}catch(err){show(err?.message||'Login service could not be initialized. Please refresh and try again.',true)}})();</script></body></html>
