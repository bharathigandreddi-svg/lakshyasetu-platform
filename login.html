<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | LakshyaSetu</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">LakshyaSetu <small>లక్ష్యసేతు</small></div><a href="home.html" style="color:#fff">Home</a></header><main class="auth panel"><h1>Student Login</h1><p class="muted">Sign in to continue learning and view everything you have purchased.</p><div id="msg" class="message"></div><form id="loginForm" class="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn">Login</button></form><p>New student? <a href="signup.html">Create an account</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=window.supabase.createClient(LAKSHYASETU_CONFIG.supabaseUrl,LAKSHYASETU_CONFIG.supabasePublishableKey);const next=new URLSearchParams(location.search).get('next');loginForm.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in...';msg.className='message show';const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){msg.textContent=r.error.message;msg.className='message show error';return}const p=await sb.from('profiles').select('role').eq('id',r.data.user.id).single();if(!p.error&&p.data&&p.data.role==='admin'){location.href='admin.html';return}location.href=next||'report-card.html'};</script></body></html>
