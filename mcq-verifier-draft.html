<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Verification — Drafts | LakshyaSetu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260906-5"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font-family:Inter,Arial,sans-serif}.top{background:#173b67;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:700}.wrap{width:min(1250px,95%);margin:22px auto}.card{background:#fff;border:1px solid #e1e8f1;border-radius:12px;padding:20px;margin-bottom:18px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}.controls select,.controls button{padding:11px;border:1px solid #ccd6e3;border-radius:8px;background:#fff;font:inherit}.controls button{background:#173b67;color:#fff;border:0;font-weight:800;cursor:pointer}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2f7;font-size:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.q{border:1px solid #dce4ee;border-radius:10px;padding:18px;margin:12px 0}.qtitle{font-weight:800;line-height:1.5}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.opt{padding:10px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc}.correct{border-color:#22c55e;background:#dcfce7;font-weight:700}.explain{margin-top:12px;padding:12px;background:#f8fafc;border-left:4px solid #173b67;line-height:1.55}.note{padding:12px;border-radius:9px;background:#f8fafc;color:#475569}.error{padding:14px;border-radius:9px;background:#fee2e2;color:#991b1b}@media(max-width:700px){.controls,.opts{grid-template-columns:1fr}}</style></head><body><header class="top"><div><strong>LakshyaSetu Admin</strong><div style="font-size:12px;margin-top:4px;opacity:.85">MCQ Verification · Draft + Published</div></div><div><a href="admin-v2.html">Control Center</a> &nbsp;|&nbsp; <a href="test-builder-v2.html">Test Builder</a></div></header><main class="wrap"><div id="status" class="card">Checking admin session...</div><div id="app" style="display:none"><div class="card"><h2>Verify MCQs Before Publication</h2><p class="note">Draft tests are shown here so the test setter can review all questions, answers, explanations and sources. This page does not publish anything.</p><div class="controls"><select id="testSelect"></select><button id="loadBtn">View MCQs</button></div><div id="testMeta"></div></div><div id="result"></div></div></main><script>const db=getLakshyaSetuDb(),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));let tests=[];async function start(){const s=(await db.auth.getSession())?.data?.session;if(!s){location.href='login.html?next='+encodeURIComponent(location.href);return}const p=await db.from('profiles').select('role').eq('id',s.user.id).maybeSingle();const role=p.data?.role||s.user?.app_metadata?.role||s.user?.user_metadata?.role||'';if(p.error||role!=='admin'){$('status').innerHTML='<div class="error">Admin access required.</div>';return}const r=await db.from('ls_tests').select('id,title,published,archived,question_count,total_marks,price,ls_test_series(title)').eq('archived',false).order('id',{ascending:false});if(r.error)throw r.error;tests=r.data||[];const sel=$('testSelect');sel.innerHTML='<option value="">Select a test…</option>'+tests.map(t=>'<option value="'+t.id+'">'+esc((t.ls_test_series?.title?t.ls_test_series.title+' · ':'')+t.title+' (#'+t.id+') — '+(t.published?'PUBLISHED':'DRAFT')+' — '+(t.question_count||0)+' Q</option>').join('');const wanted=new URLSearchParams(location.search).get('test');const preferred=tests.find(t=>/earth structure.*interior/i.test(t.title));if(wanted&&tests.some(t=>String(t.id)===wanted))sel.value=wanted;else if(preferred)sel.value=preferred.id;$('app').style.display='block';if(sel.value)await loadQuestions();$('status').innerHTML='<span class="badge ok">Admin session active</span>'}async function loadQuestions(){const id=Number($('testSelect').value);if(!id){$('result').innerHTML='';return}const t=tests.find(x=>x.id===id);const r=await db.from('ls_test_questions').select('*').eq('test_id',id).order('display_order').order('id');if(r.error){$('result').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';return}const qs=r.data||[];const noexp=qs.filter(q=>!q.explanation?.trim()).length,nosrc=qs.filter(q=>!q.source_reference?.trim()).length,malformed=qs.filter(q=>!q.question?.trim()||!q.option_a?.trim()||!q.option_b?.trim()||!q.option_c?.trim()||!q.option_d?.trim()||!['A','B','C','D'].includes(String(q.correct_option||'').toUpperCase())).length;$('testMeta').innerHTML='<div class="meta"><span class="badge '+(t.published?'bad':'ok')+'">'+(t.published?'PUBLISHED':'DRAFT')+'</span><span class="badge">'+esc(t.ls_test_series?.title||'Test')+'</span><span class="badge">'+qs.length+' questions</span><span class="badge">'+esc(t.total_marks??'—')+' marks</span><span class="badge">₹'+esc(t.price??0)+'</span></div>';$('result').innerHTML='<div class="card"><div class="meta"><span class="badge">Malformed: '+malformed+'</span><span class="badge">Missing explanations: '+noexp+'</span><span class="badge">Missing sources: '+nosrc+'</span></div></div>'+(qs.length?qs.map((q,i)=>{const c=String(q.correct_option||'').toUpperCase();const valid=q.question?.trim()&&q.option_a?.trim()&&q.option_b?.trim()&&q.option_c?.trim()&&q.option_d?.trim()&&['A','B','C','D'].includes(c)&&q.explanation?.trim()&&q.source_reference?.trim();return '<article class="q"><div class="qtitle">Q'+(i+1)+'. '+esc(q.question)+'</div><div class="opts">'+[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>'<div class="opt '+(c===o[0]?'correct':'')+'"><b>'+o[0]+'.</b> '+esc(o[1])+(c===o[0]?' ✓':'')+'</div>').join('')+'</div><div class="meta"><span class="badge">Answer: '+esc(c||'Not set')+'</span><span class="badge">Marks: '+esc(q.marks??'—')+'</span><span class="badge">Negative: '+esc(q.negative_marks??'—')+'</span><span class="badge">Difficulty: '+esc(q.difficulty??'Not set')+'</span><span class="badge">Source: '+esc(q.source_reference||'Missing')+'</span></div><div class="explain"><b>Explanation:</b> '+esc(q.explanation||'Missing')+'</div></article>'}).join(''):'<div class="card">No questions found yet.</div>')}$('loadBtn').onclick=loadQuestions;$('testSelect').onchange=loadQuestions;start().catch(e=>$('status').innerHTML='<div class="error">'+esc(e.message||e)+'</div>');</script></body></html>
