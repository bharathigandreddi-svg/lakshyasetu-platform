<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCQ Verification | LakshyaSetu Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font-family:Arial,sans-serif}.top{background:#173b67;color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:700}.wrap{width:min(1250px,95%);margin:22px auto}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0000000d}.controls{display:grid;grid-template-columns:2fr 1fr;gap:12px}.controls select,.controls button{width:100%;padding:11px;border:1px solid #ccd6e3;border-radius:7px;background:#fff}.controls button{background:#173b67;color:#fff;border:0;font-weight:700;cursor:pointer}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf2f7;font-size:12px}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.q{border:1px solid #dce4ee;border-radius:10px;padding:18px;margin:12px 0}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.qtitle{font-weight:800;line-height:1.5}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.opt{padding:10px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc}.correct{border-color:#22c55e;background:#dcfce7;font-weight:700}.explain{margin-top:12px;padding:11px;background:#f8fafc;border-left:4px solid #173b67;line-height:1.5}.review{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}.empty,.error{padding:18px;border-radius:9px;background:#f8fafc}.error{background:#fee2e2;color:#991b1b}.summary{display:flex;gap:10px;flex-wrap:wrap}.summary strong{font-size:20px}.toolbar{display:flex;gap:8px;justify-content:flex-end}.toolbar button{padding:9px 12px;border:0;border-radius:7px;background:#e8eef7;color:#173b67;font-weight:700;cursor:pointer}@media(max-width:700px){.controls,.opts{grid-template-columns:1fr}.top{padding:15px}}
</style>
</head>
<body>
<header class="top"><div><strong>LakshyaSetu Admin</strong><div style="font-size:12px;margin-top:4px;opacity:.85">MCQ Verification</div></div><div><a href="admin-tools.html">Admin Tools</a> &nbsp; | &nbsp; <a href="admin.html">Dashboard</a></div></header>
<main class="wrap">
<div id="status" class="card">Checking admin session...</div>
<div class="card">
<h2>Verify Test MCQs</h2>
<p style="color:#64748b">Select a test to inspect every question, all four options, correct answer, explanation and basic quality checks before publishing.</p>
<div class="controls"><select id="testSelect"><option value="">Loading tests...</option></select><button id="loadBtn" type="button">Check MCQs</button></div>
<div id="testMeta"></div>
</div>
<div id="result"></div>
</main>
<script>
const sb=getLakshyaSetuDb();let tests=[];
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
async function guard(){const r=await sb.auth.getSession();const s=r?.data?.session;if(!s){location.href='login.html?next='+encodeURIComponent(location.href);return false}const role=s.user?.user_metadata?.role||s.user?.app_metadata?.role||'';if(role&&role!=='admin'){document.getElementById('status').innerHTML='<div class="error">This account is not an admin account.</div>';return false}document.getElementById('status').innerHTML='<span class="badge ok">Admin session active</span>';return true}
async function loadTests(){const r=await sb.from('ls_tests').select('id,title,test_type,published,archived,question_count,expected_question_count,total_marks,price,ls_test_series(title,exam_year,series_type)').order('id',{ascending:false});if(r.error)throw r.error;tests=r.data||[];const sel=document.getElementById('testSelect');sel.innerHTML='<option value="">Select a test...</option>'+tests.map(t=>{const s=t.ls_test_series;const label=(s?.title? s.title+' · ':'')+t.title+' (#'+t.id+')'+(t.published?' · Published':' · Draft');return '<option value="'+t.id+'">'+esc(label)+'</option>'}).join('');}
function reviewKey(id){return 'ls-mcq-reviewed-'+id}function reviewed(id){return localStorage.getItem(reviewKey(id))==='1'}
function renderMeta(t,count,issues){const s=t.ls_test_series||{};document.getElementById('testMeta').innerHTML='<div class="meta"><span class="badge">'+esc(s.title||'Test Series')+'</span><span class="badge">'+esc(t.test_type||'TEST')+'</span><span class="badge '+(t.published?'ok':'warn')+'">'+(t.published?'Published':'Draft')+'</span><span class="badge">'+count+' questions</span><span class="badge">Expected '+Number(t.expected_question_count||t.question_count||0)+'</span><span class="badge '+(issues?'bad':'ok')+'">'+(issues?issues+' issue(s) found':'No basic issues found')+'</span></div>'}
async function loadQuestions(){const id=Number(document.getElementById('testSelect').value);if(!id){document.getElementById('result').innerHTML='';return}const t=tests.find(x=>x.id===id);const r=await sb.from('ls_test_questions').select('*').eq('test_id',id).order('display_order').order('id');if(r.error){document.getElementById('result').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';return}const qs=r.data||[];let issues=0;const seen=new Map();qs.forEach(q=>{const key=String(q.question||'').trim().toLowerCase();if(!q.question||!q.option_a||!q.option_b||!q.option_c||!q.option_d||!['A','B','C','D'].includes(String(q.correct_option||'').toUpperCase()))issues++;if(key)seen.set(key,(seen.get(key)||0)+1)});seen.forEach(n=>{if(n>1)issues+=n-1});renderMeta(t,qs.length,issues);document.getElementById('result').innerHTML='<div class="card"><div class="toolbar"><button type="button" onclick="window.print()">Print / Save PDF</button><button type="button" onclick="markReviewed('+id+')">'+(reviewed(id)?'Reviewed ✓':'Mark Test Reviewed')+'</button></div><div class="summary"><div><strong>'+qs.length+'</strong><div>Questions</div></div><div><strong>'+issues+'</strong><div>Quality flags</div></div></div></div>'+(qs.length?qs.map((q,i)=>{const correct=String(q.correct_option||'').toUpperCase();const valid=!!q.question&&!!q.option_a&&!!q.option_b&&!!q.option_c&&!!q.option_d&&['A','B','C','D'].includes(correct);return '<article class="q"><div class="qhead"><div class="qtitle">Q'+(i+1)+'. '+esc(q.question)+'</div><span class="badge '+(valid?'ok':'bad')+'">'+(valid?'OK':'Check')+'</span></div><div class="opts">'+[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>'<div class="opt '+(correct===o[0]?'correct':'')+'"><strong>'+o[0]+'.</strong> '+esc(o[1])+(correct===o[0]?' ✓':'')+'</div>').join('')+'</div><div class="meta"><span class="badge">Correct: '+esc(correct||'Not set')+'</span><span class="badge">Marks: '+esc(q.marks??'—')+'</span><span class="badge">Negative: '+esc(q.negative_marks??'—')+'</span>'+(q.difficulty?'<span class="badge">Difficulty: '+esc(q.difficulty)+'</span>':'')+(q.concept_tag?'<span class="badge">Concept: '+esc(q.concept_tag)+'</span>':'')+'</div>'+(q.explanation?'<div class="explain"><strong>Explanation:</strong> '+esc(q.explanation)+'</div>':'<div class="explain"><strong>Explanation:</strong> Not provided.</div>')+'<label class="review"><input type="checkbox" '+(reviewed(id+'-'+q.id)?'checked':'')+' onchange="localStorage.setItem(\'ls-mcq-reviewed-'+id+'-'+q.id+'\',this.checked?\'1\':\'0\')"> Reviewed</label></article>'}).join(''):'<div class="card empty">No questions found for this test.</div>');}
function markReviewed(id){localStorage.setItem(reviewKey(id),'1');loadQuestions()}
document.getElementById('loadBtn').addEventListener('click',loadQuestions);document.getElementById('testSelect').addEventListener('change',loadQuestions);
(async()=>{try{if(await guard())await loadTests()}catch(e){document.getElementById('status').innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}})();
async function logout(){await sb.auth.signOut();location.href='login.html'}
</script>
</body></html>
