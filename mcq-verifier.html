<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Verification | LakshyaSetu Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260903-1700"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font-family:Inter,Arial,sans-serif}.top{background:#173b67;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:700}.wrap{width:min(1250px,95%);margin:22px auto}.card{background:#fff;border:1px solid #e1e8f1;border-radius:12px;padding:20px;margin-bottom:18px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}.controls select,.controls button{padding:11px;border:1px solid #ccd6e3;border-radius:8px;background:#fff;font:inherit}.controls button{background:#173b67;color:#fff;border:0;font-weight:800;cursor:pointer}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2f7;font-size:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fff4d6;color:#8a5a00}.q{border:1px solid #dce4ee;border-radius:10px;padding:18px;margin:12px 0}.qhead{display:flex;justify-content:space-between;gap:10px}.qtitle{font-weight:800;line-height:1.5}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.opt{padding:10px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc}.correct{border-color:#22c55e;background:#dcfce7;font-weight:700}.explain{margin-top:12px;padding:12px;background:#f8fafc;border-left:4px solid #173b67;line-height:1.55}.summary{display:flex;gap:24px;flex-wrap:wrap}.summary strong{font-size:24px}.toolbar{display:flex;justify-content:flex-end;gap:8px}.toolbar button{padding:9px 12px;border:0;border-radius:7px;background:#e8eef7;color:#173b67;font-weight:800;cursor:pointer}.error{padding:14px;border-radius:9px;background:#fee2e2;color:#991b1b}.note{padding:12px;border-radius:9px;background:#f8fafc;color:#475569}.pattern{margin-top:14px;padding:12px;border-radius:9px;font-size:13px;line-height:1.5}.pattern.bad{background:#fff0f0;border:1px solid #f1b8b8}.pattern.ok{background:#effaf2;border:1px solid #b7e0c1}@media(max-width:700px){.controls,.opts{grid-template-columns:1fr}}
</style></head><body><header class="top"><div><strong>LakshyaSetu Admin</strong><div style="font-size:12px;margin-top:4px;opacity:.85">MCQ Verification · Published tests only</div></div><div><a href="admin-v2.html">Control Center</a> &nbsp;|&nbsp; <a href="admin-tools.html">Admin Tools</a></div></header><main class="wrap"><div id="status" class="card">Checking admin session...</div><div id="app" style="display:none"><div class="card"><h2>Verify MCQs Before Launch</h2><p class="note">This verifier checks structure and answer-key quality only. Content accuracy and academic quality must be reviewed by the test setter before publication.</p><div class="controls"><select id="testSelect"></select><button id="loadBtn">Check MCQs</button></div><div id="testMeta"></div></div><div id="result"></div></div></main><script>const db=getLakshyaSetuDb(),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));let tests=[];async function guard(){const r=await db.auth.getSession(),s=r?.data?.session;if(!s){location.href='login.html?next='+encodeURIComponent(location.href);return false}const role=s.user?.user_metadata?.role||s.user?.app_metadata?.role||'';if(role&&role!=='admin'){$('status').innerHTML='<div class="error">Admin access required.</div>';return false}return true}async function loadTests(){const r=await db.from('ls_tests').select('id,title,test_type,question_count,expected_question_count,total_marks,price,course_subject_id,topic_id,ls_test_series(title,exam_year),ls_course_subjects(course_id,ls_subjects(title))').eq('published',true).eq('archived',false).order('id',{ascending:false});if(r.error)throw r.error;tests=r.data||[];const sel=$('testSelect');sel.innerHTML='<option value="">Select a published test…</option>'+tests.map(t=>'<option value="'+t.id+'">'+esc((t.ls_test_series?.title?t.ls_test_series.title+' · ':'')+t.title+' (#'+t.id+')')+'</option>').join('');const wanted=new URLSearchParams(location.search).get('test');if(wanted&&tests.some(t=>String(t.id)===wanted)){sel.value=wanted;await loadQuestions()}}function answerPattern(qs){const key=qs.map(q=>String(q.correct_option||'').toUpperCase()).join('');if(!key)return {kind:'bad',text:'Answer key is incomplete.'};const cycles=['ABCD','BCDA','CDAB','DABC','ABC','BCD','CDA','DAB','AB','BA','CD','DC'];const repeated=cycles.some(c=>key.length>=c.length*3&&key.includes(c+c+c));let longest=1,current=1;for(let i=1;i<key.length;i++){if(key[i]===key[i-1])current++;else current=1;longest=Math.max(longest,current)}if(repeated)return {kind:'bad',text:'Suspicious positional pattern detected in the answer key. Do not publish until the answer positions are independently randomized.'};if(longest>=4)return {kind:'bad',text:'Four or more consecutive questions have the same answer position. Review the key.'};return {kind:'ok',text:'No obvious repeating answer-position pattern detected.'}}async function loadQuestions(){const id=Number($('testSelect').value);if(!id){$('result').innerHTML='';$('testMeta').innerHTML='';return}const t=tests.find(x=>x.id===id),r=await db.from('ls_test_questions').select('*').eq('test_id',id).order('display_order').order('id');if(r.error){$('result').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';return}const qs=r.data||[],malformed=qs.filter(q=>!q.question?.trim()||!q.option_a?.trim()||!q.option_b?.trim()||!q.option_c?.trim()||!q.option_d?.trim()||!['A','B','C','D'].includes(String(q.correct_option||'').toUpperCase())).length,noexp=qs.filter(q=>!q.explanation?.trim()).length,nosrc=qs.filter(q=>!q.source_reference?.trim()).length,seen=new Set(),dups=[];qs.forEach(q=>{const k=String(q.question||'').trim().toLowerCase();if(seen.has(k))dups.push(k);else seen.add(k)});const pattern=answerPattern(qs),issues=(qs.length===50?0:1)+malformed+noexp+nosrc+dups.length+(pattern.kind==='bad'?1:0);$('testMeta').innerHTML='<div class="meta"><span class="badge">'+esc(t.ls_course_subjects?.ls_subjects?.title||'Subject')+'</span><span class="badge">'+esc(t.ls_test_series?.title||'Test Series')+'</span><span class="badge">'+qs.length+'/50 MCQs</span><span class="badge">'+esc(t.total_marks??50)+' marks</span><span class="badge '+(issues?'bad':'ok')+'">'+(issues?issues+' issue(s)':'READY · Structure clean')+'</span></div>';$('result').innerHTML='<div class="card"><div class="toolbar"><button onclick="window.print()">Print / Save PDF</button></div><div class="summary"><div><strong>'+qs.length+'</strong><div>MCQs</div></div><div><strong>'+malformed+'</strong><div>Malformed</div></div><div><strong>'+noexp+'</strong><div>Missing explanations</div></div><div><strong>'+nosrc+'</strong><div>Missing sources</div></div><div><strong>'+dups.length+'</strong><div>Duplicate questions</div></div></div><div class="pattern '+pattern.kind+'"><b>Answer-position audit:</b> '+esc(pattern.text)+'<br><span style="color:#64748b">This detects obvious positional patterns; it does not judge whether the marked answer is academically correct.</span></div></div>'+(qs.length?qs.map((q,i)=>{const c=String(q.correct_option||'').toUpperCase(),valid=q.question?.trim()&&q.option_a?.trim()&&q.option_b?.trim()&&q.option_c?.trim()&&q.option_d?.trim()&&['A','B','C','D'].includes(c)&&q.explanation?.trim()&&q.source_reference?.trim();return '<article class="q"><div class="qhead"><div class="qtitle">Q'+(i+1)+'. '+esc(q.question)+'</div><span class="badge '+(valid?'ok':'bad')+'">'+(valid?'OK':'CHECK')+'</span></div><div class="opts">'+[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>'<div class="opt '+(c===o[0]?'correct':'')+'"><b>'+o[0]+'.</b> '+esc(o[1])+(c===o[0]?' ✓':'')+'</div>').join('')+'</div><div class="meta"><span class="badge">Answer: '+esc(c||'Not set')+'</span><span class="badge">Marks: '+esc(q.marks??'—')+'</span><span class="badge">Negative: '+esc(q.negative_marks??'—')+'</span><span class="badge">Source: '+esc(q.source_reference||'Missing')+'</span></div><div class="explain"><b>Explanation:</b> '+esc(q.explanation||'Missing')+'</div></article>'}).join(''):'<div class="card">No questions found.</div>')}$('loadBtn').onclick=loadQuestions;$('testSelect').onchange=loadQuestions;(async()=>{try{if(await guard()){await loadTests();$('status').innerHTML='<span class="badge ok">Admin session active</span>';$('app').style.display='block'}}catch(e){$('status').innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}})();async function logout(){await db.auth.signOut();location.href='login.html'}</script></body></html>
