<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LakshyaSetu Pricing & Test Planner</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f7fb}.wrap{max-width:1250px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filter{padding:10px 12px;border:1px solid #d9e1eb;border-radius:9px;background:#fff}.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.price-card{background:#fff;border:1px solid #e0e7ef;border-radius:16px;padding:18px;box-shadow:0 4px 16px #10233f0a}.price-card h3{margin:0 0 7px;color:#10233f}.amount{font-size:25px;font-weight:900;color:#10233f}.meta{font-size:12px;color:#667085;margin-top:7px;line-height:1.6}.group{margin:28px 0}.group h2{color:#10233f}.note{padding:14px 16px;background:#fff8e8;border:1px solid #f4dfaa;border-radius:12px;color:#6d5200}@media(max-width:850px){.price-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.price-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">LakshyaSetu<small>Internal Pricing & Test Planner</small></div><div class="actions"><a class="btn" href="admin.html">Admin</a></div></header><main class="wrap"><div class="toolbar"><select id="group" class="filter" onchange="load()"><option value="">All products</option><option value="current_affairs">Current Affairs</option><option value="upsc">UPSC</option><option value="group1">APPSC Group 1</option><option value="group2">APPSC Group 2</option></select><select id="type" class="filter" onchange="load()"><option value="">All types</option><option value="year">Year</option><option value="monthly">Monthly</option><option value="test">Single Test</option><option value="subject">Subject</option><option value="mock_bundle">Mock Tests</option></select></div><div class="note"><strong>Pricing rule:</strong> 50-question test ₹2 · 6-test monthly bundle ₹10 · full-year Current Affairs ₹100. UPSC ₹799 · Group 1 ₹699 · Group 2 ₹599. Subject prices can vary by syllabus depth.</div><div id="root"><div class="loading">Loading planner...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const db=getLakshyaSetuDb();const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));async function load(){let q=db.from('ls_product_catalog').select('*').eq('active',true).order('display_order');const g=document.getElementById('group').value,t=document.getElementById('type').value;if(g)q=q.eq('product_group',g);if(t)q=q.eq('product_type',t);const r=await q;if(r.error){document.getElementById('root').innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}const groups={};(r.data||[]).forEach(x=>(groups[x.product_group]??=[]).push(x));document.getElementById('root').innerHTML=Object.entries(groups).map(([g,items])=>`<section class="group"><h2>${esc(g==='current_affairs'?'Current Affairs':g==='upsc'?'UPSC':g==='group1'?'APPSC Group 1':g==='group2'?'APPSC Group 2':g)}</h2><div class="price-grid">${items.map(x=>`<article class="price-card"><h3>${esc(x.title)}</h3><div class="amount">₹${Number(x.price).toFixed(0)}</div><div class="meta">${esc(x.subtitle||'')} ${x.question_count?' · '+x.question_count+' questions':''}${x.year?' · '+x.year:''}</div></article>`).join('')}</div></section>`).join('')||'<div class="empty">No pricing items yet.</div>'}load();</script></body></html>
