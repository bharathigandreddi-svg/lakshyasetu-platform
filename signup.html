<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | LakshyaSetu</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div class="brand">LakshyaSetu <small>లక్ష్యసేతు</small></div><a href="home.html" style="color:#fff">Home</a></header>
<main class="auth panel"><h1>Create Student Account</h1><div id="msg" class="message"></div><form id="form" class="form"><label>Full name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><button type="submit" class="btn primary">Create Account</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=window.supabase.createClient(LAKSHYASETU_CONFIG.supabaseUrl,LAKSHYASETU_CONFIG.supabasePublishableKey);const next=new URLSearchParams(location.search).get('next');
form.onsubmit=async e=>{e.preventDefault();msg.textContent="Creating account...";msg.className="message show";const r=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:name.value.trim()}}});if(r.error){msg.textContent=r.error.message;msg.className="message show error";return}msg.textContent=r.data.session?"Account created.":"Account created. Please check your email to confirm.";if(r.data.session)setTimeout(()=>location.href=next||"student-v2.html",700)};</script></body></html>
