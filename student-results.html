<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Results | LakshyaSetu</title><style>body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 20px}.brand{font-weight:900;color:#183b75;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:20px;box-shadow:0 2px 10px #00000008}.hero{margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f7f9fc;border:1px solid #e1e6ee;border-radius:11px;padding:15px}.stat b{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.stat strong{font-size:22px;color:#173b67}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px;border:1px solid #e1e6ee;border-radius:11px;background:#fff}.row h3{margin:0 0 5px;color:#173b67;font-size:15px}.meta{color:#64748b;font-size:12px}.btn{display:inline-block;text-decoration:none;background:#173b67;color:#fff;padding:9px 12px;border-radius:8px;font-weight:800;font-size:12px;white-space:nowrap}.empty{padding:18px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b}.error{color:#b42318;background:#fff0f0;padding:12px;border-radius:9px}.review{margin-top:16px}.answer{padding:12px 0;border-top:1px solid #e5e9f0}.ok{color:#18733b}.bad{color:#b42318}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}}@media(max-width:450px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:14px}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu</a></header><main class="wrap"><div id="error"></div><section class="hero"><h1>My Results</h1><p class="meta">Your submitted test attempts and performance summary.</p></section><section id="summary" class="card" style="display:none"></section><section class="card" style="margin-top:16px"><h2>Recent Attempts</h2><div id="list" class="list">Loading…</div></section><section id="detail" class="card review" style="display:none"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909-results"></script><script>(async()=>{const db=getLakshyaSetuDb(),$=id=>document.getElementById(id),p=new URLSearchParams(location.search),attemptId=Number(p.get('attempt')||0);const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));try{const user=(await db.auth.getUser()).data.user;if(!user){$('list').textContent='Please log in to view your results.';return}let r=await db.from('ls_test_attempts').select('*').eq('user_id',user.id).not('submitted_at','is',null).order('submitted_at',{ascending:false}).limit(50);if(r.error)throw r.error;const attempts=r.data||[];if(!attempts.length){$('list').innerHTML='<div class="empty">No submitted tests yet. Complete a test to see your performance here.</div>';return}let ids=[...new Set(attempts.map(x=>x.test_id))];let tr=await db.from('ls_tests').select('id,title,question_count,total_marks,marks').in('id',ids);if(tr.error)throw tr.error;let tests=tr.data||[];let byId=Object.fromEntries(tests.map(x=>[x.id,x]));let avg=attempts.reduce((s,x)=>s+Number(x.percentage||0),0)/attempts.length;let best=Math.max(...attempts.map(x=>Number(x.percentage||0)));$('summary').style.display='block';$('summary').innerHTML='<div class="grid"><div class="stat"><b>Attempts</b><strong>'+attempts.length+'</strong></div><div class="stat"><b>Average</b><strong>'+avg.toFixed(1)+'%</strong></div><div class="stat"><b>Best</b><strong>'+best.toFixed(1)+'%</strong></div><div class="stat"><b>Latest</b><strong>'+Number(attempts[0].percentage||0).toFixed(1)+'%</strong></div></div>';if(attemptId)showDetail(attemptId,attempts,byId);$('list').innerHTML=attempts.map(a=>{let t=byId[a.test_id]||{};return '<div class="row"><div><h3>'+esc(t.title||('Test #'+a.test_id))+'</h3><div class="meta">'+new Date(a.submitted_at).toLocaleString('en-IN')+' · Score '+Number(a.score||0)+' · '+Number(a.correct_count||0)+' correct · '+Number(a.wrong_count||0)+' wrong · '+Number(a.unanswered_count||0)+' unanswered</div></div><a class="btn" href="student-results.html?attempt='+a.id+'">Review Result</a></div>'}).join('')}catch(e){$('error').innerHTML='<div class="error">Unable to load results: '+esc(e.message)+'</div>'}async function showDetail(id,attempts,byId){let a=attempts.find(x=>Number(x.id)===id);if(!a)return;let t=byId[a.test_id]||{};let ar=await db.from('ls_test_answers').select('*').eq('attempt_id',id);if(ar.error)return;let qids=(ar.data||[]).map(x=>x.test_question_id);let qr=await db.from('ls_test_questions').select('id,question,option_a,option_b,option_c,option_d,correct_option,explanation,marks,negative_marks,display_order').in('id',qids).order('display_order');if(qr.error)return;let amap=Object.fromEntries((ar.data||[]).map(x=>[x.test_question_id,x]));$('detail').style.display='block';$('detail').innerHTML='<h2>'+esc(t.title||'Test Result')+'</h2><div class="grid"><div class="stat"><b>Score</b><strong>'+Number(a.score||0)+'</strong></div><div class="stat"><b>Percentage</b><strong>'+Number(a.percentage||0).toFixed(1)+'%</strong></div><div class="stat"><b>Correct</b><strong>'+Number(a.correct_count||0)+'</strong></div><div class="stat"><b>Wrong / Unanswered</b><strong>'+Number(a.wrong_count||0)+' / '+Number(a.unanswered_count||0)+'</strong></div></div><h3 style="margin-top:22px">Question Review</h3>'+(qr.data||[]).map((q,i)=>{let x=amap[q.id]||{};return '<div class="answer"><b>Q'+(i+1)+'. '+esc(q.question)+'</b><div class="meta">Your answer: '+esc(x.selected_option||'Unanswered')+' · Correct: '+esc(q.correct_option||'')+'</div>'+(q.explanation?'<div>'+esc(q.explanation)+'</div>':'')+'</div>'}).join('')+'</div>'} })();</script></body></html>
