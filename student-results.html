<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Results | LakshyaSetu</title><style>body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 20px}.brand{font-weight:900;color:#183b75;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:20px;box-shadow:0 2px 10px #00000008}.hero{margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f7f9fc;border:1px solid #e1e6ee;border-radius:11px;padding:15px}.stat b{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.stat strong{font-size:22px;color:#173b67}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px;border:1px solid #e1e6ee;border-radius:11px}.row h3{margin:0 0 5px;color:#173b67;font-size:15px}.meta{color:#64748b;font-size:12px}.btn{display:inline-block;text-decoration:none;background:#173b67;color:#fff;padding:9px 12px;border-radius:8px;font-weight:800;font-size:12px;white-space:nowrap}.empty{padding:18px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b}.error{color:#b42318;background:#fff0f0;padding:12px;border-radius:9px}.review{margin-top:16px}.answer{padding:14px 0;border-top:1px solid #e5e9f0}.bar{height:9px;background:#e6ebf2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2457a6}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef4ff;color:#2457a6;font-size:11px;font-weight:800}.ok{color:#18733b}.bad{color:#b42318}.breakdown{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:16px}.pie{width:150px;height:150px;border-radius:50%;position:relative;background:conic-gradient(#2457a6 var(--correct),#c95b5b var(--correct) var(--wrong),#cbd5e1 var(--wrong) 100%)}.pie:after{content:'';position:absolute;inset:35px;background:#fff;border-radius:50%}.legend{display:grid;gap:8px}.legend span{font-weight:700}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.d1{background:#2457a6}.d2{background:#c95b5b}.d3{background:#cbd5e1}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}}@media(max-width:450px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:14px}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu</a></header><main class="wrap"><div id="error"></div><section class="hero"><h1>My Results</h1><p class="meta">Performance, rank estimate and question-wise review.</p></section><section id="summary" class="card" style="display:none"></section><section class="card" style="margin-top:16px"><h2>Recent Attempts</h2><div id="list" class="list">Loading…</div></section><section id="detail" class="card review" style="display:none"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909-results3"></script><script>(async()=>{const db=getLakshyaSetuDb(),$=id=>document.getElementById(id),p=new URLSearchParams(location.search),attemptId=Number(p.get('attempt')||0),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));try{const user=(await db.auth.getUser()).data.user;if(!user){$('list').textContent='Please log in to view your results.';return}let r=await db.from('ls_test_attempts').select('*').eq('user_id',user.id).not('submitted_at','is',null).order('submitted_at',{ascending:false}).limit(50);if(r.error)throw r.error;const attempts=r.data||[];if(!attempts.length){$('list').innerHTML='<div class="empty">No submitted tests yet. Complete a test to see your performance here.</div>';return}let ids=[...new Set(attempts.map(x=>x.test_id))],tr=await db.from('ls_tests').select('id,title,question_count,total_marks').in('id',ids);if(tr.error)throw tr.error;let byId=Object.fromEntries((tr.data||[]).map(x=>[x.id,x])),avg=attempts.reduce((s,x)=>s+Number(x.percentage||0),0)/attempts.length,best=Math.max(...attempts.map(x=>Number(x.percentage||0)));$('summary').style.display='block';$('summary').innerHTML='<div class="grid"><div class="stat"><b>Attempts</b><strong>'+attempts.length+'</strong></div><div class="stat"><b>Average</b><strong>'+avg.toFixed(1)+'%</strong></div><div class="stat"><b>Best</b><strong>'+best.toFixed(1)+'%</strong></div><div class="stat"><b>Latest</b><strong>'+Number(attempts[0].percentage||0).toFixed(1)+'%</strong></div></div>';if(attemptId)showDetail(attemptId,attempts,byId);$('list').innerHTML=attempts.map(a=>{let t=byId[a.test_id]||{};return '<div class="row"><div><h3>'+esc(t.title||('Test #'+a.test_id))+'</h3><div class="meta">'+new Date(a.submitted_at).toLocaleString('en-IN')+' · Score '+Number(a.score||0)+' · '+Number(a.correct_count||0)+' correct · '+Number(a.wrong_count||0)+' wrong · '+Number(a.unanswered_count||0)+' unanswered</div></div><a class="btn" href="student-results.html?attempt='+a.id+'">Review Result</a></div>'}).join('')}catch(e){$('error').innerHTML='<div class="error">Unable to load results: '+esc(e.message)+'</div>'}async function showDetail(id,attempts,byId){let a=attempts.find(x=>Number(x.id)===id);if(!a)return;let ar=await db.from('ls_test_answers').select('*').eq('attempt_id',id);if(ar.error)return;let allq=await db.from('ls_test_questions').select('id,question,option_a,option_b,option_c,option_d,correct_option,explanation,marks,negative_marks,display_order,concept_tag,statements').eq('test_id',a.test_id).order('display_order');if(allq.error)return;let amap=Object.fromEntries((ar.data||[]).map(x=>[x.test_question_id,x])),qs=allq.data||[],correct=Number(a.correct_count||0),wrong=Number(a.wrong_count||0),unanswered=Number(a.unanswered_count||0),attempted=correct+wrong,total=attempted+unanswered;let rankData=await db.from('ls_test_attempts').select('score').eq('test_id',a.test_id).not('submitted_at','is',null),pool=rankData.data||[],rank=pool.filter(x=>Number(x.score||0)>Number(a.score||0)).length+1,percentile=pool.length>1?((pool.filter(x=>Number(x.score||0)<=Number(a.score||0)).length-1)/(pool.length-1))*100:null,concepts={};qs.forEach(q=>{let x=amap[q.id],tag=q.concept_tag||'General';if(!concepts[tag])concepts[tag]={correct:0,answered:0};if(x?.selected_option){concepts[tag].answered++;if(String(x.selected_option).toLowerCase()===String(q.correct_option||'').toLowerCase())concepts[tag].correct++}});let rows=Object.entries(concepts).map(([k,v])=>({k,rate:v.answered?v.correct/v.answered*100:0,answered:v.answered})).filter(x=>x.answered).sort((a,b)=>b.rate-a.rate),strengths=rows.slice(0,3),weaknesses=rows.slice(-3).reverse(),cp=total?correct/total*100:0,wp=total?(correct+wrong)/total*100:0;$('detail').style.display='block';$('detail').innerHTML='<h2>'+esc((byId[a.test_id]||{}).title||'Test Result')+'</h2><div class="grid"><div class="stat"><b>Score</b><strong>'+Number(a.score||0)+'</strong></div><div class="stat"><b>Percentage</b><strong>'+Number(a.percentage||0).toFixed(1)+'%</strong></div><div class="stat"><b>Rank</b><strong>#'+rank+' / '+pool.length+'</strong></div><div class="stat"><b>Percentile</b><strong>'+(percentile==null?'N/A':percentile.toFixed(1)+'%')+'</strong></div></div><p class="meta" style="margin-top:14px">Rank and percentile use submitted attempts for this test only. With a small candidate pool, treat them as provisional.</p><div class="grid" style="margin-top:16px"><div class="stat"><b>Correct</b><strong class="ok">'+correct+'</strong></div><div class="stat"><b>Wrong</b><strong class="bad">'+wrong+'</strong></div><div class="stat"><b>Unanswered</b><strong>'+unanswered+'</strong></div><div class="stat"><b>Attempted</b><strong>'+attempted+'/'+total+'</strong></div></div><div class="breakdown"><div class="pie" style="--correct:'+cp+'%;--wrong:'+wp+'%"></div><div class="legend"><span><i class="dot d1"></i>Correct: '+correct+'</span><span><i class="dot d2"></i>Wrong: '+wrong+'</span><span><i class="dot d3"></i>Unanswered: '+unanswered+'</span></div></div><h3 style="margin-top:24px">Attempted Accuracy</h3><div class="bar"><i style="width:'+(attempted?correct/attempted*100:0)+'%"></i></div><p class="meta">'+(attempted?(correct/attempted*100).toFixed(1):'0.0')+'% of attempted questions were correct.</p><div class="grid" style="margin-top:16px"><div class="stat"><b>Strengths</b>'+(strengths.length?strengths.map(x=>'<div style="margin-top:9px"><span class="pill">'+esc(x.k)+'</span><div class="meta">'+x.rate.toFixed(0)+'% accuracy · '+x.answered+' answered</div></div>').join(''):'<p class="meta">Not enough tagged questions.</p>')+'</div><div class="stat"><b>Weaknesses</b>'+(weaknesses.length?weaknesses.map(x=>'<div style="margin-top:9px"><span class="pill">'+esc(x.k)+'</span><div class="meta">'+x.rate.toFixed(0)+'% accuracy · '+x.answered+' answered</div></div>').join(''):'<p class="meta">Not enough tagged questions.</p>')+'</div></div><h3 style="margin-top:24px">Question Review</h3>'+qs.map((q,i)=>{let x=amap[q.id]||{},sel=String(x.selected_option||'').toLowerCase(),cor=String(q.correct_option||'').toLowerCase(),ok=sel&&sel===cor;return '<div class="answer"><b>Q'+(i+1)+'. '+esc(q.question)+'</b>'+(q.statements?'<div class="meta" style="white-space:pre-wrap;margin-top:7px">'+esc(q.statements)+'</div>':'')+'<div class="meta">Your answer: '+esc(sel?sel.toUpperCase():'Unanswered')+' · Correct: '+esc(cor.toUpperCase())+' · <span class="'+(ok?'ok':'bad')+'">'+(ok?'Correct':'Review')+'</span></div>'+(q.explanation?'<div style="margin-top:5px">'+esc(q.explanation)+'</div>':'')+'</div>'}).join('')} })();</script></body></html>
