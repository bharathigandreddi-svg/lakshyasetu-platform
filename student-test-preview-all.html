<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Student Test Preview | LakshyaSetu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,system-ui,Arial,sans-serif}.top{background:#10233f;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:900}.sub{font-size:11px;color:#c8d8eb;margin-top:3px}.top a{color:#fff;text-decoration:none;font-size:12px;font-weight:800}.wrap{width:min(1150px,94%);margin:22px auto 50px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:18px;margin-bottom:14px}.error{background:#fff1f1;border-color:#f2c5c5;color:#991b1b}.hero h1{margin:0 0 5px;color:#10233f;font-size:25px}.muted{color:#667085;font-size:12px}.search{width:100%;padding:11px 13px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;margin-top:14px}.list{display:grid;gap:10px}.test{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid #dbe4ef;border-radius:11px;padding:15px;background:#fff}.test:hover{background:#f8fbff;border-color:#b8cce5}.title{font-weight:900;color:#10233f}.meta{margin-top:5px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;color:#2457a6;font-size:10px;font-weight:900;margin-right:5px}.badge.draft{background:#fff4e5;color:#9a6700}.btn{border:0;border-radius:8px;padding:10px 14px;background:#10233f;color:#fff;font-weight:900;text-decoration:none;white-space:nowrap}.hidden{display:none}@media(max-width:650px){.test{align-items:flex-start;flex-direction:column}.test .btn{width:100%;text-align:center}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">LakshyaSetu</div><div class="sub">Student Test Preview · Admin only · All tests</div></div><a href="admin-console.html">← Control Center</a></header>
<main class="wrap">
<div id="status" class="card">STUDENT PREVIEW BUILD 2026-09-13 — starting…</div>
<section id="app" class="hidden"><div class="card hero"><h1>Student Test Preview</h1><p class="muted">All non-archived tests are listed here. Published and Draft tests are both available for examiner review.</p><input id="search" class="search" placeholder="Search test title…"></div><div id="list" class="list"></div></section>
</main>
<script>
const U='https://byounbmdyuytoqqyhgos.supabase.co',K='sb_publishable_tCvBH8eh95-nXOChd2_sLQ__iDZIfNa';
const db=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
const wait=(p,t)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Admin check timed out.')),t))]);
let tests=[];
async function boot(){
  $('status').textContent='STUDENT PREVIEW BUILD 2026-09-13 — checking session…';
  const r=await wait(db.auth.getSession(),6000),s=r?.data?.session;
  if(!s){location.replace('login.html?next='+encodeURIComponent(location.href));return}
  $('status').textContent='Session found — checking admin role…';
  const p=await wait(db.from('profiles').select('role').eq('id',s.user.id).maybeSingle(),6000);
  if(p.error)throw p.error;
  const role=p.data?.role||s.user.app_metadata?.role||s.user.user_metadata?.role||'';
  if(role!=='admin'){$('status').className='card error';$('status').textContent='Admin access required.';return}
  $('status').className='card';$('status').innerHTML='<b>Admin preview active.</b> Select any test below. No real attempt, payment, rank or publication is affected.';$('app').classList.remove('hidden');
  const q=await wait(db.from('ls_tests').select('id,title,question_count,duration_minutes,published,archived,test_series_id,course_subject_id,topic_id').eq('archived',false).order('id',{ascending:false}),8000);
  if(q.error)throw q.error;tests=q.data||[];render();$('search').addEventListener('input',render)
}
function render(){const q=$('search').value.trim().toLowerCase();const rows=tests.filter(t=>(t.title||'').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(t=>'<div class="test"><div><div class="title">'+esc(t.title||'Untitled Test')+'</div><div class="meta"><span class="badge">ID '+t.id+'</span><span class="badge">'+Number(t.question_count||0)+' Q</span><span class="badge">'+Number(t.duration_minutes||0)+' min</span><span class="badge '+(!t.published?'draft':'')+'">'+(t.published?'PUBLISHED':'DRAFT')+'</span></div></div><a class="btn" href="admin-test-preview.html?test='+encodeURIComponent(t.id)+'">Open Preview →</a></div>').join(''):'<div class="card"><b>No tests found.</b><div class="muted">Try another search.</div></div>'}
boot().catch(e=>{$('status').className='card error';$('status').textContent=(e?.message||String(e))+' Open Login and sign in again.'});
</script>
</body>
</html>
