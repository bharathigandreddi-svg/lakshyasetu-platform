<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Student Test Preview | LakshyaSetu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,system-ui,Arial,sans-serif}.top{background:#10233f;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:900}.sub{font-size:11px;color:#c8d8eb;margin-top:3px}.top a{color:#fff;text-decoration:none;font-size:12px;font-weight:800}.wrap{width:min(1150px,94%);margin:22px auto 50px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:18px;margin-bottom:14px}.error{background:#fff1f1;border-color:#f2c5c5;color:#991b1b}.hero h1{margin:0 0 5px;color:#10233f;font-size:25px}.muted{color:#667085;font-size:12px}.search{width:100%;padding:11px 13px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;margin-top:14px}.series-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.series-card{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(16,42,67,.06);display:flex;flex-direction:column;min-height:205px}.series-card h2{margin:9px 0;color:#173b67;font-size:19px}.series-meta{color:#64748b;font-size:13px;line-height:1.5;min-height:40px}.series-tests{display:none;gap:8px;margin-top:12px;border-top:1px solid #e1e8f0;padding-top:12px}.series-tests.open{display:grid}.test{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid #dbe4ef;border-radius:10px;padding:13px;background:#fbfcfe}.test:hover{background:#f8fbff;border-color:#b8cce5}.title{font-weight:900;color:#10233f}.meta{margin-top:5px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;color:#2457a6;font-size:10px;font-weight:900;margin-right:5px}.badge.draft{background:#fff4e5;color:#9a6700}.series-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.series-count{font-size:11px;color:#64748b;background:#f3f6fa;border-radius:999px;padding:5px 8px;font-weight:800}.series-actions{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:14px}.series-actions .btn{font-size:13px;padding:9px 13px}.series-tag{display:inline-block;width:max-content;padding:5px 8px;border-radius:999px;background:#f3f6fa;color:#64748b;font-size:10px;font-weight:800}.btn{border:0;border-radius:8px;padding:10px 14px;background:#10233f;color:#fff;font-weight:900;text-decoration:none;white-space:nowrap}.hidden{display:none}@media(max-width:900px){.series-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.series-list{grid-template-columns:1fr}.test{align-items:flex-start;flex-direction:column}.test .btn{width:100%;text-align:center}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">LakshyaSetu</div><div class="sub">Student Test Preview · Admin only · All tests</div></div><a href="admin-console.html">← Control Center</a></header>
<main class="wrap">
<div id="status" class="card">STUDENT PREVIEW BUILD 2026-09-13 — starting…</div>
<section id="app" class="hidden"><div class="card hero"><h1>Student Test Preview</h1><p class="muted">All non-archived tests are listed here. Published and Draft tests are both available for examiner review.</p><input id="search" class="search" placeholder="Search test title…"></div><div id="list" class="series-list"></div></section>
</main>
<script>
const U='https://byounbmdyuytoqqyhgos.supabase.co',K='sb_publishable_tCvBH8eh95-nXOChd2_sLQ__iDZIfNa';
const db=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
const wait=(p,t)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Admin check timed out.')),t))]);
let tests=[],series=[];
async function boot(){
  $('status').textContent='STUDENT PREVIEW BUILD 2026-09-13 — checking session…';
  const r=await wait(db.auth.getSession(),6000),s=r?.data?.session;
  if(!s){location.replace('login.html?next='+encodeURIComponent(location.href));return}
  $('status').textContent='Session found — checking admin role…';
  const p=await wait(db.from('profiles').select('role').eq('id',s.user.id).maybeSingle(),6000);
  if(p.error)throw p.error;
  const role=p.data?.role||s.user.app_metadata?.role||s.user.user_metadata?.role||'';
  if(role!=='admin'){$('status').className='card error';$('status').textContent='Admin access required.';return}
  $('status').className='card';$('status').innerHTML='<b>Admin preview active.</b> Select any test below. No real attempt, payment, rank or publication is affected.';$('app').classList.remove('hidden');
  const [q,sr]=await Promise.all([wait(db.from('ls_tests').select('id,title,question_count,duration_minutes,published,archived,test_series_id,course_subject_id,topic_id').eq('archived',false).order('id',{ascending:true}),8000),wait(db.from('ls_test_series').select('id,title,description,published,archived').eq('archived',false).order('id',{ascending:false}),8000)]);
  if(q.error)throw q.error;if(sr.error)throw sr.error;tests=q.data||[];series=sr.data||[];render();$('search').addEventListener('input',render)
}
function toggleSeries(id,btn){const el=$(id);if(!el)return;const open=el.classList.toggle('open');btn.textContent=open?'Hide Tests':'View Tests'}
function render(){const q=$('search').value.trim().toLowerCase();const visible=tests.filter(t=>(t.title||'').toLowerCase().includes(q));const bySeries=new Map();visible.forEach(t=>{const sid=Number(t.test_series_id||0);if(!bySeries.has(sid))bySeries.set(sid,[]);bySeries.get(sid).push(t)});const orderedSeries=series.filter(s=>bySeries.has(Number(s.id)));const unknown=[...bySeries.keys()].filter(sid=>!series.some(s=>Number(s.id)===sid));$('list').innerHTML=orderedSeries.concat(unknown.map(id=>({id,title:'Test Series '+id,description:''}))).map(s=>{const rows=bySeries.get(Number(s.id))||[];const safeId='series-'+Number(s.id);return '<section class="series-card"><div class="series-head"><div><span class="series-tag">'+rows.length+' published test'+(rows.length===1?'':'s')+'</span><h2>'+esc(s.title||('Test Series '+s.id))+'</h2><div class="series-meta">'+esc(s.description||'Structured MCQ test series for focused preparation.')+'</div></div></div><div class="series-actions"><span style="font-size:12px;color:#64748b;font-weight:800;margin-right:auto">Student Preview</span><button class="btn" type="button" onclick="toggleSeries(\''+safeId+'\',this)">View Tests</button></div><div id="'+safeId+'" class="series-tests">'+rows.map(t=>'<div class="test"><div><div class="title">'+esc(t.title||'Untitled Test')+'</div><div class="meta"><span class="badge">ID '+t.id+'</span><span class="badge">'+Number(t.question_count||0)+' Q</span><span class="badge">'+Number(t.duration_minutes||0)+' min</span><span class="badge '+(!t.published?'draft':'')+'">'+(t.published?'PUBLISHED':'DRAFT')+'</span></div></div><a class="btn" href="admin-test-preview.html?test='+encodeURIComponent(t.id)+'">Open Preview →</a></div>').join('')+'</div></section>'}).join('')||'<div class="card"><b>No tests found.</b><div class="muted">Try another search.</div></div>'}

boot().catch(e=>{$('status').className='card error';$('status').textContent=(e?.message||String(e))+' Open Login and sign in again.'});
</script>
</body>
</html>
