<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test | LakshyaSetu</title><style>body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 20px}.brand{font-weight:900;color:#183b75}.wrap{max-width:1050px;margin:auto;padding:22px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:8px;background:#e4e8ef;border-radius:99px;overflow:hidden;margin:14px 0 22px}.progress i{display:block;height:100%;background:#2457a6}.card{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:22px}.opts{display:grid;gap:10px;margin:20px 0}.opt{padding:14px;border:1px solid #dce2eb;border-radius:10px;background:#fff;text-align:left;cursor:pointer}.opt.sel{border-color:#2457a6;background:#eef4ff}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.nav button{border:1px solid #dce2eb;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.nav button.done{background:#e9f5ed}.nav button.cur{outline:2px solid #2457a6}.actions{display:flex;justify-content:space-between;gap:10px}.actions button{padding:11px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:#2457a6;color:#fff}.muted{background:#edf1f6}.hidden{display:none}.error{color:#b42318}.statement{background:#f7f9fc;border-left:4px solid #2457a6;padding:12px;margin:12px 0;white-space:pre-wrap}.media{max-width:100%;margin:10px 0;border-radius:10px}.note{color:#64748b;font-size:12px}.access{background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:24px;max-width:680px}.access h1{margin-top:0;color:#173b67}.access p{color:#526174}.access a{display:inline-block;margin-top:8px;padding:11px 16px;border-radius:9px;background:#2457a6;color:#fff;text-decoration:none;font-weight:800}@media(max-width:700px){.wrap{padding:14px}}</style></head><body><header class="top"><span class="brand">LakshyaSetu</span></header><main class="wrap"><div id="status">Loading test…</div><section id="app" class="hidden"><div class="bar"><h1 id="title"></h1><b id="timer"></b></div><div class="progress"><i id="prog"></i></div><div id="question"></div><div class="nav" id="nav"></div><div class="actions"><button class="muted" id="prev">Previous</button><button class="primary" id="next">Save & Next</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260913-4"></script><script>(async()=>{const db=getLakshyaSetuDb(),$=x=>document.getElementById(x),p=new URLSearchParams(location.search),id=Number(p.get('test')||p.get('test_id'));let user,test,qs=[],ans={},cur=0,remaining=0,submitted=false,attemptId=null,startedAt=0,timerHandle=null;if(!id){$('status').textContent='Missing test ID.';return}const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const nowIso=()=>new Date().toISOString();function accessLink(){return String(test?.test_type||'').toLowerCase()==='current_affairs'?'current-affairs-tests.html':'test-series.html'}function deny(message){$('status').className='';$('status').innerHTML='<div class="access"><h1>Test Access</h1><p>'+esc(message)+'</p><a href="'+accessLink()+'">Back to Test Series</a></div>'}async function hasPaidAccess(){if(Number(test.price||0)<=0)return true;const r=await db.from('ls_purchases').select('id,test_id,test_series_id,access_start_at,access_expiry_at').eq('user_id',user.id).eq('status','ACTIVE').eq('payment_status','paid');if(r.error)throw r.error;const now=Date.now();return(r.data||[]).some(x=>{const start=x.access_start_at?new Date(x.access_start_at).getTime():0,expiry=x.access_expiry_at?new Date(x.access_expiry_at).getTime():Infinity;return start<=now&&now<expiry&&(Number(x.test_id)===id||Number(x.test_series_id)===Number(test.test_series_id))})}try{user=(await db.auth.getUser()).data.user;if(!user){$('status').textContent='Please log in to take this test.';return}let a=await db.from('ls_tests').select('*').eq('id',id).eq('published',true).eq('archived',false).single();if(a.error)throw a.error;test=a.data;if(!(await hasPaidAccess())){deny('This is a paid test. Please purchase the individual test or its Test Series before starting.');return}let b=await db.from('ls_test_questions').select('*').eq('test_id',id).order('display_order',{ascending:true});if(b.error)throw b.error;qs=b.data||[];if(!qs.length)throw Error('This test has no questions.');const duration=Math.max(1,Number(test.duration_minutes||60))*60;let old=await db.from('ls_test_attempts').select('*').eq('test_id',id).eq('user_id',user.id).is('submitted_at',null).order('started_at',{ascending:false}).limit(1);if(old.error)throw old.error;if(old.data?.length){const o=old.data[0];attemptId=o.id;startedAt=new Date(o.started_at).getTime();remaining=Math.max(0,duration-Math.floor((Date.now()-startedAt)/1000));let aa=await db.from('ls_test_answers').select('test_question_id,selected_option').eq('attempt_id',attemptId);if(aa.error)throw aa.error;(aa.data||[]).forEach(x=>{const i=qs.findIndex(q=>q.id===x.test_question_id);if(i>=0&&x.selected_option)ans[i]=String(x.selected_option).toLowerCase()})}else{const maxAttempts=Number(test.max_attempts||0);if(maxAttempts>0){const used=await db.from('ls_test_attempts').select('id',{count:'exact',head:true}).eq('test_id',id).eq('user_id',user.id).not('submitted_at','is',null);if(used.error)throw used.error;if(Number(used.count||0)>=maxAttempts){deny('You have reached the maximum allowed attempts for this test.');return}}startedAt=Date.now();remaining=duration;let ins=await db.from('ls_test_attempts').insert({test_id:id,user_id:user.id,started_at:new Date(startedAt).toISOString()}).select('id').single();if(ins.error)throw ins.error;attemptId=ins.data.id}if(remaining<=0){await submit(true);return}$('title').textContent=test.title||'Test';$('status').className='hidden';$('app').classList.remove('hidden');render();tick();timerHandle=setInterval(tick,1000)}catch(e){$('status').className='error';$('status').textContent='Unable to load test. '+e.message}function render(){const q=qs[cur],statement=q.statements?'<div class="statement"><b>Statements / Data</b><br>'+esc(q.statements)+'</div>':'',image=q.image_url?'<img class="media" src="'+esc(q.image_url)+'" alt="Question image">':'';$('prog').style.width=((cur+1)/qs.length*100)+'%';$('question').innerHTML='<div class="card"><p><b>Question '+(cur+1)+' of '+qs.length+'</b></p><h2>'+esc(q.question)+'</h2>'+statement+image+'<div class="opts">'+['a','b','c','d'].map(k=>'<button class="opt '+(ans[cur]===k?'sel':'')+'" data-k="'+k+'"><b>'+k.toUpperCase()+'.</b> '+esc(q['option_'+k])+'</button>').join('')+'</div><div class="note">'+(q.marks!=null?'Marks: '+Number(q.marks):'')+(q.negative_marks?' · Negative: '+Number(q.negative_marks):'')+'</div></div>';document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>saveAnswer(x.dataset.k));$('prev').disabled=cur===0;$('next').textContent=cur===qs.length-1?'Submit Test':'Save & Next';$('nav').innerHTML=qs.map((_,i)=>'<button class="'+(ans[i]?'done ':'')+(i===cur?'cur':'')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');document.querySelectorAll('#nav button').forEach(x=>x.onclick=()=>{cur=Number(x.dataset.i);render()})}async function saveAnswer(k){ans[cur]=k;const r=await db.from('ls_test_answers').upsert({attempt_id:attemptId,test_question_id:qs[cur].id,selected_option:k},{onConflict:'attempt_id,test_question_id'});if(r.error){delete ans[cur];alert('Answer could not be saved. Please try again.');return}render()}function tick(){if(submitted)return;remaining=Math.max(0,remaining-1);$('timer').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(remaining===0)submit(true)}$('prev').onclick=()=>{if(cur>0){cur--;render()}};$('next').onclick=()=>{if(cur===qs.length-1)submit(false);else{cur++;render()}};async function submit(autoSubmit){if(submitted)return;submitted=true;clearInterval(timerHandle);if(!autoSubmit&&!confirm('Submit this test now? You will not be able to change your answers afterward.')){submitted=false;timerHandle=setInterval(tick,1000);return}let score=0,correct=0,attempted=0,marks=0;qs.forEach((q,i)=>{const m=Number(q.marks||1),n=Number(q.negative_marks||0);marks+=m;if(ans[i]){attempted++;if(ans[i]===String(q.correct_option||'').toLowerCase()){correct++;score+=m}else score-=n}});const pct=marks?Math.max(0,score/marks*100):0,up=await db.from('ls_test_attempts').update({submitted_at:nowIso(),score,total_marks:marks,percentage:pct,correct_count:correct,wrong_count:attempted-correct,unanswered_count:qs.length-attempted}).eq('id',attemptId).eq('user_id',user.id).is('submitted_at',null);if(up.error){submitted=false;timerHandle=setInterval(tick,1000);alert('Result could not be saved. '+up.error.message);return}location.href='student-results.html?attempt='+encodeURIComponent(attemptId)}})();</script></body></html>
