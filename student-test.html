<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test | LakshyaSetu</title><style>body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 20px}.brand{font-weight:900;color:#183b75}.wrap{max-width:1050px;margin:auto;padding:22px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:8px;background:#e4e8ef;border-radius:99px;overflow:hidden;margin:14px 0 22px}.progress i{display:block;height:100%;background:#2457a6}.card{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:22px}.opts{display:grid;gap:10px;margin:20px 0}.opt{padding:14px;border:1px solid #dce2eb;border-radius:10px;background:#fff;text-align:left;cursor:pointer}.opt.sel{border-color:#2457a6;background:#eef4ff}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.nav button{border:1px solid #dce2eb;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.nav button.done{background:#e9f5ed}.nav button.cur{outline:2px solid #2457a6}.actions{display:flex;justify-content:space-between;gap:10px}.actions button{padding:11px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:#2457a6;color:#fff}.muted{background:#edf1f6}.hidden{display:none}.result strong{font-size:26px}.review{border-top:1px solid #e5e9f0;margin-top:18px;padding-top:14px}.ok{color:#18733b}.bad{color:#b42318}.error{color:#b42318}</style></head><body><header class="top"><span class="brand">LakshyaSetu</span></header><main class="wrap"><div id="status">Loading test…</div><section id="app" class="hidden"><div class="bar"><h1 id="title"></h1><b id="timer"></b></div><div class="progress"><i id="prog"></i></div><div id="question"></div><div class="nav" id="nav"></div><div class="actions"><button class="muted" id="prev">Previous</button><button class="primary" id="next">Save & Next</button></div></section><section id="result" class="card result hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909"></script><script>
(async()=>{const db=getLakshyaSetuDb(),$=x=>document.getElementById(x),id=Number(new URLSearchParams(location.search).get('test')||new URLSearchParams(location.search).get('test_id'));let test,qs=[],ans={},cur=0,remaining=0,submitted=false;const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
if(!id){$('status').textContent='Missing test ID.';return}try{let a=await db.from('ls_tests').select('*').eq('id',id).eq('published',true).eq('archived',false).single();if(a.error)throw a.error;test=a.data;let b=await db.from('ls_test_questions').select('*').eq('test_id',id).order('display_order',{ascending:true});if(b.error)throw b.error;qs=b.data||[];if(!qs.length)throw Error('This test has no questions.');remaining=Number(test.duration_minutes||test.duration||60)*60;$('title').textContent=test.title||'Test';$('status').className='hidden';$('app').classList.remove('hidden');render();setInterval(tick,1000)}catch(e){$('status').className='error';$('status').textContent='Unable to load test. '+e.message}
function render(){let q=qs[cur];$('prog').style.width=((cur+1)/qs.length*100)+'%';$('question').innerHTML='<div class="card"><p><b>Question '+(cur+1)+' of '+qs.length+'</b></p><h2>'+esc(q.question)+'</h2><div class="opts">'+['a','b','c','d'].map(k=>'<button class="opt '+(ans[cur]===k?'sel':'')+'" data-k="'+k+'"><b>'+k.toUpperCase()+'.</b> '+esc(q['option_'+k])+'</button>').join('')+'</div></div>';document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{ans[cur]=x.dataset.k;render()});$('prev').disabled=cur===0;$('next').textContent=cur===qs.length-1?'Submit Test':'Save & Next';$('nav').innerHTML=qs.map((_,i)=>'<button class="'+(ans[i]?'done ':'')+(i===cur?'cur':'')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');document.querySelectorAll('#nav button').forEach(x=>x.onclick=()=>{cur=Number(x.dataset.i);render()})}
function tick(){if(submitted)return;remaining=Math.max(0,remaining-1);$('timer').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(remaining===0)submit()}
$('prev').onclick=()=>{if(cur>0){cur--;render()}};$('next').onclick=()=>{if(cur===qs.length-1)submit();else{cur++;render()}};
function submit(){if(submitted)return;submitted=true;let score=0,correct=0,attempted=0;qs.forEach((q,i)=>{if(ans[i]){attempted++;if(ans[i]===String(q.correct_option||'').toLowerCase()){correct++;score+=Number(q.marks||test.marks||1)}else score-=Number(q.negative_marks||0)}});$('app').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML='<h1>Test Result</h1><p><strong>'+score+'</strong> marks</p><p>Correct: '+correct+' · Attempted: '+attempted+' · Unanswered: '+(qs.length-attempted)+'</p><div class="review"><h2>Question Review</h2>'+qs.map((q,i)=>'<p><b>Q'+(i+1)+'.</b> '+esc(q.question)+'<br>Your answer: '+(ans[i]||'Unanswered')+' · Correct: '+esc(q.correct_option||'')+(q.explanation?'<br>Explanation: '+esc(q.explanation):'')+'</p>').join('')+'</div>'}}
})();</script></body></html>
