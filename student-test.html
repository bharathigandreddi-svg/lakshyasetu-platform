<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test | LakshyaSetu</title><style>body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 20px}.brand{font-weight:900;color:#183b75}.wrap{max-width:1050px;margin:auto;padding:22px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:8px;background:#e4e8ef;border-radius:99px;overflow:hidden;margin:14px 0 22px}.progress i{display:block;height:100%;background:#2457a6}.card{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:22px}.opts{display:grid;gap:10px;margin:20px 0}.opt{padding:14px;border:1px solid #dce2eb;border-radius:10px;background:#fff;text-align:left;cursor:pointer}.opt.sel{border-color:#2457a6;background:#eef4ff}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.nav button{border:1px solid #dce2eb;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.nav button.done{background:#e9f5ed}.nav button.cur{outline:2px solid #2457a6}.actions{display:flex;justify-content:space-between;gap:10px}.actions button{padding:11px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:#2457a6;color:#fff}.muted{background:#edf1f6}.hidden{display:none}.error{color:#b42318}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f7f9fc;border:1px solid #e1e6ee;border-radius:10px;padding:14px}.review{border-top:1px solid #e5e9f0;margin-top:18px;padding-top:14px}@media(max-width:700px){.statgrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><span class="brand">LakshyaSetu</span></header><main class="wrap"><div id="status">Loading test…</div><section id="app" class="hidden"><div class="bar"><h1 id="title"></h1><b id="timer"></b></div><div class="progress"><i id="prog"></i></div><div id="question"></div><div class="nav" id="nav"></div><div class="actions"><button class="muted" id="prev">Previous</button><button class="primary" id="next">Save & Next</button></div></section><section id="result" class="card hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909"></script><script>(async()=>{const db=getLakshyaSetuDb(),$=x=>document.getElementById(x),p=new URLSearchParams(location.search),id=Number(p.get('test')||p.get('test_id'));let user=(await db.auth.getUser()).data.user,test,qs=[],ans={},cur=0,remaining=0,submitted=false,attemptId=null,startedAt=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));if(!id){$('status').textContent='Missing test ID.';return}try{if(!user){$('status').textContent='Please log in to take this test.';return}let a=await db.from('ls_tests').select('*').eq('id',id).eq('published',true).eq('archived',false).single();if(a.error)throw a.error;test=a.data;let b=await db.from('ls_test_questions').select('*').eq('test_id',id).order('display_order',{ascending:true});if(b.error)throw b.error;qs=b.data||[];if(!qs.length)throw Error('This test has no questions.');const duration=Number(test.duration_minutes||test.duration||60)*60;let old=await db.from('ls_test_attempts').select('*').eq('test_id',id).eq('user_id',user.id).eq('status','in_progress').order('started_at',{ascending:false}).limit(1);if(old.data?.length){const o=old.data[0];attemptId=o.id;startedAt=new Date(o.started_at).getTime();remaining=Math.max(0,duration-Math.floor((Date.now()-startedAt)/1000));let aa=await db.from('ls_test_answers').select('*').eq('attempt_id',attemptId);if(aa.error)throw aa.error;(aa.data||[]).forEach(x=>{let i=qs.findIndex(q=>q.id===x.test_question_id);if(i>=0&&x.selected_option)ans[i]=String(x.selected_option).toLowerCase()})}else{startedAt=Date.now();remaining=duration;let ins=await db.from('ls_test_attempts').insert({test_id:id,user_id:user.id,started_at:new Date(startedAt).toISOString()}).select('id').single();if(ins.error)throw ins.error;attemptId=ins.data.id}$('title').textContent=test.title||'Test';$('status').className='hidden';$('app').classList.remove('hidden');render();tick();setInterval(tick,1000)}catch(e){$('status').className='error';$('status').textContent='Unable to load test. '+e.message}function render(){let q=qs[cur];$('prog').style.width=((cur+1)/qs.length*100)+'%';$('question').innerHTML='<div class="card"><p><b>Question '+(cur+1)+' of '+qs.length+'</b></p><h2>'+esc(q.question)+'</h2><div class="opts">'+['a','b','c','d'].map(k=>'<button class="opt '+(ans[cur]===k?'sel':'')+'" data-k="'+k+'"><b>'+k.toUpperCase()+'.</b> '+esc(q['option_'+k])+'</button>').join('')+'</div></div>';document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>saveAnswer(x.dataset.k));$('prev').disabled=cur===0;$('next').textContent=cur===qs.length-1?'Submit Test':'Save & Next';$('nav').innerHTML=qs.map((_,i)=>'<button class="'+(ans[i]?'done ':'')+(i===cur?'cur':'')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');document.querySelectorAll('#nav button').forEach(x=>x.onclick=()=>{cur=Number(x.dataset.i);render()})}async function saveAnswer(k){ans[cur]=k;let q=qs[cur];let r=await db.from('ls_test_answers').upsert({attempt_id:attemptId,test_question_id:q.id,selected_option:k},{onConflict:'attempt_id,test_question_id'});if(r.error){delete ans[cur];alert('Answer could not be saved. Please try again.');return}render()}function tick(){if(submitted)return;remaining=Math.max(0,remaining-1);$('timer').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(remaining===0)submit()}$('prev').onclick=()=>{if(cur>0){cur--;render()}};$('next').onclick=()=>{if(cur===qs.length-1)submit();else{cur++;render()}};async function submit(){if(submitted)return;submitted=true;let score=0,correct=0,attempted=0,marks=0;qs.forEach((q,i)=>{let m=Number(q.marks||test.marks||1),n=Number(q.negative_marks||0);marks+=m;if(ans[i]){attempted++;if(ans[i]===String(q.correct_option||'').toLowerCase()){correct++;score+=m}else score-=n}});let pct=marks?Math.max(0,score/marks*100):0;let up=await db.from('ls_test_attempts').update({submitted_at:new Date().toISOString(),score,total_marks:marks,percentage:pct,correct_count:correct,wrong_count:attempted-correct,unanswered_count:qs.length-attempted}).eq('id',attemptId).eq('user_id',user.id);if(up.error){submitted=false;alert('Result could not be saved. Please try again.');return}location.href='student-results.html?attempt='+encodeURIComponent(attemptId)}})();</script></body></html>
