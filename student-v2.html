<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LakshyaSetu Student</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">LakshyaSetu<small>Learn. Prepare. Achieve.</small></div><div><a class="btn" href="home.html">Home</a> <a class="btn" href="report-card.html">My Report Card</a></div></header><main class="wrap"><section class="hero"><h1>Student Learning</h1><p>Course → Subject → Topic → Tests. Paid content follows Login → Purchase → Access.</p></section><div id="error"></div><section id="content"><div class="panel">Loading…</div></section></main><footer class="footer">LakshyaSetu © 2026</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="payments-v2.js?v=12"></script><script>
const db=getLakshyaSetuDb(),$=id=>document.getElementById(id),p=new URLSearchParams(location.search),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m])),money=v=>Number(v||0)?'₹'+Number(v).toLocaleString('en-IN'):'Free';
async function session(){return(await db.auth.getSession()).data.session||null}
async function requireLogin(next){const s=await session();if(s)return s;location.href='login.html?next='+encodeURIComponent(next);return null}
async function hasAccess(type,key,value){const s=await session();if(!s)return false;const r=await db.from('ls_purchases').select('id').eq('user_id',s.user.id).eq('status','ACTIVE').eq('payment_status','paid').eq('product_type',type).eq(key,value).or('access_expiry_at.is.null,access_expiry_at.gte.'+new Date().toISOString()).limit(1);return !r.error&&(r.data||[]).length>0}
async function buy(type,key,id,label){const s=await requireLogin(location.href);if(!s)return;if(typeof LSBuy!=='function')return error('Payment service is still loading. Please refresh.');LSBuy({product_type:type,[key]:id},label,s)}
function error(t){$('error').innerHTML='<div class="error">'+esc(t)+'</div>'}
function card(title,body,button){return '<article class="card"><h3>'+esc(title)+'</h3>'+body+(button||'')+'</article>'}
async function openTest(t){if(Number(t.price||0)<=0)return location.href='student-test.html?test='+t.id;const s=await requireLogin(location.href);if(!s)return;if(await hasAccess('test','test_id',t.id)||await hasAccess('test_series','test_series_id',t.test_series_id))return location.href='student-test.html?test='+t.id;$('content').innerHTML='<div class="panel"><h2>'+esc(t.title)+'</h2><p>Purchase this test or its Test Series to start.</p><h3>'+money(t.price)+'</h3><button class="btn" onclick="buy(\'test\',\'test_id\','+t.id+',\'Buy Test\')">Buy Test</button></div>'}
async function renderTests(title,tests){$('content').innerHTML='<h2>'+esc(title)+' — Tests</h2><div class="grid">'+(tests||[]).map(x=>card(x.title, '<p>'+Number(x.question_count||0)+' questions · '+Number(x.duration_minutes||0)+' min</p><b>'+money(x.price)+'</b><br>', '<button class="action" onclick="openTest('+JSON.stringify(x).replace(/</g,'\\u003c')+')">'+(Number(x.price||0)?'Buy / Start Test':'Start Test')+'</button>')).join('')+'</div>'}
async function load(){
 const [cr,sr]=await Promise.all([db.from('ls_courses').select('id,title,description,course_fee,published,archived').eq('published',true).eq('archived',false).order('id'),db.from('ls_test_series').select('*').eq('published',true).eq('archived',false).order('id')]);
 if(cr.error||sr.error)return error((cr.error||sr.error).message);const courses=cr.data||[],series=sr.data||[];
 const testId=Number(p.get('test')||0),courseId=Number(p.get('course')||0),subjectId=Number(p.get('subject')||0),topicId=Number(p.get('topic')||0),seriesId=Number(p.get('series')||0);
 if(testId){const r=await db.from('ls_tests').select('*').eq('id',testId).single();if(r.error)return error(r.error.message);return openTest(r.data)}
 if(seriesId){const sr0=series.find(x=>Number(x.id)===seriesId);if(!sr0)return error('Test Series not found.');const t=await db.from('ls_tests').select('*').eq('test_series_id',seriesId).eq('published',true).eq('archived',false).order('id');if(t.error)return error(t.error.message);return renderTests(sr0.title,t.data||[])}
 if(topicId){const tr=await db.from('ls_topics').select('id,title,description,topic_fee,validity_days,published,archived,course_subject_id').eq('id',topicId).eq('published',true).eq('archived',false).single();if(tr.error)return error('Topic not found.');const t=await db.from('ls_tests').select('*').eq('topic_id',topicId).eq('published',true).eq('archived',false).order('id');if(t.error)return error(t.error.message);let html='<div class="panel"><h2>'+esc(tr.data.title)+'</h2><p>'+esc(tr.data.description||'')+'</p><b>'+money(tr.data.topic_fee)+'</b></div>';if(Number(tr.data.topic_fee||0)>0&&!await hasAccess('topic','topic_id',topicId))html+='<div class="panel"><p>This topic requires purchase.</p><button class="btn" onclick="buy(\'topic\',\'topic_id\','+topicId+',\'Buy Topic\')">Buy Topic</button></div>';html+='<h2>Tests</h2><div class="grid">'+(t.data||[]).map(x=>card(x.title,'<p>'+Number(x.question_count||0)+' questions · '+Number(x.duration_minutes||0)+' min</p><b>'+money(x.price)+'</b><br>','<button class="action" onclick="openTest('+JSON.stringify(x).replace(/</g,'\\u003c')+')">'+(Number(x.price||0)?'Buy / Start Test':'Start Test')+'</button>')).join('')+'</div>';return $('content').innerHTML=html}
 if(subjectId){const m=await db.from('ls_course_subjects').select('id,course_id,subject_id,subject_fee,validity_days,published,archived,ls_subjects(title,description,published,archived)').eq('id',subjectId).eq('published',true).eq('archived',false).single();if(m.error||!m.data?.ls_subjects?.published||m.data.ls_subjects.archived)return error('Subject not found.');const topics=await db.from('ls_topics').select('id,title,description,topic_fee,published,archived,display_order').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('display_order').order('id');if(topics.error)return error(topics.error.message);let html='<div class="panel"><h2>'+esc(m.data.ls_subjects.title)+'</h2><p>'+esc(m.data.ls_subjects.description||'')+'</p><b>'+money(m.data.subject_fee)+'</b></div>';if(Number(m.data.subject_fee||0)>0&&!await hasAccess('subject','course_subject_id',subjectId))html+='<div class="panel"><p>This subject requires purchase.</p><button class="btn" onclick="buy(\'subject\',\'course_subject_id\','+subjectId+',\'Buy Subject\')">Buy Subject</button></div>';html+='<h2>Topics</h2><div class="grid">'+(topics.data||[]).map(x=>card(x.title,'<p>'+esc(x.description||'')+'</p><b>'+money(x.topic_fee)+'</b><br>','<button class="action" onclick="location.href=\'student-v2.html?topic='+x.id+'\'">View Topic</button>')).join('')+'</div>';return $('content').innerHTML=html}
 if(courseId){const course=courses.find(x=>Number(x.id)===courseId);if(!course)return error('Course not found.');if(Number(course.course_fee||0)>0&&!await hasAccess('course','course_id',courseId))return $('content').innerHTML='<div class="panel"><h2>'+esc(course.title)+'</h2><p>This course requires purchase.</p><h3>'+money(course.course_fee)+'</h3><button class="btn" onclick="buy(\'course\',\'course_id\','+courseId+',\'Buy Course\')">Buy Course</button></div>';const m=await db.from('ls_course_subjects').select('id,subject_id,subject_fee,display_order,published,archived,ls_subjects(title,description,published,archived)').eq('course_id',courseId).eq('published',true).eq('archived',false).order('display_order').order('id');if(m.error)return error(m.error.message);$('content').innerHTML='<h2>'+esc(course.title)+' — Subjects</h2><div class="grid">'+(m.data||[]).filter(x=>x.ls_subjects?.published&&!x.ls_subjects?.archived).map(x=>card(x.ls_subjects.title,'<p>'+esc(x.ls_subjects.description||'')+'</p><b>'+money(x.subject_fee)+'</b><br>','<button class="action" onclick="location.href=\'student-v2.html?subject='+x.id+'\'">View Topics</button>')).join('')+'</div>';return}
 $('content').innerHTML='<h2>Courses</h2><div class="grid">'+courses.map(c=>card(c.title,'<p>'+esc(c.description||'')+'</p><b>'+money(c.course_fee)+'</b><br>','<button class="action" onclick="location.href=\'student-v2.html?course='+c.id+'\'">Open Course</button>')).join('')+'</div><h2 style="margin-top:28px">Test Series</h2><div class="grid">'+series.map(s=>card(s.title,'<p>'+esc(s.description||'')+'</p><b>'+money(s.price)+'</b><br>','<button class="action" onclick="location.href=\'student-v2.html?series='+s.id+'\'">View Tests</button>')).join('')+'</div>'
}
load().catch(e=>error(e.message||String(e)))
</script></body></html>
