<script>

const sb = window.supabase.createClient(
  LAKSHYASETU_CONFIG.supabaseUrl,
  LAKSHYASETU_CONFIG.supabasePublishableKey
);

const courseTitle = document.getElementById("courseTitle");
const courseDesc = document.getElementById("courseDesc");
const subjectArea = document.getElementById("subjectArea");
const lessonArea = document.getElementById("lessonArea");
const faqArea = document.getElementById("faqArea");
const backArea = document.getElementById("backArea");
const feeArea = document.getElementById("feeArea");

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function boot() {

  const userResult = await sb.auth.getUser();

  if (!userResult.data.user) {
    location.href = "login.html";
    return;
  }

  const params = new URLSearchParams(location.search);

  const courseSlug =
    params.get("course") || "appsc-group-1";

  const subjectId =
    params.get("subject");

  const courseResult = await sb
    .from("courses")
    .select("*")
    .eq("slug", courseSlug)
    .eq("published", true)
    .single();

  if (courseResult.error) {

    courseTitle.textContent = "Course not found";

    courseDesc.textContent =
      "The requested course is not currently available.";

    console.error(courseResult.error);

    return;
  }

  const course = courseResult.data;

  courseTitle.textContent =
    course.title;

  courseDesc.textContent =
    course.description || "";

  if (subjectId) {

    await loadSubjectPage(
      course.id,
      Number(subjectId)
    );

    renderBackButton();

  } else {

    await loadSubjects(course.id);

    renderFAQs();

  }
}

async function loadSubjects(courseId) {

  const result = await sb
    .from("course_subjects")
    .select(`
      id,
      title,
      slug,
      description,
      sort_order,
      published,
      subject_fee
    `)
    .eq("course_id", courseId)
    .eq("published", true)
    .order("sort_order")
    .order("id");

  if (result.error) {

    subjectArea.innerHTML = `
      <div class="error-card">
        Unable to load subjects.
      </div>
    `;

    console.error(result.error);

    return;
  }

  const subjects =
    result.data || [];

  if (!subjects.length) {

    subjectArea.innerHTML = `
      <div class="info-card">
        <h3>No published subjects yet.</h3>
        <p class="muted">
          Subjects will appear here once they are published.
        </p>
      </div>
    `;

    return;
  }

  subjectArea.innerHTML = `

    <h2 class="section-title">
      APPSC Group 1 Subjects
    </h2>

    <div class="course-grid">

      ${subjects.map(subject => `

        <a
          class="course-card"
          href="student.html?course=appsc-group-1&subject=${subject.id}"
        >

          <h3>
            ${escapeHtml(subject.title)}
          </h3>

          <p class="muted">
            ${escapeHtml(
              subject.description || "Open subject"
            )}
          </p>

        </a>

      `).join("")}

    </div>
  `;
}

async function loadSubjectPage(
  courseId,
  subjectId
) {

  const subjectResult = await sb
    .from("course_subjects")
    .select(`
      id,
      course_id,
      title,
      description,
      sort_order,
      published
    `)
    .eq("id", subjectId)
    .eq("course_id", courseId)
    .eq("published", true)
    .single();

  if (subjectResult.error) {

    subjectArea.innerHTML = `
      <div class="error-card">
        Subject not found.
      </div>
    `;

    console.error(subjectResult.error);

    return;
  }

  const subject =
    subjectResult.data;

  courseTitle.textContent =
    subject.title;

  courseDesc.textContent =
    subject.description || "";

  const topicsResult = await sb
    .from("subject_topics")
    .select(`
      id,
      title,
      slug,
      sort_order
    `)
    .eq("subject_id", subjectId)
    .order("sort_order")
    .order("id");

  if (topicsResult.error) {

    subjectArea.innerHTML = `
      <div class="error-card">
        Unable to load topics.
      </div>
    `;

    console.error(topicsResult.error);

    return;
  }

  const topics =
    topicsResult.data || [];

  if (!topics.length) {

    subjectArea.innerHTML = `
      <div class="info-card">

        <h3>
          No topics available yet.
        </h3>

        <p class="muted">
          Topics will appear here once they are added.
        </p>

      </div>
    `;

    return;
  }

  const topicIds =
    topics.map(topic => topic.id);

  const videosResult = await sb
    .from("topic_videos")
    .select(`
      id,
      topic_id,
      title,
      video_url,
      thumbnail_url,
      duration_seconds,
      sort_order,
      published,
      is_trial
    `)
    .in("topic_id", topicIds)
    .eq("published", true)
    .order("sort_order")
    .order("id");

  if (videosResult.error) {
    console.error(videosResult.error);
  }

  const videos =
    videosResult.data || [];

  const videosByTopic = {};

  videos.forEach(video => {

    if (!videosByTopic[video.topic_id]) {
      videosByTopic[video.topic_id] = [];
    }

    videosByTopic[video.topic_id].push(video);

  });

  subjectArea.innerHTML = `

    <h2 class="section-title">
      Topics
    </h2>

    <div class="course-grid">

      ${topics.map(topic => {

        const topicVideos =
          videosByTopic[topic.id] || [];

        return `

          <div class="course-card">

            <h3>
              ${escapeHtml(topic.title)}
            </h3>

            <p class="muted">

              ${
                topicVideos.length
                  ? `${topicVideos.length} published video${topicVideos.length > 1 ? "s" : ""}`
                  : "Video content coming soon"
              }

            </p>

            ${
              topicVideos.length
                ?
                `
                <div style="margin-top:16px">

                  ${topicVideos.map(video => `

                    <div
                      class="info-card"
                      style="margin-top:12px"
                    >

                      <h4>
                        ${escapeHtml(video.title)}
                      </h4>

                      ${
                        video.video_url
                          ?
                          `
                          <video
                            controls
                            preload="metadata"
                            style="
                              width:100%;
                              max-height:400px;
                              margin-top:10px;
                            "
                            ${
                              video.thumbnail_url
                                ? `poster="${escapeHtml(video.thumbnail_url)}"`
                                : ""
                            }
                            src="${escapeHtml(video.video_url)}"
                          ></video>
                          `
                          :
                          `
                          <p class="muted">
                            Video URL pending.
                          </p>
                          `
                      }

                      ${
                        video.is_trial
                          ?
                          `
                          <p class="status">
                            Free Trial
                          </p>
                          `
                          :
                          ""
                      }

                    </div>

                  `).join("")}

                </div>
                `
                :
                ""
            }

          </div>

        `;

      }).join("")}

    </div>

  `;
}

function renderBackButton() {

  backArea.innerHTML = `

    <a
      class="btn alt back-btn"
      href="student.html?course=appsc-group-1"
    >
      Back to APPSC Group 1
    </a>

  `;
}

function renderFAQs() {

  faqArea.innerHTML = `

    <h2 class="section-title">
      Frequently Asked Questions
    </h2>

    <div class="info-card">

      <h3>
        How do I access a subject?
      </h3>

      <p class="muted">
        Select a subject from the APPSC Group 1 course page.
      </p>

    </div>

    <div class="info-card">

      <h3>
        Where will the topics appear?
      </h3>

      <p class="muted">
        Topics and published videos will appear inside the selected subject.
      </p>

    </div>

    <div class="info-card">

      <h3>
        When will videos become available?
      </h3>

      <p class="muted">
        Videos will appear automatically after they are published by the admin.
      </p>

    </div>

  `;
}

const logoutButton =
  document.getElementById("logout");

if (logoutButton) {

  logoutButton.onclick = async () => {

    await sb.auth.signOut();

    location.href = "login.html";

  };

}

boot();

</script>
