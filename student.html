<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LakshyaSetu | Student</title>

  <link rel="stylesheet" href="styles.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    .student-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .student-header {
      background: #10233f;
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
    }

    .brand small {
      display: block;
      font-size: 12px;
      font-weight: 500;
      opacity: .75;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button,
    a {
      font-family: inherit;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
    }

    .btn-primary {
      background: #2457a6;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1d4789;
    }

    .btn-light {
      background: #fff;
      color: #10233f;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #cfd7e6;
      color: #10233f;
    }

    .page-heading {
      margin-bottom: 25px;
    }

    .page-heading h1 {
      margin: 0 0 8px;
      color: #10233f;
      font-size: 32px;
    }

    .page-heading p {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    .breadcrumb {
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      color: #667085;
      font-size: 14px;
    }

    .breadcrumb button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      color: #2457a6;
      font-weight: 700;
    }

    .breadcrumb .current {
      color: #172033;
      font-weight: 700;
    }

    .loading,
    .empty,
    .error-box {
      padding: 22px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #dfe5ee;
      text-align: center;
      margin-top: 20px;
    }

    .error-box {
      background: #fff5f5;
      border-color: #f3caca;
      color: #a61b1b;
      text-align: left;
    }

    .course-grid,
    .subject-grid,
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }

    .course-card,
    .subject-card,
    .topic-card {
      background: #fff;
      border: 1px solid #dfe5ee;
      border-radius: 16px;
      padding: 22px;
      transition: .2s;
      box-shadow: 0 2px 8px rgba(16,35,63,.04);
    }

    .course-card:hover,
    .subject-card:hover,
    .topic-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(16,35,63,.10);
      border-color: #b8c8e2;
    }

    .card-number {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4ff;
      color: #2457a6;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .course-card h2,
    .subject-card h2,
    .topic-card h2 {
      margin: 0 0 9px;
      color: #10233f;
      font-size: 20px;
      line-height: 1.35;
    }

    .course-card p,
    .subject-card p,
    .topic-card p {
      color: #667085;
      line-height: 1.55;
      margin: 0 0 14px;
      font-size: 14px;
    }

    .fee-box {
      background: #f7f9fc;
      border: 1px solid #e1e6ef;
      border-radius: 11px;
      padding: 13px;
      margin: 15px 0;
    }

    .fee-label {
      font-size: 12px;
      color: #667085;
      margin-bottom: 4px;
    }

    .fee-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .old-fee {
      text-decoration: line-through;
      color: #8b93a1;
      font-size: 14px;
    }

    .current-fee {
      color: #10233f;
      font-size: 24px;
      font-weight: 800;
    }

    .free-label {
      color: #187a3d;
      font-weight: 800;
      font-size: 18px;
    }

    .not-set {
      color: #667085;
      font-size: 14px;
      font-style: italic;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 15px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eef4ff;
      color: #2457a6;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.green {
      background: #eaf7ee;
      color: #187a3d;
    }

    .badge.orange {
      background: #fff4df;
      color: #9a6500;
    }

    .card-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 28px 0 16px;
      color: #10233f;
      font-size: 24px;
    }

    .subject-top,
    .topic-top {
      background: #fff;
      border: 1px solid #dfe5ee;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .subject-top h1,
    .topic-top h1 {
      margin: 0 0 7px;
      color: #10233f;
    }

    .subject-top p,
    .topic-top p {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }

    .lesson-card {
      background: #fff;
      border: 1px solid #dfe5ee;
      border-radius: 14px;
      padding: 18px;
    }

    .lesson-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }

    .lesson-title {
      font-weight: 800;
      color: #10233f;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .lesson-description {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .lesson-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .option-box {
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid #dfe5ee;
      background: #f8fafc;
      font-size: 13px;
    }

    .locked {
      color: #8a3d00;
      background: #fff4df;
      border-color: #f2d49a;
    }

    .trial {
      color: #187a3d;
      background: #eaf7ee;
      border-color: #b9e2c7;
    }

    .video-box {
      margin-top: 15px;
      background: #0b0d10;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-box video {
      width: 100%;
      max-height: 600px;
      display: block;
    }

    .notice {
      padding: 14px 16px;
      border-radius: 10px;
      background: #eef4ff;
      color: #2457a6;
      margin-bottom: 18px;
      line-height: 1.5;
      font-size: 14px;
    }

    .purchase-panel {
      background: linear-gradient(135deg, #10233f, #2457a6);
      color: #fff;
      border-radius: 16px;
      padding: 24px;
      margin: 20px 0;
    }

    .purchase-panel h2 {
      margin: 0 0 8px;
    }

    .purchase-panel p {
      margin: 0 0 16px;
      opacity: .9;
      line-height: 1.6;
    }

    .purchase-price {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {

      .student-header {
        padding: 14px 15px;
      }

      .brand {
        font-size: 18px;
      }

      .student-wrap {
        padding: 22px 13px 45px;
      }

      .page-heading h1 {
        font-size: 26px;
      }

      .lesson-main {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>

<header class="student-header">

  <div class="brand">
    LakshyaSetu
    <small>Student Learning Portal</small>
  </div>

  <div class="header-actions">

    <a
      href="index.html"
      class="btn btn-light"
    >
      Home
    </a>

    <button
      id="logoutBtn"
      class="btn btn-light"
    >
      Logout
    </button>

  </div>

</header>


<main class="student-wrap">

  <div id="breadcrumb" class="breadcrumb"></div>

  <div id="app"></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const supabaseClient =
  window.supabase.createClient(
    window.LAKSHYASETU_CONFIG.supabaseUrl,
    window.LAKSHYASETU_CONFIG.supabasePublishableKey
  );


const app =
  document.getElementById("app");

const breadcrumb =
  document.getElementById("breadcrumb");

const logoutBtn =
  document.getElementById("logoutBtn");


let currentUser = null;

let currentCourse = null;

let currentSubject = null;

let currentTopic = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function money(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  const amount = Number(value);

  if (!Number.isFinite(amount)) {
    return null;
  }

  if (amount <= 0) {
    return null;
  }

  return "₹" +
    amount.toLocaleString("en-IN");

}


/*
  IMPORTANT:

  Pricing is NEVER created here.

  Pricing is only READ from the database.

  Admin controls the database values.

  If Admin has not entered a price,
  the student sees "Price not set by Admin".
*/

function feeHtml(
  currentFee,
  originalFee,
  label
) {

  const current =
    money(currentFee);

  const original =
    money(originalFee);


  if (!current && !original) {

    return `
      <div class="fee-box">

        <div class="fee-label">
          ${escapeHtml(label)}
        </div>

        <div class="not-set">
          Price not set by Admin
        </div>

      </div>
    `;

  }


  if (
    current &&
    original &&
    Number(originalFee) > Number(currentFee)
  ) {

    return `
      <div class="fee-box">

        <div class="fee-label">
          ${escapeHtml(label)}
        </div>

        <div class="fee-row">

          <span class="old-fee">
            ${original}
          </span>

          <span class="current-fee">
            ${current}
          </span>

        </div>

      </div>
    `;

  }


  return `
    <div class="fee-box">

      <div class="fee-label">
        ${escapeHtml(label)}
      </div>

      <div class="current-fee">
        ${current || original}
      </div>

    </div>
  `;

}


function showLoading(message) {

  app.innerHTML = `
    <div class="loading">
      ${escapeHtml(message || "Loading...")}
    </div>
  `;

}


function showError(message) {

  app.innerHTML = `
    <div class="error-box">

      <strong>
        Unable to load this page.
      </strong>

      <br>
      <br>

      ${escapeHtml(message)}

    </div>
  `;

}


/* =========================================================
   DATABASE VALUE HELPERS
========================================================= */

/*
  These helpers allow Admin-controlled pricing to work
  without hardcoding a particular pricing implementation.

  The student page simply reads whichever values exist
  in the database.
*/

function getCourseCurrentFee(course) {

  return (
    course?.current_fee ??
    course?.course_fee ??
    null
  );

}


function getCourseOriginalFee(course) {

  return (
    course?.original_fee ??
    null
  );

}


function getSubjectFee(subject) {

  return (
    subject?.subject_fee ??
    null
  );

}


function getTopicFee(topic) {

  return (
    topic?.topic_fee ??
    null
  );

}


/* =========================================================
   BREADCRUMB
========================================================= */

function renderBreadcrumb() {

  const parts = [];

  parts.push(`
    <button onclick="goHome()">
      Courses
    </button>
  `);


  if (currentCourse) {

    parts.push(`
      <span>›</span>

      <button onclick="openCourseById(${currentCourse.id})">
        ${escapeHtml(currentCourse.title)}
      </button>
    `);

  }


  if (currentSubject) {

    parts.push(`
      <span>›</span>

      <button onclick="openSubjectById(${currentSubject.id})">
        ${escapeHtml(currentSubject.title)}
      </button>
    `);

  }


  if (currentTopic) {

    parts.push(`
      <span>›</span>

      <span class="current">
        ${escapeHtml(currentTopic.title)}
      </span>
    `);

  }


  breadcrumb.innerHTML =
    parts.join("");

}


/* =========================================================
   HOME
========================================================= */

async function goHome() {

  currentCourse = null;

  currentSubject = null;

  currentTopic = null;


  history.pushState(
    {},
    "",
    "student.html"
  );


  renderBreadcrumb();

  await loadCourses();

}


async function loadCourses() {

  currentCourse = null;

  currentSubject = null;

  currentTopic = null;

  renderBreadcrumb();


  showLoading(
    "Loading courses..."
  );


  /*
    IMPORTANT:

    We intentionally use select("*").

    This prevents the student page from failing
    because of a column such as "archived" that
    does not exist in the actual database.

    No pricing is generated here.
    Pricing is read directly from Admin-controlled
    database fields.
  */

  const result =
    await supabaseClient
      .from("courses")
      .select("*")
      .eq("published", true)
      .order("id");


  if (result.error) {

    showError(
      result.error.message
    );

    return;

  }


  const courses =
    result.data || [];


  if (!courses.length) {

    app.innerHTML = `
      <div class="empty">
        No courses are currently available.
      </div>
    `;

    return;

  }


  app.innerHTML = `

    <div class="page-heading">

      <h1>
        Courses
      </h1>

      <p>
        Choose a course to view its subjects,
        topics and lessons.
      </p>

    </div>


    <div class="course-grid">

      ${courses.map((course, index) => {

        const currentFee =
          getCourseCurrentFee(course);

        const originalFee =
          getCourseOriginalFee(course);


        return `

          <div class="course-card">

            <div class="card-number">
              ${index + 1}
            </div>


            <h2>
              ${escapeHtml(course.title)}
            </h2>


            <p>
              ${escapeHtml(
                course.description ||
                "Structured preparation course."
              )}
            </p>


            <div class="card-meta">

              ${
                course.language
                ? `
                  <span class="badge">
                    ${escapeHtml(course.language)}
                  </span>
                `
                : ""
              }


              ${
                course.validity_years
                ? `
                  <span class="badge">
                    ${escapeHtml(course.validity_years)}
                    years
                  </span>
                `
                : ""
              }

            </div>


            ${feeHtml(
              currentFee,
              originalFee,
              "Course Fee"
            )}


            <div class="card-actions">

              <button
                class="btn btn-primary"
                onclick="openCourseById(${course.id})"
              >
                View Subjects
              </button>

            </div>

          </div>

        `;

      }).join("")}

    </div>

  `;

}


/* =========================================================
   COURSE
========================================================= */

async function openCourseById(courseId) {

  showLoading(
    "Loading course..."
  );


  const result =
    await supabaseClient
      .from("courses")
      .select("*")
      .eq("id", courseId)
      .eq("published", true)
      .single();


  if (result.error) {

    showError(
      result.error.message
    );

    return;

  }


  currentCourse =
    result.data;

  currentSubject = null;

  currentTopic = null;


  const courseSlug =
    currentCourse.slug ||
    String(currentCourse.id);


  history.pushState(
    {},
    "",
    "student.html?course=" +
    encodeURIComponent(courseSlug)
  );


  renderBreadcrumb();


  await loadSubjects(
    currentCourse.id
  );

}


/* =========================================================
   SUBJECTS
========================================================= */

async function loadSubjects(courseId) {

  showLoading(
    "Loading subjects..."
  );


  const result =
    await supabaseClient
      .from("course_subjects")
      .select("*")
      .eq("course_id", courseId)
      .eq("published", true)
      .order("sort_order", {
        ascending: true
      })
      .order("id", {
        ascending: true
      });


  if (result.error) {

    showError(
      result.error.message
    );

    return;

  }


  const subjects =
    result.data || [];


  app.innerHTML = `

    <div class="page-heading">

      <h1>
        ${escapeHtml(
          currentCourse.title
        )}
      </h1>

      <p>
        ${escapeHtml(
          currentCourse.description || ""
        )}
      </p>

    </div>


    ${feeHtml(
      getCourseCurrentFee(currentCourse),
      getCourseOriginalFee(currentCourse),
      "Course Fee"
    )}


    <h2 class="section-title">
      Subjects
    </h2>


    ${
      subjects.length
      ? `
        <div class="subject-grid">

          ${subjects.map((subject, index) => `

            <div class="subject-card">

              <div class="card-number">
                ${index + 1}
              </div>


              <h2>
                ${escapeHtml(
                  subject.title
                )}
              </h2>


              <p>
                ${escapeHtml(
                  subject.description ||
                  "Open this subject to view topics."
                )}
              </p>


              <div class="card-meta">

                ${
                  subject.is_trial === true
                  ? `
                    <span class="badge green">
                      Trial Available
                    </span>
                  `
                  : ""
                }

              </div>


              ${feeHtml(
                getSubjectFee(subject),
                null,
                "Subject Fee"
              )}


              <div class="card-actions">

                <button
                  class="btn btn-primary"
                  onclick="openSubjectById(${subject.id})"
                >
                  View Topics
                </button>

              </div>

            </div>

          `).join("")}

        </div>
      `
      : `
        <div class="empty">
          No published subjects are available
          for this course yet.
        </div>
      `
    }

  `;

}


/* =========================================================
   SUBJECT
========================================================= */

async function openSubjectById(
  courseSubjectId
) {

  showLoading(
    "Loading subject..."
  );


  if (!currentCourse) {

    showError(
      "Course information is missing."
    );

    return;

  }


  const result =
    await supabaseClient
      .from("course_subjects")
      .select("*")
      .eq("id", courseSubjectId)
      .eq("course_id", currentCourse.id)
      .eq("published", true)
      .single();


  if (result.error) {

    showError(
      result.error.message
    );

    return;

  }


  currentSubject =
    result.data;

  currentTopic = null;


  const courseSlug =
    currentCourse.slug ||
    String(currentCourse.id);


  history.pushState(
    {},
    "",
    "student.html?course=" +
    encodeURIComponent(courseSlug) +
    "&subject=" +
    currentSubject.id
  );


  renderBreadcrumb();


  await loadTopics(
    currentSubject.id
  );

}


/* =========================================================
   TOPICS
========================================================= */

async function loadTopics(
  courseSubjectId
) {

  showLoading(
    "Loading topics..."
  );


  const result =
    await supabaseClient
      .from("course_topics")
      .select("*")
      .eq(
        "course_subject_id",
        courseSubjectId
      )
      .eq("published", true)
      .order("sort_order", {
        ascending: true
      })
      .order("id", {
        ascending: true
      });


  if (result.error) {

    showError(
      result.error.message
    );

    return;

  }


  const topics =
    result.data || [];


  app.innerHTML = `

    <div class="subject-top">

      <h1>
        ${escapeHtml(
          currentSubject.title
        )}
      </h1>

      <p>
        ${escapeHtml(
          currentSubject.description ||
          "Select a topic to view lessons."
        )}
      </p>

    </div>


    ${feeHtml(
      getSubjectFee(currentSubject),
      null,
      "Subject Fee"
    )}


    <h2 class="section-title">
      Topics
    </h2>


    ${
      topics.length
      ? `
        <div class="topic-grid">

          ${topics.map((topic, index) => `

            <div class="topic-card">

              <div class="card-number">
                ${index + 1}
              </div>


              <h2>
                ${escapeHtml(
                  topic.title
                )}
              </h2>


              <p>
                ${escapeHtml(
                  topic.description ||
                  "Open topic to view lessons."
                )}
              </p>


              <div class="card-meta">

                ${
                  topic.video_count
                  ? `
                    <span class="badge">
                      ${escapeHtml(topic.video_count)}
                      videos
                    </span>
                  `
                  : ""
                }


                ${
                  topic.is_trial === true
                  ? `
                    <span class="badge green">
                      Trial
                    </span>
                  `
                  : ""
                }

              </div>


              ${feeHtml(
                getTopicFee(topic),
                null,
                "Topic Fee"
              )}


              <div class="card-actions">

                <button
                  class="btn btn-primary"
                  onclick="openTopicById(${topic.id})"
                >
                  View Lessons
                </button>

              </div>

            </div>

          `).join("")}

        </div>
      `
      : `
        <div class="empty">
          No published topics are available
          for this subject yet.
        </div>
      `
    }

  `;

}


/* =========================================================
   TOPIC
========================================================= */

async function openTopicById(
  topicId
) {

  showLoading(
    "Loading topic..."
  );


  if (!currentSubject) {

    showError(
      "Subject information is missing."
    );

    return;

  }


  const result =
    await supabaseClient
      .from("course_topics")
      .select("*")
      .eq("id", topicId)
      .eq(
        "course_subject_id",
        currentSubject.id
      )
      .eq("published", true)
      .single();


  if (result.error) {

    showError(
      result.error.message
    );

    return;

  }


  currentTopic =
    result.data;


  const courseSlug =
    currentCourse.slug ||
    String(currentCourse.id);


  history.pushState(
    {},
    "",
    "student.html?course=" +
    encodeURIComponent(courseSlug) +
    "&subject=" +
    currentSubject.id +
    "&topic=" +
    currentTopic.id
  );


  renderBreadcrumb();


  await loadLessons(
    currentTopic.id
  );

}


/* =========================================================
   LESSONS
========================================================= */

async function loadLessons(
  topicId
) {

  showLoading(
    "Loading lessons..."
  );


  /*
    We use select("*") because the actual lessons
    table structure was verified by you.

    Confirmed fields include:

    id
    course_id
    title
    description
    video_url
    pdf_url
    sort_order
    published
    subject_id
    is_trial
    visualized_fee
    ppt_fee
    visualized_video_url
    ppt_video_url
    topic_id
    video_count
  */


  const result =
    await supabaseClient
      .from("lessons")
      .select("*")
      .eq("topic_id", topicId)
      .eq("published", true)
      .order("sort_order", {
        ascending: true
      })
      .order("id", {
        ascending: true
      });


  if (result.error) {

    showError(
      result.error.message
    );

    return;

  }


  const lessons =
    result.data || [];


  app.innerHTML = `

    <div class="topic-top">

      <h1>
        ${escapeHtml(
          currentTopic.title
        )}
      </h1>

      <p>
        ${escapeHtml(
          currentTopic.description ||
          "Lessons available under this topic."
        )}
      </p>

    </div>


    ${feeHtml(
      getTopicFee(currentTopic),
      null,
      "Topic Fee"
    )}


    <div class="notice">

      Lesson access and pricing are controlled
      by Admin. Students cannot change or
      determine pricing.

    </div>


    <h2 class="section-title">
      Lessons
    </h2>


    ${
      lessons.length
      ? `
        <div class="lesson-list">

          ${lessons.map(
            (lesson, index) =>
              renderLesson(
                lesson,
                index
              )
          ).join("")}

        </div>
      `
      : `
        <div class="empty">
          No published lessons are available
          for this topic yet.
        </div>
      `
    }

  `;

}


/* =========================================================
   LESSON CARD
========================================================= */

function renderLesson(
  lesson,
  index
) {

  const trial =
    lesson.is_trial === true;


  const normalVideo =
    lesson.video_url || null;


  const visualizedFee =
    money(
      lesson.visualized_fee
    );


  const pptFee =
    money(
      lesson.ppt_fee
    );


  const visualizedVideo =
    lesson.visualized_video_url || null;


  const pptVideo =
    lesson.ppt_video_url || null;


  return `

    <div class="lesson-card">

      <div class="lesson-main">

        <div>

          <div class="lesson-title">

            ${index + 1}.
            ${escapeHtml(
              lesson.title
            )}

          </div>


          ${
            lesson.description
            ? `
              <div class="lesson-description">
                ${escapeHtml(
                  lesson.description
                )}
              </div>
            `
            : ""
          }

        </div>


        <div class="card-meta">

          ${
            trial
            ? `
              <span class="badge green">
                Free Trial
              </span>
            `
            : `
              <span class="badge orange">
                Premium
              </span>
            `
          }

        </div>

      </div>


      <div class="lesson-options">

        ${
          normalVideo
          ? `
            <div class="option-box">
              Main Video
            </div>
          `
          : ""
        }


        ${
          visualizedFee
          ? `
            <div class="option-box">
              Visualized Video:
              ${visualizedFee}
            </div>
          `
          : ""
        }


        ${
          pptFee
          ? `
            <div class="option-box">
              PPT Video:
              ${pptFee}
            </div>
          `
          : ""
        }


        ${
          visualizedVideo
          ? `
            <div class="option-box">
              Visualized Video Available
            </div>
          `
          : ""
        }


        ${
          pptVideo
          ? `
            <div class="option-box">
              PPT Video Available
            </div>
          `
          : ""
        }


        ${
          lesson.pdf_url
          ? `
            <div class="option-box">
              PDF Available
            </div>
          `
          : ""
        }

      </div>


      ${
        trial && normalVideo
        ? `
          <div class="video-box">

            <video
              controls
              preload="metadata"
              src="${escapeHtml(
                normalVideo
              )}"
            ></video>

          </div>
        `
        : `
          <div
            class="option-box locked"
            style="margin-top:14px;"
          >

            ${
              trial
              ? "Trial content will be available soon."
              : "This lesson is locked. Purchase access to watch the lesson."
            }

          </div>
        `
      }

    </div>

  `;

}


/* =========================================================
   INITIAL URL ROUTING
========================================================= */

async function boot() {

  try {

    const userResult =
      await supabaseClient.auth.getUser();


    if (
      !userResult.data ||
      !userResult.data.user
    ) {

      location.href =
        "login.html";

      return;

    }


    currentUser =
      userResult.data.user;


    const params =
      new URLSearchParams(
        location.search
      );


    const courseSlug =
      params.get("course");


    const subjectId =
      params.get("subject");


    const topicId =
      params.get("topic");


    /*
      No course selected.
    */

    if (!courseSlug) {

      await loadCourses();

      return;

    }


    /*
      Load course.

      IMPORTANT:
      No archived column is requested.
    */

    const courseResult =
      await supabaseClient
        .from("courses")
        .select("*")
        .eq("slug", courseSlug)
        .eq("published", true)
        .single();


    /*
      If slug is actually unavailable,
      allow numeric course ID in URL.
    */

    let courseData =
      courseResult.data;


    if (
      courseResult.error ||
      !courseData
    ) {

      if (
        /^\d+$/.test(courseSlug)
      ) {

        const fallbackResult =
          await supabaseClient
            .from("courses")
            .select("*")
            .eq(
              "id",
              Number(courseSlug)
            )
            .eq("published", true)
            .single();


        if (fallbackResult.error) {

          showError(
            fallbackResult.error.message
          );

          return;

        }


        courseData =
          fallbackResult.data;

      }
      else {

        showError(
          courseResult.error?.message ||
          "Course not found."
        );

        return;

      }

    }


    currentCourse =
      courseData;


    /*
      Topic selected.
    */

    if (
      subjectId &&
      topicId
    ) {

      const subjectResult =
        await supabaseClient
          .from("course_subjects")
          .select("*")
          .eq(
            "id",
            Number(subjectId)
          )
          .eq(
            "course_id",
            currentCourse.id
          )
          .eq("published", true)
          .single();


      if (subjectResult.error) {

        showError(
          subjectResult.error.message
        );

        return;

      }


      currentSubject =
        subjectResult.data;


      const topicResult =
        await supabaseClient
          .from("course_topics")
          .select("*")
          .eq(
            "id",
            Number(topicId)
          )
          .eq(
            "course_subject_id",
            currentSubject.id
          )
          .eq("published", true)
          .single();


      if (topicResult.error) {

        showError(
          topicResult.error.message
        );

        return;

      }


      currentTopic =
        topicResult.data;


      renderBreadcrumb();


      await loadLessons(
        currentTopic.id
      );


      return;

    }


    /*
      Subject selected.
    */

    if (subjectId) {

      currentSubject = null;


      await openSubjectById(
        Number(subjectId)
      );


      return;

    }


    /*
      Course selected.
    */

    await loadSubjects(
      currentCourse.id
    );


    renderBreadcrumb();

  }
  catch (error) {

    showError(
      error.message ||
      "Unexpected error."
    );

  }

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.onclick =
  async function() {

    await supabaseClient.auth.signOut();

    location.href =
      "login.html";

  };


/* =========================================================
   BROWSER BACK / FORWARD
========================================================= */

window.addEventListener(
  "popstate",
  function() {

    boot();

  }
);


/* =========================================================
   START
========================================================= */

boot();

</script>
