<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Student | LakshyaSetu</title>

  <link rel="stylesheet" href="styles.css">

  <style>

    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin-bottom: 8px;
    }

    .breadcrumb {
      margin-bottom: 18px;
    }

    .breadcrumb a {
      text-decoration: none;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(240px, 1fr)
      );
      gap: 16px;
      margin-top: 20px;
    }

    .course-card {
      display: block;
      padding: 22px;
      border: 1px solid #dfe5ee;
      border-radius: 14px;
      background: #fff;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }

    .course-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .course-card h3 {
      margin: 0 0 8px;
      color: #10233f;
    }

    .course-card p {
      margin: 0;
    }

    .count-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #eef4ff;
      color: #2457a6;
      font-size: 13px;
      font-weight: 600;
    }

    .section-title {
      margin-top: 32px;
      margin-bottom: 14px;
    }

    .info-card {
      padding: 22px;
      border: 1px solid #dfe5ee;
      border-radius: 14px;
      background: #fff;
      margin-top: 16px;
    }

    .subject-header {
      padding: 22px;
      border-radius: 14px;
      background: #f7f9fc;
      border: 1px solid #dfe5ee;
      margin-bottom: 24px;
    }

    .topic-card {
      border: 1px solid #dfe5ee;
      border-radius: 14px;
      background: #fff;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .topic-header {
      padding: 18px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .topic-header:hover {
      background: #f8fafc;
    }

    .topic-title {
      margin: 0;
      color: #10233f;
      font-size: 18px;
    }

    .topic-number {
      color: #667085;
      font-size: 14px;
      margin-right: 8px;
    }

    .topic-arrow {
      font-size: 18px;
      color: #667085;
    }

    .topic-content {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid #edf0f4;
    }

    .topic-content.open {
      display: block;
    }

    .video-card {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafbfc;
    }

    .video-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .video-meta {
      font-size: 13px;
      color: #667085;
      margin-bottom: 12px;
    }

    .video-player {
      width: 100%;
      max-height: 600px;
      border-radius: 10px;
      background: #000;
    }

    .trial-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 12px;
      background: #eaf7ee;
      color: #187a3d;
      font-size: 12px;
      font-weight: 700;
    }

    .locked-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 12px;
      background: #f1f3f5;
      color: #667085;
      font-size: 12px;
      font-weight: 600;
    }

    .status-message {
      padding: 18px;
      border-radius: 12px;
      background: #f7f9fc;
      border: 1px solid #dfe5ee;
      margin-top: 16px;
    }

    .error-message {
      padding: 18px;
      border-radius: 12px;
      background: #fff5f5;
      border: 1px solid #f3caca;
      color: #a61b1b;
      margin-top: 16px;
    }

    .back-btn {
      margin-bottom: 18px;
      display: inline-block;
    }

    .fee-card {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      background: #f7f9fc;
      border: 1px solid #dfe5ee;
    }

    .fee-label {
      font-size: 14px;
      color: #667085;
      margin-bottom: 6px;
    }

    .old-fee {
      text-decoration: line-through;
      color: #777;
      margin-right: 12px;
    }

    .current-fee {
      font-size: 28px;
      font-weight: 700;
    }

    .logout-btn {
      cursor: pointer;
    }

    .purchase-card {
      padding: 24px;
      border-radius: 14px;
      background: #f7f9fc;
      border: 1px solid #dfe5ee;
      margin-top: 20px;
    }

    .purchase-card h2 {
      margin-top: 0;
      color: #10233f;
    }

    .purchase-card p {
      color: #667085;
      line-height: 1.6;
    }

    .purchase-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 11px 18px;
      border-radius: 8px;
      background: #2457a6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .purchase-btn:hover {
      background: #1d4789;
    }

    .access-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #eaf7ee;
      color: #187a3d;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 600px) {

      .topic-header {
        padding: 15px;
      }

      .topic-title {
        font-size: 16px;
      }

      .topic-content {
        padding: 0 15px 15px;
      }

    }

  </style>

</head>


<body>


<header class="top">

  <div class="brand">
    LakshyaSetu
    <small>Student Dashboard</small>
  </div>

  <button
    id="logout"
    class="btn alt logout-btn"
  >
    Logout
  </button>

</header>


<main class="wrap">

  <section class="panel">

    <div id="backArea"></div>

    <div class="page-header">

      <h1 id="courseTitle">
        Loading...
      </h1>

      <p
        id="courseDesc"
        class="muted"
      ></p>

    </div>


    <div id="feeArea"></div>

    <div id="subjectArea"></div>

    <div id="topicArea"></div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const sb =
  window.supabase.createClient(
    LAKSHYASETU_CONFIG.supabaseUrl,
    LAKSHYASETU_CONFIG.supabasePublishableKey
  );


/* =====================================================
   ELEMENTS
===================================================== */

const courseTitle =
  document.getElementById("courseTitle");

const courseDesc =
  document.getElementById("courseDesc");

const subjectArea =
  document.getElementById("subjectArea");

const topicArea =
  document.getElementById("topicArea");

const backArea =
  document.getElementById("backArea");

const feeArea =
  document.getElementById("feeArea");

const logout =
  document.getElementById("logout");


/* =====================================================
   GLOBAL USER
===================================================== */

let currentUser = null;

let currentCourse = null;

let courseAccess = false;


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatDuration(seconds) {

  const total =
    Number(seconds || 0);

  if (!total) {
    return "";
  }

  const minutes =
    Math.floor(total / 60);

  const secs =
    total % 60;

  if (minutes >= 60) {

    const hours =
      Math.floor(minutes / 60);

    const mins =
      minutes % 60;

    return `${hours}h ${mins}m`;

  }

  return `${minutes}m ${secs}s`;

}


/* =====================================================
   COURSE FEE
===================================================== */

function renderCourseFee(course) {

  const original =
    Number(course.original_fee || 0);

  const current =
    Number(course.current_fee || 0);

  if (!original && !current) {

    feeArea.innerHTML = "";

    return;

  }

  let html = `
    <div class="fee-card">

      <div class="fee-label">
        Course Fee
      </div>
  `;


  if (
    original &&
    current &&
    original !== current
  ) {

    html += `
      <div>

        <span class="old-fee">
          ₹${original.toLocaleString("en-IN")}
        </span>

        <span class="current-fee">
          ₹${current.toLocaleString("en-IN")}
        </span>

      </div>
    `;

  }

  else if (current) {

    html += `
      <div class="current-fee">
        ₹${current.toLocaleString("en-IN")}
      </div>
    `;

  }

  else {

    html += `
      <div class="current-fee">
        ₹${original.toLocaleString("en-IN")}
      </div>
    `;

  }


  html += `
      </div>
  `;


  feeArea.innerHTML = html;

}


/* =====================================================
   GET COURSE
===================================================== */

async function getCourse(slug) {

  const result =
    await sb
      .from("courses")
      .select("*")
      .eq("slug", slug)
      .eq("published", true)
      .single();


  if (result.error) {

    throw new Error(
      result.error.message
    );

  }


  return result.data;

}


/* =====================================================
   CHECK COURSE PURCHASE
===================================================== */

async function checkCourseAccess(
  userId,
  courseId
) {

  const result =
    await sb
      .from("memberships")
      .select(
        "id,user_id,course_id,status,payment_status,expires_at,paid_at"
      )
      .eq("user_id", userId)
      .eq("course_id", courseId)
      .eq("payment_status", "paid")
      .order("created_at", {
        ascending: false
      });


  if (result.error) {

    throw new Error(
      result.error.message
    );

  }


  const memberships =
    result.data || [];


  const now =
    new Date();


  const validMembership =
    memberships.find(membership => {

      if (
        membership.payment_status !== "paid"
      ) {
        return false;
      }


      if (
        membership.status &&
        membership.status !== "active"
      ) {
        return false;
      }


      if (
        membership.expires_at
      ) {

        const expiry =
          new Date(
            membership.expires_at
          );

        if (
          expiry <= now
        ) {
          return false;
        }

      }


      return true;

    });


  return !!validMembership;

}


/* =====================================================
   PURCHASE REQUIRED SCREEN
===================================================== */

function showPurchaseRequired(course) {

  courseAccess = false;

  subjectArea.innerHTML = "";

  topicArea.innerHTML = "";


  renderCourseFee(course);


  subjectArea.innerHTML = `

    <div class="purchase-card">

      <h2>
        Course Access Required
      </h2>

      <p>
        You have not purchased this course yet.
        Please purchase the course from the
        LakshyaSetu Home page to access its
        subjects, topics and video lessons.
      </p>

      <p>
        After successful payment, login again
        with your student account and the
        purchased course subjects will appear
        here.
      </p>

      <a
        class="purchase-btn"
        href="index.html"
      >
        Go to LakshyaSetu Home
      </a>

    </div>

  `;

}


/* =====================================================
   LOAD COURSE SUBJECTS
===================================================== */

async function loadSubjects(courseId) {

  subjectArea.innerHTML = `

    <h2 class="section-title">
      Subjects
    </h2>

    <div class="status-message">
      Loading subjects...
    </div>

  `;


  const result =
    await sb
      .from("course_subjects")
      .select("*")
      .eq("course_id", courseId)
      .eq("published", true)
      .order("sort_order", {
        ascending: true
      });


  if (result.error) {

    subjectArea.innerHTML = `

      <div class="error-message">

        Unable to load subjects.

        <br>

        ${escapeHtml(
          result.error.message
        )}

      </div>

    `;

    return;

  }


  const subjects =
    result.data || [];


  if (!subjects.length) {

    subjectArea.innerHTML = `

      <h2 class="section-title">
        Subjects
      </h2>

      <div class="status-message">
        No published subjects are available yet.
      </div>

    `;

    return;

  }


  subjectArea.innerHTML = `

    <h2 class="section-title">
      Subjects
    </h2>

    <div class="access-badge">
      Course Access Active
    </div>

    <div class="course-grid">

      ${subjects.map(subject => `

        <a
          class="course-card"
          href="student.html?course=${encodeURIComponent(
            currentCourse.slug
          )}&subject=${subject.id}"
        >

          <h3>
            ${escapeHtml(subject.title)}
          </h3>

          <p class="muted">
            Open subject
          </p>

          <span class="count-badge">
            View Topics
          </span>

        </a>

      `).join("")}

    </div>

  `;

}


/* =====================================================
   GET COURSE SUBJECT
===================================================== */

async function getCourseSubject(
  courseId,
  courseSubjectId
) {

  const result =
    await sb
      .from("course_subjects")
      .select("*")
      .eq("course_id", courseId)
      .eq("id", courseSubjectId)
      .eq("published", true)
      .single();


  if (result.error) {

    throw new Error(
      result.error.message
    );

  }


  return result.data;

}


/* =====================================================
   LOAD TOPICS
===================================================== */

async function loadTopics(
  courseSubjectId
) {

  topicArea.innerHTML = `

    <h2 class="section-title">
      Topics
    </h2>

    <div class="status-message">
      Loading topics...
    </div>

  `;


  /*
     IMPORTANT

     In your current database:

     subject_topics.subject_id
     points to
     course_subjects.id

     Example:

     course_subjects.id = 27
     subject_topics.subject_id = 27

     Therefore we use courseSubjectId here.
  */


  const result =
    await sb
      .from("subject_topics")
      .select("*")
      .eq(
        "subject_id",
        courseSubjectId
      )
      .eq("published", true)
      .order("sort_order", {
        ascending: true
      });


  if (result.error) {

    topicArea.innerHTML = `

      <div class="error-message">

        Unable to load topics.

        <br>

        ${escapeHtml(
          result.error.message
        )}

      </div>

    `;

    return;

  }


  const topics =
    result.data || [];


  if (!topics.length) {

    topicArea.innerHTML = `

      <h2 class="section-title">
        Topics
      </h2>

      <div class="status-message">
        No topics have been added yet.
      </div>

    `;

    return;

  }


  topicArea.innerHTML = `

    <h2 class="section-title">
      Topics
    </h2>

    <div id="topicsList"></div>

  `;


  const topicsList =
    document.getElementById(
      "topicsList"
    );


  topicsList.innerHTML =
    topics.map((topic, index) => `

      <div class="topic-card">

        <div
          class="topic-header"
          onclick="toggleTopic(${topic.id})"
        >

          <div>

            <span class="topic-number">
              ${index + 1}.
            </span>

            <span class="topic-title">
              ${escapeHtml(
                topic.title
              )}
            </span>

          </div>

          <span
            id="arrow-${topic.id}"
            class="topic-arrow"
          >
            +
          </span>

        </div>


        <div
          id="topic-${topic.id}"
          class="topic-content"
        >

          <div
            id="videos-${topic.id}"
          >

            <div class="status-message">
              Loading videos...
            </div>

          </div>

        </div>

      </div>

    `).join("");

}


/* =====================================================
   TOGGLE TOPIC
===================================================== */

async function toggleTopic(topicId) {

  const content =
    document.getElementById(
      "topic-" + topicId
    );


  const arrow =
    document.getElementById(
      "arrow-" + topicId
    );


  if (!content) {
    return;
  }


  const isOpen =
    content.classList.contains(
      "open"
    );


  if (isOpen) {

    content.classList.remove(
      "open"
    );

    arrow.textContent = "+";

    return;

  }


  content.classList.add(
    "open"
  );

  arrow.textContent = "−";


  await loadVideos(topicId);

}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(topicId) {

  const container =
    document.getElementById(
      "videos-" + topicId
    );


  if (!container) {
    return;
  }


  container.innerHTML = `

    <div class="status-message">
      Loading videos...
    </div>

  `;


  const result =
    await sb
      .from("topic_videos")
      .select("*")
      .eq("topic_id", topicId)
      .eq("published", true)
      .order("sort_order", {
        ascending: true
      });


  if (result.error) {

    container.innerHTML = `

      <div class="error-message">

        Unable to load videos.

        <br>

        ${escapeHtml(
          result.error.message
        )}

      </div>

    `;

    return;

  }


  const videos =
    result.data || [];


  if (!videos.length) {

    container.innerHTML = `

      <div class="status-message">
        No published videos are available
        for this topic yet.
      </div>

    `;

    return;

  }


  container.innerHTML =
    videos.map((video, index) => {

      const duration =
        formatDuration(
          video.duration_seconds
        );


      const trialBadge =
        video.is_trial
          ? `
            <span class="trial-badge">
              Free Preview
            </span>
          `
          : "";


      let videoContent = "";


      if (video.video_url) {

        videoContent = `

          <video
            class="video-player"
            controls
            preload="metadata"
            src="${escapeHtml(
              video.video_url
            )}"
          >
          </video>

        `;

      }

      else {

        videoContent = `

          <div class="status-message">
            Video will be available soon.
          </div>

        `;

      }


      return `

        <div class="video-card">

          <div class="video-title">

            ${index + 1}.
            ${escapeHtml(
              video.title
            )}

            ${trialBadge}

          </div>


          ${
            duration
              ? `
                <div class="video-meta">
                  Duration: ${duration}
                </div>
              `
              : ""
          }


          ${videoContent}

        </div>

      `;

    }).join("");

}


/* =====================================================
   BACK BUTTON
===================================================== */

function showBackButton(type) {

  if (type === "subject") {

    backArea.innerHTML = `

      <a
        class="btn alt back-btn"
        href="student.html?course=${encodeURIComponent(
          currentCourse.slug
        )}"
      >
        ← Back to Subjects
      </a>

    `;

  }

  else {

    backArea.innerHTML = "";

  }

}


/* =====================================================
   SUBJECT PAGE
===================================================== */

async function openSubject(
  course,
  courseSubjectId
) {

  showBackButton("subject");


  subjectArea.innerHTML = "";


  try {

    /*
       SECURITY / ACCESS CHECK

       Even if somebody manually changes
       the URL, subjects should not open
       unless the course is purchased.
    */

    if (!courseAccess) {

      showPurchaseRequired(
        course
      );

      return;

    }


    const subject =
      await getCourseSubject(
        course.id,
        courseSubjectId
      );


    courseTitle.textContent =
      subject.title;


    courseDesc.textContent =
      "Topics and video lessons";


    feeArea.innerHTML = "";


    topicArea.innerHTML = `

      <div class="subject-header">

        <h2>
          ${escapeHtml(
            subject.title
          )}
        </h2>

        <p class="muted">
          Select a topic to view its
          available video lessons.
        </p>

      </div>

    `;


    /*
       IMPORTANT:

       subject_topics.subject_id
       = course_subjects.id

       So pass subject.id,
       NOT subject.subject_id.
    */

    await loadTopics(
      subject.id
    );

  }

  catch (error) {

    topicArea.innerHTML = `

      <div class="error-message">

        Subject could not be loaded.

        <br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   COURSE PAGE
===================================================== */

async function openCourse(course) {

  showBackButton("course");


  courseTitle.textContent =
    course.title;


  courseDesc.textContent =
    course.description || "";


  /*
     FIRST CHECK PAYMENT
  */

  subjectArea.innerHTML = `

    <div class="status-message">
      Checking your course access...
    </div>

  `;


  topicArea.innerHTML = "";


  try {

    courseAccess =
      await checkCourseAccess(
        currentUser.id,
        course.id
      );


    if (!courseAccess) {

      showPurchaseRequired(
        course
      );

      return;

    }


    /*
       Student has purchased the course.
       Now subjects can be displayed.
    */

    feeArea.innerHTML = "";


    await loadSubjects(
      course.id
    );

  }

  catch (error) {

    subjectArea.innerHTML = `

      <div class="error-message">

        Unable to verify course access.

        <br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

logout.onclick =
  async function() {

    await sb.auth.signOut();

    location.href =
      "login.html";

  };


/* =====================================================
   BOOT
===================================================== */

async function boot() {

  try {

    /*
       CHECK LOGIN
    */

    const userResult =
      await sb.auth.getUser();


    if (
      !userResult.data ||
      !userResult.data.user
    ) {

      location.href =
        "login.html";

      return;

    }


    currentUser =
      userResult.data.user;


    /*
       READ URL
    */

    const params =
      new URLSearchParams(
        location.search
      );


    const courseSlug =
      params.get("course") ||
      "appsc-group-1";


    const subjectId =
      params.get("subject");


    /*
       GET COURSE
    */

    const course =
      await getCourse(
        courseSlug
      );


    currentCourse =
      course;


    /*
       IF SUBJECT IS SELECTED
    */

    if (subjectId) {

      /*
         Check purchase before opening
         the subject directly.
      */

      courseAccess =
        await checkCourseAccess(
          currentUser.id,
          course.id
        );


      if (!courseAccess) {

        showBackButton("course");

        courseTitle.textContent =
          course.title;

        courseDesc.textContent =
          course.description || "";

        showPurchaseRequired(
          course
        );

        return;

      }


      await openSubject(
        course,
        Number(subjectId)
      );

    }

    /*
       OTHERWISE OPEN COURSE
    */

    else {

      await openCourse(
        course
      );

    }

  }

  catch (error) {

    courseTitle.textContent =
      "Unable to load page";


    courseDesc.textContent =
      error.message || "";


    feeArea.innerHTML = "";


    subjectArea.innerHTML = `

      <div class="error-message">

        Something went wrong while
        loading the course.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

boot();


</script>


</body>

</html>
