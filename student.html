<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student | LakshyaSetu</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div class="brand">LakshyaSetu <small>Student Dashboard</small></div><button id="logout" class="btn alt">Logout</button></header>
<main class="wrap"><section class="panel"><h1 id="courseTitle">Geography Concepts</h1><p id="courseDesc" class="muted"></p><div id="lessons" class="list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=window.supabase.createClient(LAKSHYASETU_CONFIG.supabaseUrl,LAKSHYASETU_CONFIG.supabasePublishableKey);
async function boot(){const u=await sb.auth.getUser();if(!u.data.user){location.href="login.html";return}const slug=new URLSearchParams(location.search).get("course")||"geography-concepts";const c=await sb.from("courses").select("*").eq("slug",slug).eq("published",true).single();if(c.error){lessons.innerHTML='<div class="item">Course not found.</div>';return}courseTitle.textContent=c.data.title;courseDesc.textContent=c.data.description||"";const l=await sb.from("lessons").select("*").eq("course_id",c.data.id).eq("published",true).order("sort_order");lessons.innerHTML=l.data?.map(x=>'<div class="item"><h2>'+x.title+'</h2><p class="muted">'+(x.description||"")+'</p>'+(x.video_url?'<video controls style="width:100%;max-height:600px" src="'+x.video_url+'"></video>':'<span class="status">Video pending</span>')+(x.pdf_url?'<p><a class="btn alt" href="'+x.pdf_url+'" target="_blank">Open Notes PDF</a></p>':"")+"</div>").join("")||'<div class="item">No published lessons yet.</div>'}
logout.onclick=async()=>{await sb.auth.signOut();location.href="login.html"};boot();
</script></body></html>
