<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Student | LakshyaSetu</title>

  <link rel="stylesheet" href="styles.css">

  <style>

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .course-card {
      display: block;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }

    .course-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .course-card h3 {
      margin: 0 0 8px;
    }

    .course-card p {
      margin: 0;
    }

    .section-title {
      margin-top: 32px;
      margin-bottom: 12px;
    }

    .info-card {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      margin-top: 16px;
    }

    .back-btn {
      margin-bottom: 18px;
    }

    .fee-box {
      margin-top: 24px;
      padding: 24px;
      border-radius: 14px;
      background: #f5f8fc;
      border: 1px solid #dfe6ef;
    }

    .fee-label {
      color: #667085;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .current-fee {
      font-size: 32px;
      font-weight: 800;
      color: #102746;
    }

    .original-fee {
      margin-top: 5px;
      color: #667085;
      text-decoration: line-through;
      font-size: 16px;
    }

    .no-fee {
      color: #667085;
      font-size: 16px;
    }

    .course-status {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #e7f5f2;
      color: #0f766e;
      font-size: 13px;
      font-weight: 700;
    }

  </style>

</head>

<body>

<header class="top">

  <div class="brand">
    LakshyaSetu
    <small>Student Dashboard</small>
  </div>

  <button id="logout" class="btn alt">
    Logout
  </button>

</header>


<main class="wrap">

  <section class="panel">

    <div id="backArea"></div>

    <h1 id="courseTitle">
      Loading...
    </h1>

    <p id="courseDesc" class="muted"></p>

    <div id="feeArea"></div>

    <div id="subjectArea"></div>

    <div id="lessonArea"></div>

    <div id="faqArea"></div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const sb = window.supabase.createClient(
  LAKSHYASETU_CONFIG.supabaseUrl,
  LAKSHYASETU_CONFIG.supabasePublishableKey
);


const courseTitle = document.getElementById("courseTitle");
const courseDesc = document.getElementById("courseDesc");
const feeArea = document.getElementById("feeArea");
const subjectArea = document.getElementById("subjectArea");
const lessonArea = document.getElementById("lessonArea");
const faqArea = document.getElementById("faqArea");
const backArea = document.getElementById("backArea");


/* -------------------------------------------------
   APPSC GROUP 1 SUBJECTS
------------------------------------------------- */

const appscSubjects = [

  {
    title: "Geography",
    description: "Indian and World Geography concepts for APPSC Group 1.",
    keywords: ["geography"]
  },

  {
    title: "History",
    description: "Ancient, Medieval and Modern Indian History.",
    keywords: ["history"]
  },

  {
    title: "AP History",
    description: "History of Andhra Pradesh and important regional developments.",
    keywords: ["ap-history", "andhra-history"]
  },

  {
    title: "AP Geography",
    description: "Andhra Pradesh Geography, resources, rivers, agriculture and regional development.",
    keywords: ["ap-geography", "andhra-geography"]
  },

  {
    title: "Science and Technology",
    description: "Important Science and Technology concepts for competitive examinations.",
    keywords: ["science-technology", "science-and-technology"]
  },

  {
    title: "Environment",
    description: "Environment, Ecology, Biodiversity and Climate Change.",
    keywords: ["environment", "ecology"]
  },

  {
    title: "Current Affairs",
    description: "Important national, international and Andhra Pradesh current affairs.",
    keywords: ["current-affairs"]
  },

  {
    title: "Test Series",
    description: "Practice tests, MCQs and examination-oriented assessments.",
    keywords: ["test-series", "tests"]
  }

];


/* -------------------------------------------------
   TEXT NORMALIZER
------------------------------------------------- */

function normalizeText(value) {

  return (value || "")
    .toString()
    .toLowerCase()
    .trim()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ");

}


/* -------------------------------------------------
   FORMAT MONEY
------------------------------------------------- */

function formatMoney(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "";
  }

  const number = Number(value);

  if (Number.isNaN(number)) {
    return "";
  }

  return "₹" + number.toLocaleString("en-IN");

}


/* -------------------------------------------------
   LOGIN CHECK
------------------------------------------------- */

async function boot() {

  const userResult = await sb.auth.getUser();

  if (!userResult.data.user) {

    location.href = "login.html";

    return;
  }


  const params = new URLSearchParams(
    location.search
  );


  const requestedCourse =
    params.get("course");


  const course = await findCourse(
    requestedCourse
  );


  if (!course) {

    courseTitle.textContent =
      "Course not found";

    courseDesc.textContent =
      "The requested course is not currently available.";

    feeArea.innerHTML = "";

    return;
  }


  showCourse(course);

}


/* -------------------------------------------------
   FIND COURSE
------------------------------------------------- */

async function findCourse(requestedCourse) {


  /* -----------------------------------------------
     FIRST: LOAD ALL COURSES
  ----------------------------------------------- */

  const result = await sb
    .from("courses")
    .select("*")
    .order("id");


  if (result.error) {

    console.error(
      "Course loading error:",
      result.error
    );

    return null;
  }


  const courses = result.data || [];


  if (!courses.length) {

    return null;
  }


  /* -----------------------------------------------
     IF NO COURSE PARAMETER
     TRY APPSC GROUP 1 & 2
  ----------------------------------------------- */

  if (!requestedCourse) {

    const defaultCourse =
      courses.find(course => {

        const title =
          normalizeText(course.title);

        return (
          title.includes("appsc group 1")
        );

      });

    return defaultCourse || courses[0];
  }


  const requested =
    normalizeText(requestedCourse);


  /* -----------------------------------------------
     MATCH BY ID
  ----------------------------------------------- */

  const byId = courses.find(course => {

    return String(course.id) ===
      String(requestedCourse);

  });


  if (byId) {

    return byId;
  }


  /* -----------------------------------------------
     MATCH BY EXACT SLUG
  ----------------------------------------------- */

  const bySlug = courses.find(course => {

    return normalizeText(course.slug) ===
      requested;

  });


  if (bySlug) {

    return bySlug;
  }


  /* -----------------------------------------------
     MATCH BY TITLE
  ----------------------------------------------- */

  const byTitle = courses.find(course => {

    return normalizeText(course.title) ===
      requested;

  });


  if (byTitle) {

    return byTitle;
  }


  /* -----------------------------------------------
     MATCH SLUG AGAINST TITLE
     Example:
     upsc-civil-services
     UPSC Civil Services
  ----------------------------------------------- */

  const byConvertedTitle =
    courses.find(course => {

      const title =
        normalizeText(course.title);

      return title === requested;

    });


  if (byConvertedTitle) {

    return byConvertedTitle;
  }


  /* -----------------------------------------------
     FLEXIBLE MATCH
  ----------------------------------------------- */

  const flexibleMatch =
    courses.find(course => {

      const title =
        normalizeText(course.title);

      const slug =
        normalizeText(course.slug);

      return (
        title.includes(requested) ||
        requested.includes(title) ||
        slug.includes(requested) ||
        requested.includes(slug)
      );

    });


  if (flexibleMatch) {

    return flexibleMatch;
  }


  return null;

}


/* -------------------------------------------------
   SHOW COURSE
------------------------------------------------- */

async function showCourse(course) {


  courseTitle.textContent =
    course.title || "Course";


  courseDesc.textContent =
    course.description || "";


  renderFee(course);


  /* -----------------------------------------------
     APPSC GROUP COURSE
  ----------------------------------------------- */

  const title =
    normalizeText(course.title);


  if (
    title.includes("appsc group 1")
  ) {

    renderSubjects();

    renderFAQs();

    return;
  }


  /* -----------------------------------------------
     NORMAL COURSE
  ----------------------------------------------- */

  renderBackButton();

  await loadLessons(course.id);

}


/* -------------------------------------------------
   COURSE FEE
------------------------------------------------- */

function renderFee(course) {


  const currentFee =
    course.current_fee;


  const originalFee =
    course.original_fee;


  if (
    currentFee === null ||
    currentFee === undefined ||
    currentFee === ""
  ) {

    feeArea.innerHTML = `
      <div class="fee-box">

        <div class="fee-label">
          Course Fee
        </div>

        <div class="no-fee">
          Fee will be announced soon.
        </div>

      </div>
    `;

    return;
  }


  feeArea.innerHTML = `

    <div class="fee-box">

      <div class="fee-label">
        Current Course Fee
      </div>

      <div class="current-fee">
        ${formatMoney(currentFee)}
      </div>

      ${
        originalFee
        ?
        `
        <div class="original-fee">
          ${formatMoney(originalFee)}
        </div>
        `
        :
        ""
      }

      <div class="course-status">
        Available for Enrollment
      </div>

    </div>

  `;

}


/* -------------------------------------------------
   RENDER APPSC SUBJECTS
------------------------------------------------- */

function renderSubjects() {


  subjectArea.innerHTML = `

    <h2 class="section-title">
      APPSC Group 1 Subjects
    </h2>

    <div class="course-grid">

      ${appscSubjects.map(subject => `

        <a
          class="course-card"
          href="student.html?course=${subject.keywords[0]}"
        >

          <h3>
            ${subject.title}
          </h3>

          <p class="muted">
            ${subject.description}
          </p>

        </a>

      `).join("")}

    </div>

  `;


  loadAvailableCourses();

}


/* -------------------------------------------------
   LOAD AVAILABLE COURSES
------------------------------------------------- */

async function loadAvailableCourses() {


  const result = await sb
    .from("courses")
    .select("*")
    .order("title");


  if (result.error) {

    console.error(result.error);

    return;
  }


  const courses =
    result.data || [];


  if (!courses.length) {

    return;
  }


  const currentCourseIds =
    courses.map(course =>
      String(course.id)
    );


  subjectArea.innerHTML += `

    <h2 class="section-title">
      Available Courses
    </h2>

    <div class="course-grid">

      ${courses.map(course => `

        <a
          class="course-card"
          href="student.html?course=${encodeURIComponent(
            course.slug || course.title
          )}"
        >

          <h3>
            ${course.title}
          </h3>

          <p class="muted">
            ${course.description || "Open course"}
          </p>

          ${
            course.current_fee
            ?
            `
            <p style="margin-top:12px">
              <strong>
                ${formatMoney(course.current_fee)}
              </strong>
            </p>
            `
            :
            ""
          }

        </a>

      `).join("")}

    </div>

  `;

}


/* -------------------------------------------------
   LOAD LESSONS
------------------------------------------------- */

async function loadLessons(courseId) {


  const result = await sb
    .from("lessons")
    .select("*")
    .eq("course_id", courseId)
    .eq("published", true)
    .order("sort_order");


  if (result.error) {

    lessonArea.innerHTML = `

      <div class="info-card">

        <h3>
          Unable to load lessons.
        </h3>

        <p class="muted">
          Please try again later.
        </p>

      </div>

    `;

    return;
  }


  const lessons =
    result.data || [];


  if (!lessons.length) {

    lessonArea.innerHTML = `

      <div class="info-card">

        <h3>
          No published lessons yet.
        </h3>

        <p class="muted">
          Lessons will appear here once they are published.
        </p>

      </div>

    `;

    return;
  }


  lessonArea.innerHTML = `

    <h2 class="section-title">
      Lessons
    </h2>

    <div class="list">

      ${lessons.map(lesson => `

        <div class="item">

          <h2>
            ${lesson.title}
          </h2>

          <p class="muted">
            ${lesson.description || ""}
          </p>

          ${
            lesson.video_url
            ?
            `
            <video
              controls
              style="width:100%;max-height:600px"
              src="${lesson.video_url}">
            </video>
            `
            :
            `
            <span class="status">
              Video pending
            </span>
            `
          }

          ${
            lesson.pdf_url
            ?
            `
            <p>

              <a
                class="btn alt"
                href="${lesson.pdf_url}"
                target="_blank"
              >
                Open Notes PDF
              </a>

            </p>
            `
            :
            ""
          }

        </div>

      `).join("")}

    </div>

  `;

}


/* -------------------------------------------------
   BACK BUTTON
------------------------------------------------- */

function renderBackButton() {

  backArea.innerHTML = `

    <a
      class="btn alt back-btn"
      href="index.html#courses"
    >
      Back to Courses
    </a>

  `;

}


/* -------------------------------------------------
   FAQ
------------------------------------------------- */

function renderFAQs() {

  faqArea.innerHTML = `

    <h2 class="section-title">
      Frequently Asked Questions
    </h2>

    <div class="info-card">

      <h3>
        How do I access a subject?
      </h3>

      <p class="muted">
        Select the required subject from the course page.
      </p>

    </div>


    <div class="info-card">

      <h3>
        Where will the lessons appear?
      </h3>

      <p class="muted">
        Published lessons, videos and PDF notes
        will appear inside the respective course.
      </p>

    </div>


    <div class="info-card">

      <h3>
        Where can I access the Test Series?
      </h3>

      <p class="muted">
        Open the Test Series section from the
        available courses.
      </p>

    </div>

  `;

}


/* -------------------------------------------------
   LOGOUT
------------------------------------------------- */

document.getElementById("logout").onclick =
  async function() {

    await sb.auth.signOut();

    location.href = "login.html";

  };


/* -------------------------------------------------
   START
------------------------------------------------- */

boot();

</script>

</body>
</html>
