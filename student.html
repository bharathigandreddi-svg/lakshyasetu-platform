<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Student | LakshyaSetu</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .page-header {
      padding: 30px 0 10px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      color: #10233f;
    }

    .course-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .badge {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 999px;
      background: #e8f6f5;
      color: #087477;
      font-size: 12px;
      font-weight: 700;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 20px;
    }

    .subject-card {
      display: block;
      background: #fff;
      border: 1px solid #e4e8ef;
      border-radius: 16px;
      padding: 22px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 5px 18px rgba(16,35,63,.05);
      transition: .2s;
    }

    .subject-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(16,35,63,.10);
    }

    .subject-number {
      color: #0f8b8d;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subject-card h3 {
      margin: 0 0 10px;
      color: #10233f;
      font-size: 19px;
    }

    .topic-list,
    .video-list {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .topic-card,
    .video-card {
      background: #fff;
      border: 1px solid #e4e8ef;
      border-radius: 14px;
      padding: 18px;
    }

    .topic-card h3,
    .video-card h3 {
      margin: 0 0 8px;
      color: #10233f;
    }

    .topic-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .topic-left {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .topic-number {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      background: #e8f6f5;
      color: #087477;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .trial-badge {
      display: inline-block;
      margin-left: 7px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff4d6;
      color: #8a5a00;
      font-size: 11px;
      font-weight: 700;
    }

    .empty-card {
      background: #fff;
      border: 1px dashed #cbd3df;
      border-radius: 14px;
      padding: 25px;
      text-align: center;
      margin-top: 18px;
    }

    .error-card {
      padding: 24px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #f1c4c4;
      color: #b42318;
      margin-top: 20px;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #667085;
    }

    .fee-card {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      background: #f7f9fc;
      border: 1px solid #dfe5ee;
    }

    .old-fee {
      text-decoration: line-through;
      color: #777;
      margin-right: 10px;
    }

    .current-fee {
      font-size: 26px;
      font-weight: 700;
      color: #10233f;
    }

    .section-title {
      margin-top: 30px;
      color: #10233f;
    }

    .video-card video {
      width: 100%;
      max-height: 560px;
      border-radius: 10px;
      background: #000;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      .subject-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .subject-grid {
        grid-template-columns: 1fr;
      }

      .topic-top {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header class="top">

  <div class="brand">
    LakshyaSetu
    <small>Student Dashboard</small>
  </div>

  <button id="logout" class="btn alt">
    Logout
  </button>

</header>


<main class="wrap">

  <section class="panel">

    <div id="backArea"></div>

    <div id="pageArea">

      <div class="loading">
        Loading...
      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const sb = window.supabase.createClient(
  LAKSHYASETU_CONFIG.supabaseUrl,
  LAKSHYASETU_CONFIG.supabasePublishableKey
);

const pageArea = document.getElementById("pageArea");
const backArea = document.getElementById("backArea");


function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function getParams() {

  const params =
    new URLSearchParams(window.location.search);

  return {
    course: params.get("course"),
    subject: params.get("subject"),
    topic: params.get("topic")
  };
}


async function checkLogin() {

  const { data } =
    await sb.auth.getUser();

  if (!data.user) {

    window.location.href = "login.html";

    return false;
  }

  return true;
}


async function getCourse(slug) {

  let query = sb
    .from("courses")
    .select("*")
    .eq("published", true);

  if (slug) {
    query = query.eq("slug", slug);
  }

  const { data, error } =
    await query.limit(1).single();

  if (error) {

    console.error("Course error:", error);

    return null;
  }

  return data;
}


async function getSubjects(courseId) {

  const { data, error } =
    await sb
      .from("course_subjects")
      .select(
        "id,course_id,title,sort_order,published"
      )
      .eq("course_id", courseId)
      .eq("published", true)
      .order("sort_order")
      .order("id");

  if (error) {

    console.error("Subject error:", error);

    return [];
  }

  return data || [];
}


async function getSubject(courseId, subjectId) {

  const { data, error } =
    await sb
      .from("course_subjects")
      .select(
        "id,course_id,title,sort_order,published"
      )
      .eq("id", subjectId)
      .eq("course_id", courseId)
      .eq("published", true)
      .single();

  if (error) {

    console.error("Subject error:", error);

    return null;
  }

  return data;
}


async function getTopics(subjectId) {

  const { data, error } =
    await sb
      .from("subject_topics")
      .select(
        "id,subject_id,title,slug,sort_order"
      )
      .eq("subject_id", subjectId)
      .order("sort_order")
      .order("id");

  if (error) {

    console.error("Topic error:", error);

    return [];
  }

  return data || [];
}


async function getVideos(topicIds) {

  if (!topicIds.length) {
    return [];
  }

  const { data, error } =
    await sb
      .from("topic_videos")
      .select(`
        id,
        topic_id,
        title,
        video_url,
        thumbnail_url,
        duration_seconds,
        sort_order,
        published,
        is_trial
      `)
      .in("topic_id", topicIds)
      .eq("published", true)
      .order("sort_order")
      .order("id");

  if (error) {

    console.error("Video error:", error);

    return [];
  }

  return data || [];
}


function formatDuration(seconds) {

  seconds = Number(seconds || 0);

  if (!seconds) {
    return "";
  }

  const minutes =
    Math.floor(seconds / 60);

  const remaining =
    seconds % 60;

  return (
    minutes +
    ":" +
    String(remaining).padStart(2, "0")
  );
}


function renderFee(course) {

  const current =
    Number(course.current_fee || 0);

  const original =
    Number(course.original_fee || 0);

  if (!current && !original) {
    return "";
  }

  if (
    original &&
    current &&
    original !== current
  ) {

    return `
      <div class="fee-card">

        <div>Course Fee</div>

        <div style="margin-top:6px">

          <span class="old-fee">
            ₹${original.toLocaleString("en-IN")}
          </span>

          <span class="current-fee">
            ₹${current.toLocaleString("en-IN")}
          </span>

        </div>

      </div>
    `;
  }

  return `
    <div class="fee-card">

      <div>Course Fee</div>

      <div class="current-fee">
        ₹${(current || original)
          .toLocaleString("en-IN")}
      </div>

    </div>
  `;
}


async function renderCourse(course) {

  backArea.innerHTML = "";

  const subjects =
    await getSubjects(course.id);

  pageArea.innerHTML = `

    <div class="page-header">

      <h1>
        ${escapeHtml(course.title)}
      </h1>

      <p class="muted">
        ${escapeHtml(course.description || "")}
      </p>

      <div class="course-meta">

        <span class="badge">
          ${subjects.length} Subjects
        </span>

        <span class="badge">
          Student Course
        </span>

      </div>

    </div>

    ${renderFee(course)}

    <h2 class="section-title">
      Course Subjects
    </h2>

    ${
      subjects.length
      ?
      `
        <div class="subject-grid">

          ${subjects.map((subject, index) => `

            <a
              class="subject-card"
              href="student.html?course=${encodeURIComponent(course.slug || "")}&subject=${subject.id}"
            >

              <div class="subject-number">
                Subject ${index + 1}
              </div>

              <h3>
                ${escapeHtml(subject.title)}
              </h3>

              <p class="muted">
                View topics and lessons
              </p>

              <span class="status">
                Open Subject
              </span>

            </a>

          `).join("")}

        </div>
      `
      :
      `
        <div class="empty-card">

          <h3>
            No subjects available
          </h3>

          <p class="muted">
            Subjects will appear here after publishing.
          </p>

        </div>
      `
    }

  `;
}


async function renderSubject(course, subject) {

  backArea.innerHTML = `

    <a
      class="btn alt"
      href="student.html?course=${encodeURIComponent(course.slug || "")}"
    >
      Back to Course
    </a>

  `;

  const topics =
    await getTopics(subject.id);

  const topicIds =
    topics.map(topic => topic.id);

  const videos =
    await getVideos(topicIds);

  const videoMap = {};

  videos.forEach(video => {

    if (!videoMap[video.topic_id]) {
      videoMap[video.topic_id] = [];
    }

    videoMap[video.topic_id].push(video);

  });


  pageArea.innerHTML = `

    <div class="page-header">

      <p class="muted">
        ${escapeHtml(course.title)}
      </p>

      <h1>
        ${escapeHtml(subject.title)}
      </h1>

      <div class="course-meta">

        <span class="badge">
          ${topics.length} Topics
        </span>

      </div>

    </div>


    <h2 class="section-title">
      Topics
    </h2>


    ${
      topics.length
      ?
      `
        <div class="topic-list">

          ${topics.map((topic, index) => {

            const topicVideos =
              videoMap[topic.id] || [];

            return `

              <div class="topic-card">

                <div class="topic-top">

                  <div class="topic-left">

                    <div class="topic-number">
                      ${index + 1}
                    </div>

                    <div>

                      <h3>
                        ${escapeHtml(topic.title)}
                      </h3>

                      <p class="muted">
                        ${topicVideos.length}
                        published video${topicVideos.length === 1 ? "" : "s"}
                      </p>

                    </div>

                  </div>

                  ${
                    topicVideos.length
                    ?
                    `
                      <span class="status">
                        Available
                      </span>
                    `
                    :
                    `
                      <span class="locked-badge">
                        Coming Soon
                      </span>
                    `
                  }

                </div>


                ${
                  topicVideos.length
                  ?
                  `
                    <div class="video-list">

                      ${topicVideos.map(video => `

                        <div class="video-card">

                          <h3>

                            ${escapeHtml(video.title)}

                            ${
                              video.is_trial
                              ?
                              `
                                <span class="trial-badge">
                                  Free Trial
                                </span>
                              `
                              :
                              ""
                            }

                          </h3>

                          ${
                            video.video_url
                            ?
                            `
                              <video
                                controls
                                preload="metadata"
                                ${
                                  video.thumbnail_url
                                  ?
                                  `poster="${escapeHtml(video.thumbnail_url)}"`
                                  :
                                  ""
                                }
                                src="${escapeHtml(video.video_url)}"
                              ></video>
                            `
                            :
                            `
                              <div class="empty-card">

                                <strong>
                                  Video URL not added yet
                                </strong>

                                <p class="muted">
                                  Video link will appear here after it is added.
                                </p>

                              </div>
                            `
                          }

                          ${
                            video.duration_seconds
                            ?
                            `
                              <p class="muted">
                                Duration:
                                ${formatDuration(video.duration_seconds)}
                              </p>
                            `
                            :
                            ""
                          }

                        </div>

                      `).join("")}

                    </div>
                  `
                  :
                  ""
                }

              </div>

            `;

          }).join("")}

        </div>
      `
      :
      `
        <div class="empty-card">

          <h3>
            No topics available yet
          </h3>

        </div>
      `
    }

  `;
}


async function renderTopic(course, subject, topicId) {

  backArea.innerHTML = `

    <a
      class="btn alt"
      href="student.html?course=${encodeURIComponent(course.slug || "")}&subject=${subject.id}"
    >
      Back to ${escapeHtml(subject.title)}
    </a>

  `;


  const { data: topic, error } =
    await sb
      .from("subject_topics")
      .select(
        "id,subject_id,title,slug,sort_order"
      )
      .eq("id", topicId)
      .eq("subject_id", subject.id)
      .single();


  if (error || !topic) {

    pageArea.innerHTML = `

      <div class="error-card">

        <h2>
          Topic not found
        </h2>

      </div>

    `;

    return;
  }


  const videos =
    await getVideos([topic.id]);


  pageArea.innerHTML = `

    <div class="page-header">

      <p class="muted">
        ${escapeHtml(subject.title)}
      </p>

      <h1>
        ${escapeHtml(topic.title)}
      </h1>

    </div>


    ${
      videos.length
      ?
      `
        <div class="video-list">

          ${videos.map(video => `

            <div class="video-card">

              <h3>

                ${escapeHtml(video.title)}

                ${
                  video.is_trial
                  ?
                  `
                    <span class="trial-badge">
                      Free Trial
                    </span>
                  `
                  :
                  ""
                }

              </h3>


              ${
                video.video_url
                ?
                `
                  <video
                    controls
                    preload="metadata"
                    ${
                      video.thumbnail_url
                      ?
                      `poster="${escapeHtml(video.thumbnail_url)}"`
                      :
                      ""
                    }
                    src="${escapeHtml(video.video_url)}"
                  ></video>
                `
                :
                `
                  <div class="empty-card">

                    <strong>
                      Video URL not added yet
                    </strong>

                  </div>
                `
              }


              ${
                video.duration_seconds
                ?
                `
                  <p class="muted">
                    Duration:
                    ${formatDuration(video.duration_seconds)}
                  </p>
                `
                :
                ""
              }

            </div>

          `).join("")}

        </div>
      `
      :
      `
        <div class="empty-card">

          <h3>
            No published videos yet
          </h3>

          <p class="muted">
            Videos will appear here after publishing.
          </p>

        </div>
      `
    }

  `;
}


async function boot() {

  try {

    const loggedIn =
      await checkLogin();

    if (!loggedIn) {
      return;
    }


    const params =
      getParams();


    const course =
      await getCourse(params.course);


    if (!course) {

      pageArea.innerHTML = `

        <div class="error-card">

          <h2>
            Course not found
          </h2>

          <p>
            Please check the course link.
          </p>

        </div>

      `;

      return;
    }


    if (!params.subject) {

      await renderCourse(course);

      return;
    }


    const subject =
      await getSubject(
        course.id,
        params.subject
      );


    if (!subject) {

      pageArea.innerHTML = `

        <div class="error-card">

          <h2>
            Subject not found
          </h2>

        </div>

      `;

      return;
    }


    if (params.topic) {

      await renderTopic(
        course,
        subject,
        params.topic
      );

      return;
    }


    await renderSubject(
      course,
      subject
    );

  }

  catch (error) {

    console.error(error);

    pageArea.innerHTML = `

      <div class="error-card">

        <h2>
          Something went wrong
        </h2>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }
}


document
  .getElementById("logout")
  .addEventListener(
    "click",
    async () => {

      await sb.auth.signOut();

      window.location.href =
        "login.html";

    }
  );


boot();

</script>

</body>
</html>
