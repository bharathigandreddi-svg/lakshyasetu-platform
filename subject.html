<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subject | LakshyaSetu</title><style>body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e5e9f0;padding:14px 20px}.brand{font-weight:900;color:#183b75;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:18px;margin-top:14px}.meta{color:#64748b;font-size:13px}.topic{padding:15px 0;border-bottom:1px solid #e5e9f0}.topic:last-child{border-bottom:0}.btn{display:inline-block;background:#173b67;color:#fff;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:800;font-size:13px;margin-top:8px}.back{color:#2457a6;font-weight:800;text-decoration:none}.empty{padding:16px;border:1px dashed #cbd5e1;color:#64748b;border-radius:10px}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu</a></header><main class="wrap"><div id="app">Loading…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909"></script><script>(async()=>{const db=getLakshyaSetuDb(),a=document.getElementById('app'),p=new URLSearchParams(location.search),course=Number(p.get('course')),map=Number(p.get('subject')),e=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));try{if(!course||!map)throw Error('Missing course or subject ID.');let [m,s,t]=await Promise.all([db.from('ls_course_subjects').select('id,course_id,subject_id').eq('id',map).eq('course_id',course).eq('published',true).eq('archived',false).single(),db.from('ls_subjects').select('id,title,description').eq('published',true).eq('archived',false),db.from('ls_topics').select('id,title,description,display_order').eq('course_subject_id',map).eq('published',true).eq('archived',false).order('display_order').order('id')]);if(m.error)throw m.error;if(s.error)throw s.error;if(t.error)throw t.error;let sub=(s.data||[]).find(x=>Number(x.id)===Number(m.data.subject_id));a.innerHTML='<a class="back" href="course.html?course='+course+'">← Course</a><h1>'+e(sub?.title||'Subject')+'</h1><p class="meta">'+e(sub?.description||'')+'</p><section class="card">'+((t.data||[]).length?(t.data||[]).map(x=>'<div class="topic"><h2>'+e(x.title)+'</h2><p class="meta">'+e(x.description||'')+'</p><a class="btn" href="lesson.html?course='+course+'&subject='+map+'&topic='+x.id+'">Open Topic →</a></div>').join(''):'<div class="empty">No published topics yet.</div>')+'</section>'}catch(x){a.innerHTML='<div class="card">Unable to load subject. '+e(x.message)+'</div>'}})();</script></body></html>
