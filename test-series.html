<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Series | LakshyaSetu</title><link rel="stylesheet" href="styles.css?v=21"><style>.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #dbe4ee;border-radius:15px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 7px;color:var(--navy)}.meta{color:#64748b;font-size:12px}.list{display:grid;gap:10px;margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid #e1e8f0;border-radius:11px;padding:13px;background:#fbfcfe}.row h3{font-size:15px;margin:0 0 3px}.btnx{display:inline-block;border:0;border-radius:8px;padding:9px 12px;background:#173b67;color:#fff;text-decoration:none;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.buy{background:#0f5fc4}.price{font-weight:900;color:#173b67}.back{display:inline-block;margin:18px 0 8px;color:var(--blue);font-weight:800;text-decoration:none}.empty{padding:14px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b;background:#f8fafc}.error{padding:13px;border-radius:10px;background:#fff0f0;border:1px solid #efc4c4;color:#9f2222}.stage{border-top:4px solid #173b67}.topic{padding:11px 0;border-bottom:1px solid #e7edf3}.topic:last-child{border-bottom:0}.topic h4{margin:0 0 6px;color:#173b67}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}</style></head><body><header class="top"><a class="brand" href="home.html"><small>LakshyaSetu</small></a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><div id="crumb"><a class="back" href="home.html">← Home</a></div><section class="catalog-hero"><span class="pill">MCQ TEST SERIES</span><h1 id="title">Test Series</h1><p id="sub">Loading…</p></section><div id="error"></div><div id="content"><div class="card">Loading…</div></div></main><footer class="footer">LakshyaSetu © 2026 · Civil Services Learning Platform</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909"></script><script src="payments-v2.js?v=11"></script><script>(async()=>{const db=getLakshyaSetuDb(),$=id=>document.getElementById(id),p=new URLSearchParams(location.search),examId=Number(p.get('exam')||0),seriesId=Number(p.get('series')||0),mapId=Number(p.get('subject')||0),topicId=Number(p.get('topic')||0);let courses=[],series=[],maps=[],subjects=[],topics=[],tests=[];const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const money=v=>Number(v||0)>0?'₹'+Number(v).toLocaleString('en-IN'):'Free';const url=o=>{const q=new URLSearchParams();Object.keys(o).forEach(k=>o[k]!==''&&o[k]!=null&&q.set(k,o[k]));return 'test-series.html?'+q};const go=(u,t)=>'<a class="btnx" href="'+u+'">'+t+'</a>';const fail=e=>{$('error').innerHTML='<div class="error">Unable to load test series: '+esc(e.message||e)+'</div>';$('content').innerHTML=''};function buySeries(id,name){if(window.LSBuy)window.LSBuy({product_type:'test_series',test_series_id:Number(id)},'LakshyaSetu - '+name);else alert('Payment module is loading. Please try again')}function course(){return courses.find(x=>Number(x.id)===examId)}function subName(id){let s=subjects.find(x=>Number(x.id)===Number(id));return s?s.title:'Subject '+id}function stageName(s){let z=String(s.series_type||'').toUpperCase();return z==='MAINS'?'Mains':z==='PRELIMS'?'Prelims':s.title}function testsFor(sid,mid,tid){return tests.filter(t=>Number(t.test_series_id)===Number(sid)&&(!mid||Number(t.course_subject_id)===Number(mid))&&(!tid||Number(t.topic_id)===Number(tid)))}function testRows(rows){return rows.length?rows.map(t=>'<div class="row"><div><h3>'+esc(t.title)+'</h3><div class="meta">'+Number(t.question_count||50)+' questions · '+Number(t.duration_minutes||30)+' min · <span class="price">'+money(t.price||2)+'</span></div></div>'+go('student-test.html?test='+encodeURIComponent(t.id),'Start Test →')+'</div>').join(''):'<div class="empty">No published tests here yet.</div>'}function renderHome(){ $('title').textContent='Test Series';$('sub').textContent='Choose your examination, then stage, subject, topic and test.';$('crumb').innerHTML='<a class="back" href="home.html">← Home</a>';$('content').innerHTML='<div class="grid">'+courses.map(c=>'<div class="card"><h2>'+esc(c.title)+'</h2><p class="meta">'+esc(c.description||'Syllabus-wise Test Series')+'</p><div class="actions">'+go(url({exam:c.id}),'Open Exam →')+'</div></div>').join('')+'</div><div class="card" style="margin-top:14px"><h2>Current Affairs</h2><p class="meta">Monthly Current Affairs tests are separate from static syllabus tests.</p>'+go('current-affairs-tests.html','Open Current Affairs →')+'</div>'}function renderExam(){let c=course(),ss=series.filter(s=>Number(s.course_id)===examId&&String(s.category||'').toLowerCase()!=='current_affairs');$('title').textContent=c.title;$('sub').textContent='Select the Test Series / stage.';$('crumb').innerHTML='<a class="back" href="test-series.html">← All Exams</a>';if(!ss.length){$('content').innerHTML='<div class="empty">No published Test Series for this examination yet.</div>';return}let g2=String(c.exam_code||'').toUpperCase().includes('GROUP_2');if(g2){let pre=ss.filter(s=>stageName(s)==='Prelims'),main=ss.filter(s=>stageName(s)==='Mains');$('content').innerHTML='<div class="grid"><div class="card stage"><h2>Prelims / Screening</h2><p class="meta">Syllabus-wise preliminary-stage tests.</p>'+seriesRows(pre)+'</div><div class="card stage"><h2>Mains</h2><p class="meta">Syllabus-wise mains-stage tests.</p>'+seriesRows(main)+'</div></div>'}else $('content').innerHTML='<div class="grid">'+ss.map(s=>'<div class="card"><h2>'+esc(s.title)+'</h2><p class="meta">'+esc(s.description||stageName(s))+' · '+money(s.price)+'</p><div class="actions"><button class="btnx buy" onclick="buySeries('+Number(s.id)+',\''+esc(s.title).replace(/'/g,"\\'")+'\')">Buy Series</button>'+go(url({exam:examId,series:s.id}),'Open Series →')+'</div></div>').join('')+'</div>'}function seriesRows(arr){return arr.length?'<div class="list">'+arr.map(s=>'<div class="row"><div><h3>'+esc(s.title)+'</h3><div class="meta">'+money(s.price)+' · '+(s.validity_days?Number(s.validity_days)+' days':'series access')+'</div></div>'+go(url({exam:examId,series:s.id}),'Open →')+'</div>').join('')+'</div>':'<div class="empty" style="margin-top:12px">No published series for this stage yet.</div>'}function renderSeries(){let s=series.find(x=>Number(x.id)===seriesId);if(!s){renderExam();return}$('title').textContent=s.title;$('sub').textContent='Subject → Topic → Test';$('crumb').innerHTML='<a class="back" href="'+url({exam:examId})+'">← Back</a>';let ms=maps.filter(m=>Number(m.course_id)===examId);$('content').innerHTML='<div class="card"><div class="row"><div><h2>'+esc(s.title)+'</h2><p class="meta">'+esc(s.description||'Syllabus-wise published tests')+' · <span class="price">'+money(s.price)+'</span></p></div><button class="btnx buy" onclick="buySeries('+Number(s.id)+',\''+esc(s.title).replace(/'/g,"\\'")+'\')">Buy Series</button></div><div class="grid" style="margin-top:14px">'+ms.map(m=>'<div class="card"><h3>'+esc(subName(m.subject_id))+'</h3><p class="meta">'+testsFor(seriesId,m.id).length+' published test(s)</p>'+go(url({exam:examId,series:seriesId,subject:m.id}),'Open Subject →')+'</div>').join('')+'</div></div>'}async function renderSubject(){let s=series.find(x=>Number(x.id)===seriesId),m=maps.find(x=>Number(x.id)===mapId&&Number(x.course_id)===examId);if(!s||!m){renderSeries();return}let r=await db.from('ls_topics').select('id,title,description,display_order').eq('course_subject_id',mapId).eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;topics=r.data||[];$('title').textContent=subName(m.subject_id);$('sub').textContent=s.title+' · Topics and tests';$('crumb').innerHTML='<a class="back" href="'+url({exam:examId,series:seriesId})+'">← Back</a>';let body=topics.map(t=>'<div class="topic"><h4>'+esc(t.title)+'</h4><div class="meta">'+testsFor(seriesId,mapId,t.id).length+' published test(s)</div><div class="actions">'+go(url({exam:examId,series:seriesId,subject:mapId,topic:t.id}),'View Tests →')+'</div></div>').join('');$('content').innerHTML='<div class="card"><h2>'+esc(subName(m.subject_id))+'</h2>'+(body||'<div class="empty">No published topics yet.</div>')+'</div>'}function renderTests(){let t=topics.find(x=>Number(x.id)===topicId),rows=testsFor(seriesId,mapId,topicId);$('title').textContent=t?t.title:'Published Tests';$('sub').textContent=series.find(x=>Number(x.id)===seriesId)?.title||'Test Series';$('crumb').innerHTML='<a class="back" href="'+url({exam:examId,series:seriesId,subject:mapId})+'">← Back</a>';$('content').innerHTML='<div class="card"><h2>'+esc(t?t.title:'Published Tests')+'</h2><p class="meta">'+rows.length+' published test(s)</p><div class="list">'+testRows(rows)+'</div></div>'}async function start(){let r=await Promise.all([db.from('ls_courses').select('*').eq('published',true).eq('archived',false).order('id'),db.from('ls_test_series').select('*').eq('published',true).eq('archived',false).order('id'),db.from('ls_course_subjects').select('id,course_id,subject_id').eq('published',true).eq('archived',false),db.from('ls_subjects').select('id,title').eq('published',true).eq('archived',false),db.from('ls_tests').select('id,title,question_count,duration_minutes,price,test_series_id,course_subject_id,topic_id,published,archived').eq('published',true).eq('archived',false).order('id')]);r.forEach(x=>{if(x.error)throw x.error});courses=r[0].data||[];series=r[1].data||[];maps=r[2].data||[];subjects=r[3].data||[];tests=r[4].data||[];if(!examId)return renderHome();if(!course()){ $('title').textContent='Examination not found';$('content').innerHTML='<div class="empty">Return to Test Series.</div>';return}if(!seriesId)return renderExam();if(!mapId)return renderSeries();if(!topicId)return renderSubject();renderTests()}start().catch(fail)})();</script></body></html>
