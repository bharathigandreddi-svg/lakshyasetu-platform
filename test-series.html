<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Series | LakshyaSetu</title><link rel="stylesheet" href="styles.css?v=16"><style>.subject-card .action-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}.subject-card .package-btn{background:#fff7df!important;color:#8a5400!important;border:2px solid #f5b82e!important;border-radius:999px;padding:10px 15px;box-shadow:0 3px 10px rgba(245,184,46,.18)}.subject-card .topic-btn{background:#eef4ff!important;color:#2457a6!important}.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stage-card{display:block;padding:22px;border:1px solid var(--border);border-radius:16px;background:#fff;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .15s ease,border-color .15s ease}.stage-card:hover{transform:translateY(-2px);border-color:#bfd0e8}.stage-icon{width:44px;height:44px;border-radius:12px;background:#eef4ff;color:var(--blue);display:grid;place-items:center;font-weight:950;margin-bottom:12px}.stage-card h3{margin:0 0 5px;color:var(--navy);font-size:19px}.stage-card p{margin:0 0 14px;color:var(--muted);font-size:13px}.stage-card strong{color:var(--blue);font-size:13px}.crumb{display:flex;gap:8px;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}.crumb a{color:var(--blue);font-weight:800;text-decoration:none}.error{margin:12px 0;padding:13px 15px;border-radius:11px;background:#fff0f0;border:1px solid #f1c4c4;color:#a42323;font-size:13px}.ca-series-card{border:2px solid #cbdcf2!important;background:linear-gradient(135deg,#fff,#f7faff)}.ca-series-card .ca-icon{background:#eef4ff;color:#2457a6}.ca-series-card .mini-btn{margin-top:12px;display:inline-block}@media(max-width:620px){.stage-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu<small>Learn. Prepare. Achieve.</small></a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><div class="crumb"><a href="home.html">Home</a><span>›</span><span>Test Series</span></div><section class="catalog-hero"><span class="pill" id="heroPill">MCQ TEST SERIES</span><h1 id="title">Test Series</h1><p id="subtitle">Loading the test-series catalog…</p></section><div id="error"></div><div id="content" class="loading">Loading…</div></main><footer class="footer">LakshyaSetu © 2026 · Civil Services Learning Platform</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260905-1100"></script><script>(function(){'use strict';const qs=new URLSearchParams(location.search),examId=Number(qs.get('exam')||0),subjectId=Number(qs.get('subject')||0),topicId=Number(qs.get('topic')||0),stageParam=qs.get('stage')||'';const db=getLakshyaSetuDb(),examToCourse={1:1,2:2,3:3};let subjects=[],topics=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m])),money=v=>Number(v||0)?'₹'+Number(v).toLocaleString('en-IN'):'Free',stage=()=>examId===3?(stageParam||'prelims'):'prelims',url=p=>'test-series.html?'+new URLSearchParams(p).toString();function hero(p,t,s){$('heroPill').textContent=p;$('title').textContent=t;$('subtitle').textContent=s}function shell(back,count){return '<div class="toolbar"><a class="back-link" href="'+esc(back)+'">← Back</a><span class="count">'+esc(count||'')+'</span></div>'}function fail(e){$('content').className='';$('content').innerHTML='';$('error').innerHTML='<div class="error">Unable to load the test series. '+esc(e?.message||String(e))+'</div>'}async function exams(){hero('MCQ TEST SERIES','Choose an examination','Select an examination to enter its own test-series catalog.');const r=await db.from('ls_courses').select('id,title,exam_code,description,course_fee,display_order').eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;$('content').className='grid';$('content').innerHTML=(r.data||[]).filter(e=>examToCourse[e.id]).map(e=>'<article class="card subject-card"><span class="pill">EXAMINATION</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.description||'Subject tests, topic tests and mock tests.')+'</p><div class="stat-line"><span class="stat"><b>Complete series</b></span><span class="stat">'+money(e.course_fee)+'</span></div><div class="action-row"><a class="buy-btn secondary" href="'+esc(url({exam:e.id}))+'">Open catalog →</a></div></article>').join('')||'<div class="empty">No published examinations are available.</div>';$('content').innerHTML+='<article class="card subject-card ca-series-card"><span class="pill">CURRENT AFFAIRS</span><h3>Current Affairs Test Series</h3><p>Dedicated MCQ practice from current developments. Reading and test practice stay separate.</p><div class="stat-line"><span class="stat"><b>Monthly</b> · 6 × 50 MCQs</span><span class="stat">₹2 / test</span></div><a class="mini-btn" href="current-affairs-tests.html?v=20260905-1100">View Test Series →</a></article>'}async function stagePage(){hero('APPSC GROUP 2 · MCQ','APPSC Group 2','Choose Prelims or Mains first. Tests remain inside the selected stage.');$('content').className='';$('content').innerHTML=shell('test-series.html','')+'<div class="level-note">Group 2 has separate Prelims and Mains tracks.</div><div class="stage-grid"><a class="stage-card" href="'+url({exam:3,stage:'prelims'})+'"><div class="stage-icon">P</div><h3>Prelims</h3><p>Screening test · subjects → topics → tests</p><strong>Open Prelims →</strong></a><a class="stage-card" href="'+url({exam:3,stage:'mains'})+'"><div class="stage-icon">M</div><h3>Mains</h3><p>Objective/MCQ papers · subjects → topics → tests</p><strong>Open Mains →</strong></a></div>'}async function subjectsPage(){const st=stage();const name=examId===1?'UPSC Civil Services Prelims':examId===2?'APPSC Group 1 Prelims':'APPSC Group 2 '+(st==='mains'?'Mains':'Prelims');hero(examId===3?'GROUP 2 · '+st.toUpperCase()+' · MCQ':'MCQ TEST SERIES',name,st==='mains'?'Objective/MCQ mains subjects. Open a subject to see topics and tests.':'Open a subject to see its topics and individual tests.');const r=await db.from('ls_course_subjects').select('id,subject_id,subject_fee,display_order,published,archived,ls_subjects(id,title,slug,description,published,archived)').eq('course_id',examToCourse[examId]).eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;subjects=(r.data||[]).filter(x=>x.ls_subjects&&x.ls_subjects.published&&!x.ls_subjects.archived).filter(x=>st==='mains'?String(x.ls_subjects.slug||'').startsWith('group2-mains-'):String(x.ls_subjects.slug||'').startsWith('prelims-')||(examId===1&&x.ls_subjects.slug==='upsc-csat'));const tr=await db.from('ls_tests').select('id,course_subject_id').eq('published',true).eq('archived',false);if(tr.error)throw tr.error;const counts={};(tr.data||[]).forEach(t=>counts[t.course_subject_id]=(counts[t.course_subject_id]||0)+1);$('content').className='';$('content').innerHTML=shell(examId===3?url({exam:3}):'test-series.html',subjects.length+' subjects')+'<div class="level-note">Only subjects belonging to this examination'+(examId===3?' and selected stage':'')+' are shown here. Tests are not mixed between exams.</div><div class="grid">'+(subjects.map(s=>{const fee=Number(s.subject_fee||99);return '<article class="card subject-card"><span class="pill">'+(st==='mains'?'MAINS SUBJECT':'PRELIMS SUBJECT')+'</span><h3>'+esc(s.ls_subjects.title)+'</h3><p>'+esc(s.ls_subjects.description||'MCQ practice.')+'</p><div class="stat-line"><span class="stat"><b>'+Number(counts[s.id]||0)+'</b> published tests</span><span class="stat">'+money(fee)+' package</span></div><div class="action-row"><button type="button" class="buy-btn package-btn" data-subject-buy="'+s.id+'" data-fee="'+fee+'">BUY · '+money(fee)+' PACKAGE</button><a class="buy-btn secondary topic-btn" href="'+esc(url({exam:examId,...(examId===3?{stage:st}:{}),subject:s.id}))+'">VIEW TOPIC →</a></div></article>'}).join('')||'<div class="loading">No subjects are published in this track yet.</div>')+'</div>';bindBuys()}function bindBuys(){document.querySelectorAll('[data-subject-buy]').forEach(b=>{b.onclick=async()=>{const s=await db.auth.getSession();if(!s.data?.session){location.href='login.html?next='+encodeURIComponent(location.href);return}try{const r=await fetch(window.LAKSHYASETU_CONFIG.supabaseUrl+'/functions/v1/create-razorpay-order',{method:'POST',headers:{Authorization:'Bearer '+s.data.session.access_token,apikey:window.LAKSHYASETU_CONFIG.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({product_type:'subject',course_subject_id:Number(b.dataset.subjectBuy)})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Unable to create payment order.');if(!window.Razorpay){await new Promise((res,rej)=>{const x=document.createElement('script');x.src='https://checkout.razorpay.com/v1/checkout.js';x.onload=res;x.onerror=()=>rej(new Error('Payment gateway failed to load.'));document.head.appendChild(x)})}new Razorpay({key:d.key_id,amount:d.order.amount,currency:d.order.currency||'INR',name:'LakshyaSetu',description:'LakshyaSetu Subject Package',order_id:d.order.id,handler:async p=>{const v=await fetch(window.LAKSHYASETU_CONFIG.supabaseUrl+'/functions/v1/verify-razorpay-payment',{method:'POST',headers:{Authorization:'Bearer '+s.data.session.access_token,apikey:window.LAKSHYASETU_CONFIG.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({product_type:'subject',course_subject_id:Number(b.dataset.subjectBuy),amount:d.amount,razorpay_order_id:p.razorpay_order_id,razorpay_payment_id:p.razorpay_payment_id,razorpay_signature:p.razorpay_signature})});const z=await v.json();if(!v.ok||!z.success)throw new Error(z.error||'Payment verification failed.');alert('Payment successful. Access activated.');location.reload()}}).open()}catch(e){alert(e.message||'Payment failed.')}}})}async function topicsPage(){const s=subjects.find(x=>x.id===subjectId);if(!s){location.replace(url({exam:examId,...(examId===3?{stage:stage()}: {})}));return}hero(examId===3?'GROUP 2 · '+stage().toUpperCase()+' · MCQ':'MCQ TEST SERIES',s.ls_subjects.title,'Topics inside '+s.ls_subjects.title+'.');const r=await db.from('ls_topics').select('*').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;topics=r.data||[];const tr=await db.from('ls_tests').select('id,topic_id').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false);if(tr.error)throw tr.error;const counts={};(tr.data||[]).forEach(t=>counts[t.topic_id]=(counts[t.topic_id]||0)+1);$('content').className='';$('content').innerHTML=shell(url({exam:examId,...(examId===3?{stage:stage()}: {})}),topics.length+' topics')+'<div class="level-note">Open a topic to see only the tests belonging to that topic.</div><div class="grid">'+(topics.map(t=>'<article class="card topic-card"><span class="pill">TOPIC</span><h3>'+esc(t.title)+'</h3><p>'+esc(t.description||'Topic-focused MCQ practice.')+'</p><div class="stat-line"><span class="stat"><b>'+Number(counts[t.id]||0)+'</b> published tests</span></div><div class="action-row"><a class="buy-btn secondary" href="'+esc(url({exam:examId,...(examId===3?{stage:stage()}: {}),subject:subjectId,topic:t.id}))+'">VIEW TESTS →</a></div></article>').join('')||'<div class="loading">No topics are published yet.</div>')+'</div>'}async function testsPage(){const t=topics.find(x=>x.id===topicId);if(!t){location.replace(url({exam:examId,...(examId===3?{stage:stage()}: {}),subject:subjectId}));return}hero(examId===3?'GROUP 2 · '+stage().toUpperCase()+' · MCQ':'MCQ TEST SERIES',t.title,'Individual MCQ tests for this topic.');const r=await db.from('ls_tests').select('*').eq('topic_id',topicId).eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('id');if(r.error)throw r.error;$('content').className='';$('content').innerHTML=shell(url({exam:examId,...(examId===3?{stage:stage()}: {}),subject:subjectId}),(r.data||[]).length+' tests')+'<div class="level-note">Each published test is an individual purchase.</div><div class="grid">'+((r.data||[]).map(x=>'<article class="card test-card"><span class="pill">'+esc(x.test_type||'TOPIC TEST')+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||'50-question topic-focused MCQ test.')+'</p><div class="stat-line"><span class="stat"><b>'+Number(x.question_count||50)+'</b> questions</span><span class="stat"><b>'+money(x.price||2)+'</b></span></div><div class="action-row"><a class="buy-btn" href="login.html?next='+encodeURIComponent('student-v2.html?test='+x.id+'&action=buy')+'">BUY '+money(x.price||2)+'</a><a class="buy-btn secondary" href="student-v2.html?test='+encodeURIComponent(x.id)+'">VIEW TEST →</a></div></article>').join('')||'<div class="loading">No published tests in this topic yet.</div>')+'</div>'}async function start(){if(!examId)return exams();if(!examToCourse[examId])return location.replace('test-series.html');if(examId===3&&!stageParam&&!subjectId&&!topicId)return stagePage();await subjectsPage();if(subjectId&&!topicId)return topicsPage();if(subjectId&&topicId){await topicsPage();await testsPage()}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>start().catch(fail),{once:true});else start().catch(fail)})();</script></body></html>
