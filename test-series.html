<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Series | LakshyaSetu</title><link rel="stylesheet" href="styles.css?v=20"><style>.catalog{display:grid;gap:16px}.catalog-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.catalog-card h2,.catalog-card h3{margin:0 0 6px;color:var(--navy)}.test-list{display:grid;gap:9px;margin-top:12px}.test-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e1e8f0;border-radius:11px;padding:12px;background:#fbfcfe}.test-item h4{margin:0 0 3px;color:#173b67;font-size:14px}.test-item p{margin:0;color:#64748b;font-size:11px}.btn-open{display:inline-block;white-space:nowrap;text-decoration:none;background:#173b67;color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800}.back{display:inline-block;margin:18px 0 8px;color:var(--blue);font-weight:800;text-decoration:none}.error{margin:12px 0;padding:13px;border-radius:10px;background:#fff0f0;border:1px solid #efc4c4;color:#9f2222}.empty{padding:14px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b}.meta{color:#64748b;font-size:12px}@media(max-width:650px){.test-item{align-items:flex-start;flex-direction:column}.btn-open{align-self:flex-end}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu<small>Learn. Prepare. Achieve.</small></a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><div id="crumb"><a class="back" href="home.html">← Home</a></div><section class="catalog-hero"><span class="pill">MCQ TEST SERIES</span><h1 id="title">Test Series</h1><p id="subtitle">Loading…</p></section><div id="error"></div><div id="content" class="catalog"><div class="loading">Loading…</div></div></main><footer class="footer">LakshyaSetu © 2026 · Civil Services Learning Platform</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260908-series6"></script><script>(function(){'use strict';var $=function(id){return document.getElementById(id)},p=new URLSearchParams(location.search),examId=Number(p.get('exam')||0),subjectId=Number(p.get('subject')||0),topicId=Number(p.get('topic')||0),stage=p.get('stage')||'',db=getLakshyaSetuDb(),courses=[],maps=[],subjects=[],tests=[];var esc=function(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]})};var money=function(v){return Number(v||0)>0?'₹'+Number(v).toLocaleString('en-IN'):'Free'};var link=function(o){var u=new URLSearchParams();Object.keys(o).forEach(function(k){if(o[k]!==''&&o[k]!=null)u.set(k,o[k])});return 'test-series.html?'+u.toString()};function fail(e){$('error').innerHTML='<div class="error">Unable to load the catalog: '+esc(e&&e.message||e)+'</div>';$('content').innerHTML=''}function hero(t,s){$('title').textContent=t;$('subtitle').textContent=s}function subjectName(id){var s=subjects.find(function(x){return Number(x.id)===Number(id)});return s?s.title:'Subject '+id}function examMaps(){return maps.filter(function(m){return Number(m.course_id)===examId})}function examTests(){var ids=examMaps().map(function(m){return Number(m.id)});return tests.filter(function(t){return ids.indexOf(Number(t.course_subject_id))!==-1})}function renderExamHome(){hero('Test Series','Choose an examination.');var h='<div class="catalog-card"><div class="test-list">';courses.forEach(function(c){h+='<div class="test-item"><div><h3>'+esc(c.title)+'</h3><p>'+esc(c.description||'Subjects → Topics → Tests')+'</p></div><a class="btn-open" href="'+link({exam:c.id})+'">Open Exam →</a></div>'});h+='</div></div><div class="catalog-card"><h3>Current Affairs Test Series</h3><p class="meta">Monthly current-affairs MCQ practice.</p><a class="btn-open" href="current-affairs-tests.html">View Current Affairs →</a></div>';$('content').innerHTML=h}function renderTests(){var rows=examTests();if(subjectId)rows=rows.filter(function(t){return Number(t.course_subject_id)===subjectId});if(topicId)rows=rows.filter(function(t){return Number(t.topic_id)===topicId});hero('Tests',rows.length+' published test'+(rows.length===1?'':'s')+' available.');$('crumb').innerHTML='<a class="back" href="'+link({exam:examId,stage:stage,subject:subjectId})+'">← Back</a>';var h='<div class="catalog-card"><div class="test-list">';h+=rows.length?rows.map(function(t){return '<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+Number(t.question_count||50)+' questions · '+Number(t.duration_minutes||30)+' min · '+money(t.price||2)+'</p></div><a class="btn-open" href="student-v2.html?test='+encodeURIComponent(t.id)+'">Open Test</a></div>'}).join(''):'<div class="empty">No published tests are available here yet.</div>';h+='</div></div>';$('content').innerHTML=h}async function renderSubject(){var m=maps.find(function(x){return Number(x.id)===subjectId&&Number(x.course_id)===examId});if(!m){renderTests();return}var r=await db.from('ls_topics').select('id,title,description,display_order').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;hero(subjectName(m.subject_id),'Topics → Tests.');$('crumb').innerHTML='<a class="back" href="'+link({exam:examId,stage:stage})+'">← Back</a>';var h='<div class="catalog-card"><h2>'+esc(subjectName(m.subject_id))+'</h2><div class="test-list">';var topics=(r.data||[]).filter(function(t){return tests.some(function(x){return Number(x.course_subject_id)===subjectId&&Number(x.topic_id)===Number(t.id)})});h+=topics.map(function(t){var n=tests.filter(function(x){return Number(x.course_subject_id)===subjectId&&Number(x.topic_id)===Number(t.id)}).length;return '<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+n+' published test'+(n===1?'':'s')+'</p></div><a class="btn-open" href="'+link({exam:examId,stage:stage,subject:subjectId,topic:t.id})+'">View Tests →</a></div>'}).join('')||'<div class="empty">No published tests in this subject yet.</div>';h+='</div></div>';$('content').innerHTML=h}async function renderSubjects(){var rows=examMaps().map(function(m){var n=tests.filter(function(t){return Number(t.course_subject_id)===Number(m.id)}).length;return {m:m,n:n}}).filter(function(x){return x.n>0});var c=courses.find(function(x){return Number(x.id)===examId});hero(c?c.title:'Test Series','Select a subject to continue to its topics and tests.');$('crumb').innerHTML='<a class="back" href="test-series.html">← All Exams</a>';var h='<div class="catalog-card"><h2>Subjects</h2><p class="meta">Only subjects with published tests are shown.</p><div class="test-list">';h+=rows.map(function(x){return '<div class="test-item"><div><h3>'+esc(subjectName(x.m.subject_id))+'</h3><p>'+x.n+' published test'+(x.n===1?'':'s')+'</p></div><a class="btn-open" href="'+link({exam:examId,stage:stage,subject:x.m.id})+'">Open Subject →</a></div>'}).join('')||'<div class="empty">No published subjects are available for this examination yet.</div>';h+='</div></div>';$('content').innerHTML=h}async function start(){var a=await Promise.all([db.from('ls_courses').select('id,title,description').eq('published',true).eq('archived',false).order('id'),db.from('ls_course_subjects').select('id,course_id,subject_id').eq('published',true).eq('archived',false),db.from('ls_subjects').select('id,title').eq('published',true).eq('archived',false),db.from('ls_tests').select('id,title,description,question_count,duration_minutes,price,test_type,course_subject_id,topic_id,published,archived').eq('published',true).eq('archived',false).order('id')]);a.forEach(function(x){if(x.error)throw x.error});courses=a[0].data||[];maps=a[1].data||[];subjects=a[2].data||[];tests=a[3].data||[];if(!examId)return renderExamHome();var c=courses.find(function(x){return Number(x.id)===examId});if(!c){hero('Examination not found','Please return to Test Series.');$('content').innerHTML='<div class="empty"><a href="test-series.html">Back to Test Series</a></div>';return}if(subjectId){if(topicId)renderTests();else await renderSubject();return}await renderSubjects()}start().catch(fail)})();</script></body></html>
