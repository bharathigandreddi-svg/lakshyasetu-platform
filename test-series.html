<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Series | LakshyaSetu</title>
<link rel="stylesheet" href="styles.css">
<style>
.crumb{display:flex;gap:8px;align-items:center;margin:22px 0 8px;color:var(--muted);font-size:13px}.crumb a{color:var(--blue);text-decoration:none;font-weight:800}
.catalog-hero{margin:12px 0 22px;padding:28px;border-radius:18px;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow)}
.catalog-hero h1{margin:0;color:var(--navy);font-size:30px}.catalog-hero p{margin:7px 0 0;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:18px 0}.count{font-size:13px;color:var(--muted)}
.back-link{color:var(--blue);font-weight:900;text-decoration:none;font-size:13px}.hide{display:none!important}
.level-note{margin:14px 0;padding:12px 14px;background:#f7faff;border:1px solid #dbe7f7;border-radius:11px;color:#52647c;font-size:13px}
.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px}
.stage-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--border);border-radius:15px;padding:22px;box-shadow:var(--shadow);transition:.15s ease}.stage-card:hover{transform:translateY(-2px);border-color:#bfd3f2}
.stage-icon{width:44px;height:44px;border-radius:12px;background:#eef4ff;color:var(--blue);display:grid;place-items:center;font-weight:900;margin-bottom:13px}.stage-card h3{margin:0;color:var(--navy)}.stage-card p{margin:6px 0;color:var(--muted);font-size:13px}.stage-card strong{display:block;margin-top:14px;color:var(--blue);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:var(--shadow)}
.subject-card,.topic-card,.test-card{display:flex;flex-direction:column;min-height:180px}.topic-card,.test-card{min-height:165px}.pill{display:inline-flex;align-self:flex-start}.subject-card h3,.topic-card h3,.test-card h3{font-size:16px}.subject-card p,.topic-card p,.test-card p{color:var(--muted);font-size:13px;line-height:1.45}
.stat-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}.stat{font-size:12px;color:var(--muted);background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:4px 8px}.stat b{color:var(--navy)}
.action-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}.buy-btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:9px 13px;background:var(--blue);color:#fff;text-decoration:none;font-size:12px;font-weight:900;cursor:pointer}.buy-btn.secondary{background:#eef4ff;color:var(--blue)}
.exam-price{font-size:13px;font-weight:900;color:var(--blue)}.subtle{font-size:12px;color:var(--muted)}
.loading{padding:24px;background:#fff;border:1px solid var(--border);border-radius:15px;color:var(--muted)}
.error{margin:14px 0;padding:14px;border-radius:12px;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.stage-grid,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="home.html">LakshyaSetu<small>Learn. Prepare. Achieve.</small></a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="login.html">Student Login</a></nav></header>
<main class="wrap">
<div class="crumb"><a href="home.html">Home</a><span>›</span><span>Test Series</span></div>
<section class="catalog-hero"><span class="pill" id="heroPill">MCQ TEST SERIES</span><h1 id="title">Test Series</h1><p id="subtitle">Loading the test-series catalog…</p></section>
<div id="error"></div>
<div id="content" class="loading">Loading…</div>
</main>
<footer class="footer">LakshyaSetu © 2026 · Civil Services Learning Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
const qs=new URLSearchParams(location.search);
const examId=Number(qs.get('exam')||0),subjectId=Number(qs.get('subject')||0),topicId=Number(qs.get('topic')||0),stageParam=qs.get('stage')||'';
const db=getLakshyaSetuDb();
const examToCourse={1:1,2:2,3:3};
let exam=null,subjects=[],topics=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
const money=v=>Number(v||0)?'₹'+Number(v).toLocaleString('en-IN'):'Free';
const stage=()=>examId===3?(stageParam||'prelims'):'prelims';
const url=(parts)=>'test-series.html?'+new URLSearchParams(parts).toString();
function setHero(pill,title,subtitle){$('heroPill').textContent=pill;$('title').textContent=title;$('subtitle').textContent=subtitle;}
function fail(e){$('content').className='';$('content').innerHTML='';$('error').innerHTML='<div class="error">Unable to load the test series. '+esc(e?.message||String(e))+'</div>';}
function shell(back,count){return '<div class="toolbar"><a class="back-link" href="'+esc(back)+'">← Back</a><span class="count">'+esc(count||'')+'</span></div>';}
async function loadExams(){
 setHero('MCQ TEST SERIES','Choose an examination','Select an examination to enter its own test-series catalog.');
 const r=await db.from('ls_exam_catalog').select('*').eq('active',true).order('display_order');if(r.error)throw r.error;
 const rows=r.data||[];
 $('content').className='grid';
 $('content').innerHTML=rows.map(e=>{const price=Number(e.bundle_price||0);return '<article class="card subject-card"><span class="pill">EXAMINATION</span><h3>'+esc(e.name)+'</h3><p>'+esc(e.description||'Subject tests, topic tests and mock tests.')+'</p><div class="stat-line"><span class="stat"><b>Complete series</b></span><span class="stat">₹'+price.toLocaleString('en-IN')+'</span></div><div class="action-row"><a class="buy-btn secondary" href="'+esc(url({exam:e.id}))+'">Open catalog →</a></div></article>'}).join('')||'<div class="loading">No examinations are active yet.</div>';
}
async function loadStage(){
 setHero('APPSC GROUP 2 · MCQ','APPSC Group 2','Choose Prelims or Mains first. Tests remain inside the selected stage.');
 $('content').className='';$('content').innerHTML=shell('test-series.html','')+'<div class="level-note">Group 2 has separate Prelims and Mains tracks. Select one to continue.</div><div class="stage-grid"><a class="stage-card" href="'+url({exam:3,stage:'prelims'})+'"><div class="stage-icon">P</div><h3>Prelims</h3><p>Screening test · subjects → topics → individual tests</p><strong>Open Prelims →</strong></a><a class="stage-card" href="'+url({exam:3,stage:'mains'})+'"><div class="stage-icon">M</div><h3>Mains</h3><p>Objective/MCQ papers · subjects → topics → individual tests</p><strong>Open Mains →</strong></a></div>';
}
async function loadSubjects(){
 const er=await db.from('ls_exam_catalog').select('*').eq('id',examId).single();if(er.error)throw er.error;exam=er.data;
 const st=stage();const name=examId===1?'UPSC Civil Services Prelims':examId===2?'APPSC Group 1':'APPSC Group 2 '+(st==='mains'?'Mains':'Prelims');
 setHero(examId===3?'GROUP 2 · '+st.toUpperCase()+' · MCQ':'MCQ TEST SERIES',name,st==='mains'?'Objective/MCQ mains subjects. Open a subject to see its topics and tests.':'Open a subject to see its topics and individual tests.');
 const r=await db.from('ls_course_subjects').select('id,subject_id,subject_fee,display_order,published,archived,ls_subjects(id,title,slug,description,published,archived)').eq('course_id',examToCourse[examId]).eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;
 subjects=(r.data||[]).filter(x=>x.ls_subjects&&x.ls_subjects.published&&!x.ls_subjects.archived).filter(x=>st==='mains'?String(x.ls_subjects.slug||'').startsWith('group2-mains-'):String(x.ls_subjects.slug||'').startsWith('prelims-')||(examId===1&&x.ls_subjects.slug==='upsc-csat'));
 const tests=await db.from('ls_tests').select('id,course_subject_id,topic_id,question_count,price,published,archived').eq('published',true).eq('archived',false);if(tests.error)throw tests.error;
 const counts={};(tests.data||[]).forEach(t=>counts[t.course_subject_id]=(counts[t.course_subject_id]||0)+1);
 $('content').className='';$('content').innerHTML=shell(examId===3?url({exam:3}):'test-series.html',subjects.length+' subjects')+'<div class="level-note">Only subjects belonging to this examination'+(examId===3?' and selected stage':'')+' are shown here. Tests are not mixed between exams.</div><div class="grid">'+(subjects.map(s=>'<article class="card subject-card"><span class="pill">'+(st==='mains'?'MAINS SUBJECT':'PRELIMS SUBJECT')+'</span><h3>'+esc(s.ls_subjects.title)+'</h3><p>'+esc(s.ls_subjects.description||'MCQ practice.')+'</p><div class="stat-line"><span class="stat"><b>'+Number(counts[s.id]||0)+'</b> published tests</span><span class="stat">₹'+Number(s.subject_fee||99).toFixed(0)+' package</span></div><div class="action-row"><a class="buy-btn" href="'+esc(url({exam:examId,...(examId===3?{stage:st}:{}),subject:s.id}))+'">View subject →</a></div></article>').join('')||'<div class="loading">No subjects are published in this track yet.</div>')+'</div>';
}
async function loadTopics(){
 const s=subjects.find(x=>x.id===subjectId);if(!s){location.replace(url({exam:examId,...(examId===3?{stage:stage()}: {})}));return;}
 setHero(examId===3?'GROUP 2 · '+stage().toUpperCase()+' · MCQ':'MCQ TEST SERIES',s.ls_subjects.title,'Topics inside '+s.ls_subjects.title+'.');
 const r=await db.from('ls_topics').select('*').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;topics=r.data||[];
 const tr=await db.from('ls_tests').select('id,topic_id,question_count,price,published,archived').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false);if(tr.error)throw tr.error;const counts={};(tr.data||[]).forEach(t=>counts[t.topic_id]=(counts[t.topic_id]||0)+1);
 $('content').className='';$('content').innerHTML=shell(url({exam:examId,...(examId===3?{stage:stage()}: {})}),topics.length+' topics')+'<div class="level-note">Open a topic to see only the tests belonging to that topic.</div><div class="grid">'+(topics.map(t=>'<article class="card topic-card"><span class="pill">TOPIC</span><h3>'+esc(t.title)+'</h3><p>'+esc(t.description||'Topic-focused MCQ practice.')+'</p><div class="stat-line"><span class="stat"><b>'+Number(counts[t.id]||0)+'</b> published tests</span></div><div class="action-row"><span class="subtle">50 Q · ₹2 / test</span><a class="buy-btn secondary" href="'+esc(url({exam:examId,...(examId===3?{stage:stage()}: {}),subject:subjectId,topic:t.id}))+'">View tests →</a></div></article>').join('')||'<div class="loading">No topics are published yet.</div>')+'</div>';
}
async function loadTests(){
 const t=topics.find(x=>x.id===topicId);if(!t){location.replace(url({exam:examId,...(examId===3?{stage:stage()}: {}),subject:subjectId}));return;}
 setHero(examId===3?'GROUP 2 · '+stage().toUpperCase()+' · MCQ':'MCQ TEST SERIES',t.title,'Individual MCQ tests for this topic.');
 const r=await db.from('ls_tests').select('*').eq('topic_id',topicId).eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('id');if(r.error)throw r.error;
 $('content').className='';$('content').innerHTML=shell(url({exam:examId,...(examId===3?{stage:stage()}: {}),subject:subjectId}), (r.data||[]).length+' tests')+'<div class="level-note">Each published test is an individual purchase. The question count and price shown below come from the test record.</div><div class="grid">'+((r.data||[]).map(x=>'<article class="card test-card"><span class="pill">'+esc(x.test_type||'TOPIC TEST')+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||'50-question topic-focused MCQ test.')+'</p><div class="stat-line"><span class="stat"><b>'+Number(x.question_count||50)+'</b> questions</span><span class="stat"><b>'+money(x.price||2)+'</b></span></div><div class="action-row"><a class="buy-btn" href="login.html?next='+encodeURIComponent('student-v2.html?test='+x.id+'&action=buy')+'">Buy '+money(x.price||2)+'</a><a class="buy-btn secondary" href="student-v2.html?test='+encodeURIComponent(x.id)+'">View test →</a></div></article>').join('')||'<div class="loading">No published tests in this topic yet.</div>')+'</div>';
}
async function start(){
 if(!examId)return loadExams();
 if(!examToCourse[examId]){location.replace('test-series.html');return;}
 if(examId===3&&!stageParam&&!subjectId&&!topicId)return loadStage();
 await loadSubjects();
 if(subjectId&&!topicId)return loadTopics();
 if(subjectId&&topicId){await loadTopics();await loadTests();return;}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>start().catch(fail),{once:true});else start().catch(fail);
})();
</script>
</body>
</html>
