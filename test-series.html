<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Series | LakshyaSetu</title><link rel="stylesheet" href="styles.css?v=18"><style>.catalog{display:grid;gap:16px}.catalog-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.catalog-card h2,.catalog-card h3{margin:0 0 6px;color:var(--navy)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.meta span{background:#f3f6fa;border-radius:999px;padding:5px 9px;font-size:11px;color:#526173}.test-list{display:grid;gap:9px;margin-top:12px}.test-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e1e8f0;border-radius:11px;padding:12px;background:#fbfcfe}.test-item h4{margin:0 0 3px;color:#173b67;font-size:14px}.test-item p{margin:0;color:#64748b;font-size:11px}.btn-open{display:inline-block;white-space:nowrap;text-decoration:none;background:#173b67;color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800}.back{display:inline-block;margin:18px 0 8px;color:var(--blue);font-weight:800;text-decoration:none}.error{margin:12px 0;padding:13px;border-radius:10px;background:#fff0f0;border:1px solid #efc4c4;color:#9f2222}.loading{padding:16px}.empty{padding:14px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b}.ca{border:2px solid #cbdcf2}@media(max-width:650px){.test-item{align-items:flex-start;flex-direction:column}.btn-open{align-self:flex-end}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu<small>Learn. Prepare. Achieve.</small></a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><div id="crumb"><a class="back" href="home.html">← Home</a></div><section class="catalog-hero"><span class="pill" id="pill">MCQ TEST SERIES</span><h1 id="title">Test Series</h1><p id="subtitle">Loading the test-series catalog…</p></section><div id="error"></div><div id="content" class="catalog"><div class="loading">Loading…</div></div></main><footer class="footer">LakshyaSetu © 2026 · Civil Services Learning Platform</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260908-seriesfix2"></script><script>(async function(){'use strict';const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),examId=Number(q.get('exam')||0),subjectId=Number(q.get('subject')||0),topicId=Number(q.get('topic')||0),stage=q.get('stage')||'',db=getLakshyaSetuDb(),examNames={1:'UPSC Civil Services',2:'APPSC Group 1',3:'APPSC Group 2'},money=v=>Number(v||0)>0?'₹'+Number(v).toLocaleString('en-IN'):'Free',esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));function fail(e){$('error').innerHTML='<div class="error">Unable to load the catalog. '+esc(e?.message||String(e))+'</div>';$('content').innerHTML=''}function setHero(p,t,s){$('pill').textContent=p;$('title').textContent=t;$('subtitle').textContent=s}function link(params){const u=new URLSearchParams(params);return 'test-series.html?'+u.toString()}async function loadAll(){const [cr,mr,tr,tsr]=await Promise.all([db.from('ls_courses').select('id,title,exam_code,description,course_fee,published,archived').eq('published',true).eq('archived',false),db.from('ls_course_subjects').select('id,course_id,subject_id,published,archived,display_order').eq('published',true).eq('archived',false),db.from('ls_tests').select('id,title,description,question_count,duration_minutes,duration,price,test_type,course_subject_id,topic_id,test_series_id,published,archived').eq('published',true).eq('archived',false).order('id'),db.from('ls_test_series').select('id,title,description,price,series_type,course_id,published,archived').eq('published',true).eq('archived',false).order('id')]);for(const r of [cr,mr,tr,tsr])if(r.error)throw r.error;return {courses:cr.data||[],maps:mr.data||[],tests:tr.data||[],series:tsr.data||[]}}async function render(){const d=await loadAll(),course=d.courses.find(c=>c.id===examId),mapById={};d.maps.forEach(m=>mapById[m.id]=m);const courseMaps=d.maps.filter(m=>m.course_id===examId);const tests=d.tests.filter(t=>mapById[t.course_subject_id]?.course_id===examId);if(!examId){setHero('MCQ TEST SERIES','Choose an examination','Select an examination to enter its test-series catalog.');$('content').innerHTML='<div class="catalog-card"><div class="test-list">'+d.courses.map(c=>'<div class="test-item"><div><h3>'+esc(c.title)+'</h3><p>'+esc(c.description||'Subjects → Topics → Tests')+'</p></div><a class="btn-open" href="'+link({exam:c.id})+'">Open Catalog →</a></div>').join('')+'</div></div><div class="catalog-card ca"><h3>Current Affairs Test Series</h3><p>Monthly current-affairs MCQ tests.</p><a class="btn-open" href="current-affairs-tests.html">View Current Affairs →</a></div>';return}if(!course){setHero('MCQ TEST SERIES','Examination not found','Please return to the test-series home.');$('content').innerHTML='<div class="empty"><a href="test-series.html">Back to Test Series</a></div>';return}if(examId===3&&!stage&&!subjectId&&!topicId){setHero('APPSC GROUP 2 · MCQ','APPSC Group 2','Choose Prelims or Mains first.');$('content').innerHTML='<div class="catalog-card"><div class="test-list"><a class="test-item" href="'+link({exam:3,stage:'prelims'})+'"><div><h3>Prelims</h3><p>Subjects → Topics → Tests</p></div><span class="btn-open">Open →</span></a><a class="test-item" href="'+link({exam:3,stage:'mains'})+'"><div><h3>Mains</h3><p>Objective/MCQ papers</p></div><span class="btn-open">Open →</span></a></div></div>';return}if(subjectId&&topicId){const rows=tests.filter(t=>Number(t.course_subject_id)===subjectId&&Number(t.topic_id)===topicId);setHero(examId===3?'GROUP 2 · '+(stage||'PRELIMS').toUpperCase()+' · MCQ':'MCQ TEST SERIES','Individual Topic Tests','Published tests for this topic.');$('crumb').innerHTML='<a class="back" href="'+link({exam:examId,...(examId===3?{stage}:{}),subject:subjectId})+'">← Back</a>';$('content').innerHTML='<div class="catalog-card"><div class="test-list">'+(rows.length?rows.map(t=>'<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+Number(t.question_count||50)+' questions · '+Number(t.duration_minutes||t.duration||30)+' min · '+money(t.price||2)+'</p></div><a class="btn-open" href="student-v2.html?test='+encodeURIComponent(t.id)+'">Open Test</a></div>').join(''):'<div class="empty">No published tests in this topic yet.</div>')+'</div></div>';return}if(subjectId){const map=courseMaps.find(m=>Number(m.id)===subjectId);const rows=tests.filter(t=>Number(t.course_subject_id)===subjectId);setHero(examId===3?'GROUP 2 · '+(stage||'PRELIMS').toUpperCase()+' · MCQ':'MCQ TEST SERIES', 'Subject Tests','Topics and published tests for this subject.');const topicsRes=await db.from('ls_topics').select('id,title,description,published,archived,display_order').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('display_order').order('id');if(topicsRes.error)throw topicsRes.error;$('crumb').innerHTML='<a class="back" href="'+link({exam:examId,...(examId===3?{stage}: {})})+'">← Back</a>';$('content').innerHTML='<div class="catalog-card"><h2>Topics</h2><div class="test-list">'+((topicsRes.data||[]).map(t=>'<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+Number(rows.filter(x=>Number(x.topic_id)===Number(t.id)).length)+' published tests</p></div><a class="btn-open" href="'+link({exam:examId,...(examId===3?{stage}: {}),subject:subjectId,topic:t.id})+'">View Tests →</a></div>').join('')||'<div class="empty">No published topics yet.</div>')+'</div></div>';return}const mapsForStage=courseMaps;setHero(examId===3?'GROUP 2 · '+(stage||'PRELIMS').toUpperCase()+' · MCQ':'MCQ TEST SERIES',course.title, 'Choose a subject to see topics and published tests.');$('crumb').innerHTML='<a class="back" href="test-series.html">← All Exams</a>';$('content').innerHTML='<div class="catalog-card"><div class="test-list">'+(mapsForStage.length?mapsForStage.map(m=>{const ts=tests.filter(t=>Number(t.course_subject_id)===Number(m.id));return '<div class="test-item"><div><h3>Subject '+esc(m.subject_id)+'</h3><p>'+ts.length+' published tests</p></div><a class="btn-open" href="'+link({exam:examId,...(examId===3?{stage}:{}),subject:m.id})+'">Open Subject →</a></div>'}).join(''):'<div class="empty">No published subjects are currently available.</div>')+'</div></div><div class="catalog-card"><h2>Published Tests</h2><div class="test-list">'+(tests.length?tests.map(t=>'<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+Number(t.question_count||50)+' questions · '+Number(t.duration_minutes||t.duration||30)+' min · '+money(t.price||2)+'</p></div><a class="btn-open" href="student-v2.html?test='+encodeURIComponent(t.id)+'">Open Test</a></div>').join(''):'<div class="empty">No published tests are currently available for this examination.</div>')+'</div></div>'}try{await render()}catch(e){fail(e)}})();</script></body></html>
