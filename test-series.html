<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Series | LakshyaSetu</title><link rel="stylesheet" href="styles.css?v=21"><style>
.catalog{display:grid;gap:16px}.catalog-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.catalog-card h2,.catalog-card h3{margin:0 0 6px;color:var(--navy)}.meta{color:#64748b;font-size:12px}.subjects-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.subject-card{background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}.subject-card h3{margin:0;color:var(--navy);font-size:17px}.subject-card .meta{margin:7px 0}.subject-tests{margin-top:8px;padding-top:10px;border-top:1px solid #e1e8f0}.test-list{display:grid;gap:9px}.test-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e1e8f0;border-radius:11px;padding:12px;background:#fbfcfe}.test-item h4{margin:0 0 3px;color:#173b67;font-size:14px}.test-item p{margin:0;color:#64748b;font-size:11px}.btn-open,.buy-btn{display:inline-block;white-space:nowrap;text-decoration:none;background:#173b67;color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800;border:0;cursor:pointer}.buy-btn{background:#0f5fc4}.subject-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:auto;padding-top:12px}.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.stage-card{background:#f8fbff;border:1px solid #dbe4ee;border-radius:14px;padding:16px}.stage-card h2{margin:0;color:var(--navy);font-size:18px}.empty{padding:14px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b;background:#f8fafc}.error{padding:13px;border-radius:10px;background:#fff0f0;border:1px solid #efc4c4;color:#9f2222}.back{display:inline-block;margin:18px 0 8px;color:var(--blue);font-weight:800;text-decoration:none}.price-tag{font-weight:900;color:#173b67;font-size:15px}@media(max-width:900px){.subjects-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.subjects-grid,.stage-grid{grid-template-columns:1fr}.test-item{align-items:flex-start;flex-direction:column}.subject-actions{justify-content:flex-start;flex-wrap:wrap}}
</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu<small>Learn. Prepare. Achieve.</small></a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><div id="crumb"><a class="back" href="home.html">← Home</a></div><section class="catalog-hero"><span class="pill">MCQ TEST SERIES</span><h1 id="title">Test Series</h1><p id="subtitle">Loading…</p></section><div id="error"></div><div id="content" class="catalog"><div class="loading">Loading…</div></div></main><footer class="footer">LakshyaSetu © 2026 · Civil Services Learning Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260908-series-clean"></script><script src="payments-v2.js?v=10"></script><script>
(function(){'use strict';var $=function(id){return document.getElementById(id)},p=new URLSearchParams(location.search),examId=Number(p.get('exam')||0),subjectId=Number(p.get('subject')||0),topicId=Number(p.get('topic')||0),stage=p.get('stage')||'',db=getLakshyaSetuDb(),courses=[],maps=[],subjects=[],tests=[];
var esc=function(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]})};var money=function(v){return Number(v||0)>0?'₹'+Number(v).toLocaleString('en-IN'):'Free'};var link=function(o){var u=new URLSearchParams();Object.keys(o).forEach(function(k){if(o[k]!==''&&o[k]!=null)u.set(k,o[k]);});return 'test-series.html?'+u.toString()};
function fail(e){$('error').innerHTML='<div class="error">Unable to load the catalog: '+esc(e&&e.message||e)+'</div>';$('content').innerHTML=''}function hero(t,s){$('title').textContent=t;$('subtitle').textContent=s}function subjectName(id){var s=subjects.find(function(x){return Number(x.id)===Number(id)});return s?s.title:'Subject '+id}function isCA(t){var z=(String(t.test_type||'')+' '+String(t.title||'')+' '+String(t.description||'')).toLowerCase();return z.indexOf('current affair')!==-1||z.indexOf('current-affairs')!==-1||z.indexOf('current_affairs')!==-1}function stageOf(t){var z=(String(t.paper_label||'')+' '+String(t.test_type||'')+' '+String(t.title||'')+' '+String(t.description||'')).toLowerCase();if(/mains|main exam|descriptive/.test(z))return 'Mains';return 'Prelims'}function examMaps(){return maps.filter(function(m){return Number(m.course_id)===examId})}function examTests(){var ids=examMaps().map(function(m){return Number(m.id)});return tests.filter(function(t){return ids.indexOf(Number(t.course_subject_id))!==-1&&!isCA(t)})}window.buySubject=function(id,name){if(window.LSBuy)window.LSBuy({product_type:'subject',course_subject_id:Number(id)},'LakshyaSetu Subject - '+name);else alert('Payment module is loading. Please try again.');};
function renderExamHome(){hero('Test Series','Choose an examination.');$('crumb').innerHTML='<a class="back" href="home.html">← Home</a>';var h='<div class="catalog-card"><h3>Examinations</h3><div class="test-list">';courses.forEach(function(c){h+='<div class="test-item"><div><h3>'+esc(c.title)+'</h3><p>'+esc(c.description||'Subjects → Topics → Tests')+'</p></div><a class="btn-open" href="'+link({exam:c.id})+'">Open Exam →</a></div>'});h+='</div></div><div class="catalog-card"><h3>Current Affairs</h3><p class="meta">Current Affairs Tests are separate from UPSC/APPSC subjects.</p><a class="btn-open" href="current-affairs-tests.html">Open Current Affairs Tests →</a></div>';$('content').innerHTML=h}
function renderTestRows(rows){return rows.length?rows.map(function(t){return '<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+Number(t.question_count||50)+' questions · '+Number(t.duration_minutes||30)+' min · '+money(t.price||2)+'</p></div><a class="btn-open" href="student-v2.html?test='+encodeURIComponent(t.id)+'">Open Test</a></div>'}).join(''):'<div class="empty">No published tests available.</div>'}
function subjectCard(m,filterStage){var s=subjects.find(function(x){return Number(x.id)===Number(m.subject_id)}),name=s?s.title:'Subject '+m.subject_id,rows=tests.filter(function(t){return Number(t.course_subject_id)===Number(m.id)&&!isCA(t)&&(!filterStage||stageOf(t)===filterStage)});return '<div class="subject-card"><h3>'+esc(name)+'</h3><div class="meta">'+rows.length+' published test'+(rows.length===1?'':'s')+'</div><div class="subject-tests"><div class="test-list">'+renderTestRows(rows)+'</div></div><div class="subject-actions"><button class="buy-btn" type="button" onclick="buySubject('+Number(m.id)+',\''+esc(name).replace(/'/g,"\\'")+'\')">₹99 · Buy Subject</button><a class="btn-open" href="'+link({exam:examId,stage:filterStage||'',subject:m.id})+'">View Subject →</a></div></div>'}
function renderSubjects(filterStage){var rows=examMaps(),c=courses.find(function(x){return Number(x.id)===examId});hero(c?c.title:'Test Series',filterStage?filterStage+' · Choose a subject.':'Choose a subject. Each subject is ₹99.');$('crumb').innerHTML='<a class="back" href="'+link({exam:examId})+'">← Back</a>';var h='<div class="catalog-card"><h2>'+(filterStage||'Subjects')+'</h2><p class="meta">Each subject ₹99 · Published MCQ tests appear inside the corresponding subject.</p><div class="subjects-grid">'+rows.map(function(m){return subjectCard(m,filterStage)}).join('')+'</div></div>';$('content').innerHTML=h}
function renderGroup2(){var c=courses.find(function(x){return Number(x.id)===examId});hero(c?c.title:'APPSC Group 2','Prelims and Mains are kept separate.');$('crumb').innerHTML='<a class="back" href="test-series.html">← All Exams</a>';var h='<div class="stage-grid"><div class="stage-card"><h2>Prelims</h2><p class="meta">Objective MCQ test series.</p><a class="btn-open" href="'+link({exam:examId,stage:'Prelims'})+'">Open Prelims →</a></div><div class="stage-card"><h2>Mains</h2><p class="meta">Mains test series.</p><a class="btn-open" href="'+link({exam:examId,stage:'Mains'})+'">Open Mains →</a></div></div>';$('content').innerHTML=h}
async function renderSubject(){var m=maps.find(function(x){return Number(x.id)===subjectId&&Number(x.course_id)===examId});if(!m){renderSubjects(stage);return}var r=await db.from('ls_topics').select('id,title,description,display_order').eq('course_subject_id',subjectId).eq('published',true).eq('archived',false).order('display_order').order('id');if(r.error)throw r.error;hero(subjectName(m.subject_id),'Topics and published tests. Subject access: ₹99.');$('crumb').innerHTML='<a class="back" href="'+link({exam:examId,stage:stage})+'">← Back</a>';var h='<div class="catalog-card"><h3>'+esc(subjectName(m.subject_id))+' <span class="price-tag">₹99</span></h3><p class="meta">Buy subject access for ₹99, then practise its published tests.</p><div class="subject-actions"><button class="buy-btn" type="button" onclick="buySubject('+Number(m.id)+',\''+esc(subjectName(m.subject_id)).replace(/'/g,"\\'")+'\')">₹99 · Buy Subject</button></div><div class="test-list">';h+=(r.data||[]).map(function(t){var n=tests.filter(function(x){return Number(x.course_subject_id)===subjectId&&Number(x.topic_id)===Number(t.id)&&!isCA(x)&&(!stage||stageOf(x)===stage)}).length;return '<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+n+' published tests</p></div><a class="btn-open" href="'+link({exam:examId,stage:stage,subject:subjectId,topic:t.id})+'">View Tests →</a></div>'}).join('')||'<div class="empty">No published topics yet.</div>';h+='</div></div>';$('content').innerHTML=h}
function renderTests(){var rows=examTests();if(subjectId)rows=rows.filter(function(t){return Number(t.course_subject_id)===subjectId});if(topicId)rows=rows.filter(function(t){return Number(t.topic_id)===topicId});if(stage)rows=rows.filter(function(t){return stageOf(t)===stage});hero('Published Tests',rows.length+' published test'+(rows.length===1?'':'s')+(stage?' · '+stage:''));$('crumb').innerHTML='<a class="back" href="'+(subjectId?link({exam:examId,stage:stage}):link({exam:examId}))+'">← Back</a>';$('content').innerHTML='<div class="catalog-card"><div class="test-list">'+renderTestRows(rows)+'</div></div>'}
async function start(){var a=await Promise.all([db.from('ls_courses').select('id,title,description,exam_code').eq('published',true).eq('archived',false).order('id'),db.from('ls_course_subjects').select('id,course_id,subject_id').eq('published',true).eq('archived',false),db.from('ls_subjects').select('id,title').eq('published',true).eq('archived',false),db.from('ls_tests').select('id,title,description,question_count,duration_minutes,price,test_type,paper_label,course_subject_id,topic_id,published,archived').eq('published',true).eq('archived',false).order('id')]);a.forEach(function(x){if(x.error)throw x.error});courses=a[0].data||[];maps=a[1].data||[];subjects=a[2].data||[];tests=a[3].data||[];if(!examId)return renderExamHome();var c=courses.find(function(x){return Number(x.id)===examId});if(!c){hero('Examination not found','Please return to Test Series.');$('content').innerHTML='<div class="empty">Back to Test Series</div>';return}var isGroup2=String(c.exam_code||'').toUpperCase().indexOf('GROUP_2')!==-1;if(isGroup2&&!subjectId&&!topicId&&!stage)return renderGroup2();if(subjectId){if(topicId)renderTests();else await renderSubject();return}if(isGroup2&&stage)return renderSubjects(stage);renderSubjects('')}start().catch(fail)})();
</script></body></html>
