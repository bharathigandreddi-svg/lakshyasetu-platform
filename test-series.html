<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Series | LakshyaSetu</title><link rel="stylesheet" href="styles.css?v=20"><style>.catalog{display:grid;gap:16px}.catalog-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.catalog-card h2,.catalog-card h3{margin:0 0 6px;color:var(--navy)}.test-list{display:grid;gap:9px;margin-top:12px}.test-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e1e8f0;border-radius:11px;padding:12px;background:#fbfcfe}.test-item h4{margin:0 0 3px;color:#173b67;font-size:14px}.test-item p{margin:0;color:#64748b;font-size:11px}.btn-open{display:inline-block;white-space:nowrap;text-decoration:none;background:#173b67;color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:800}.back{display:inline-block;margin:18px 0 8px;color:var(--blue);font-weight:800;text-decoration:none}.error{margin:12px 0;padding:13px;border-radius:10px;background:#fff0f0;border:1px solid #efc4c4;color:#9f2222}.loading{padding:16px}.empty{padding:14px;border:1px dashed #cbd5e1;border-radius:10px;color:#64748b}.ca{border:2px solid #cbdcf2}.section-title{margin-top:18px!important}@media(max-width:650px){.test-item{align-items:flex-start;flex-direction:column}.btn-open{align-self:flex-end}}</style></head><body><header class="top"><a class="brand" href="home.html">LakshyaSetu<small>Learn. Prepare. Achieve.</small></a><nav class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="login.html">Student Login</a></nav></header><main class="wrap"><div id="crumb"><a class="back" href="home.html">← Home</a></div><section class="catalog-hero"><span class="pill" id="pill">MCQ TEST SERIES</span><h1 id="title">Test Series</h1><p id="subtitle">Loading the test-series catalog…</p></section><div id="error"></div><div id="content" class="catalog"><div class="loading">Loading…</div></div></main><footer class="footer">LakshyaSetu © 2026 · Civil Services Learning Platform</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260908-seriesfix4"></script><script>(function(){'use strict';var $=function(id){return document.getElementById(id)},params=new URLSearchParams(location.search),examId=Number(params.get('exam')||0),subjectId=Number(params.get('subject')||0),topicId=Number(params.get('topic')||0),stageParam=params.get('stage')||'',db=getLakshyaSetuDb(),courses=[],maps=[],subjects=[],topics=[],tests=[];var esc=function(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]})};var money=function(v){return Number(v||0)>0?'₹'+Number(v).toLocaleString('en-IN'):'Free'};var go=function(p){var u=new URLSearchParams();Object.keys(p).forEach(function(k){if(p[k]!==''&&p[k]!=null)u.set(k,p[k])});return 'test-series.html?'+u.toString()};function hero(a,b,c){$('pill').textContent=a;$('title').textContent=b;$('subtitle').textContent=c}function error(e){$('error').innerHTML='<div class="error">Unable to load the catalog. '+esc(e&&e.message||e)+'</div>';$('content').innerHTML=''}async function load(){var r=await Promise.all([db.from('ls_courses').select('id,title,description,course_fee,published,archived').eq('published',true).eq('archived',false),db.from('ls_course_subjects').select('id,course_id,subject_id,display_order,published,archived').eq('published',true).eq('archived',false).order('display_order').order('id'),db.from('ls_subjects').select('id,title,slug,description,published,archived').eq('published',true).eq('archived',false),db.from('ls_topics').select('id,course_subject_id,title,description,published,archived,display_order').eq('published',true).eq('archived',false).order('display_order').order('id'),db.from('ls_tests').select('id,title,description,question_count,duration_minutes,duration,price,test_type,course_subject_id,topic_id,published,archived').eq('published',true).eq('archived',false).order('id')]);r.forEach(function(x){if(x.error)throw x.error});courses=r[0].data||[];maps=r[1].data||[];subjects=r[2].data||[];topics=r[3].data||[];tests=r[4].data||[]}function subjectName(id){var s=subjects.find(function(x){return Number(x.id)===Number(id)});return s?s.title:'Subject '+id}function subjectMaps(){return maps.filter(function(m){return Number(m.course_id)===examId})}function testRow(t){return '<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+esc(subjectName(maps.find(function(m){return Number(m.id)===Number(t.course_subject_id))?.subject_id))+' · '+Number(t.question_count||50)+' questions · '+Number(t.duration_minutes||t.duration||30)+' min · '+money(t.price||2)+'</p></div><a class="btn-open" href="student-v2.html?test='+encodeURIComponent(t.id)+'">Open Test</a></div>'}function examPage(){hero('MCQ TEST SERIES','Choose an examination','Select an examination to enter its test-series catalog.');var html='<div class="catalog-card"><div class="test-list">';courses.forEach(function(c){html+='<div class="test-item"><div><h3>'+esc(c.title)+'</h3><p>'+esc(c.description||'Subjects → Topics → Tests')+'</p></div><a class="btn-open" href="'+go({exam:c.id})+'">Open Catalog →</a></div>'});html+='</div></div><div class="catalog-card ca"><h3>Current Affairs Test Series</h3><p>Monthly current-affairs MCQ tests.</p><a class="btn-open" href="current-affairs-tests.html">View Current Affairs →</a></div>';$('content').innerHTML=html}function group2Stage(){hero('APPSC GROUP 2 · MCQ','APPSC Group 2','Choose Prelims or Mains first.');$('content').innerHTML='<div class="catalog-card"><div class="test-list"><a class="test-item" href="'+go({exam:3,stage:'prelims'})+'"><div><h3>Prelims</h3><p>Subjects → Topics → Tests</p></div><span class="btn-open">Open →</span></a><a class="test-item" href="'+go({exam:3,stage:'mains'})+'"><div><h3>Mains</h3><p>Objective/MCQ papers</p></div><span class="btn-open">Open →</span></a></div></div>'}function subjectsPage(){var rows=subjectMaps(),examTests=tests.filter(function(t){return rows.some(function(m){return Number(m.id)===Number(t.course_subject_id)})});hero(examId===3?'GROUP 2 · '+(stageParam||'PRELIMS').toUpperCase()+' · MCQ':'MCQ TEST SERIES',courses.find(function(c){return Number(c.id)===examId}).title,'Published tests for this examination, organized by subject.');var html='<div class="catalog-card"><h2>Published Tests <span style="font-size:12px;color:#64748b">('+examTests.length+')</span></h2><div class="test-list">';html+=examTests.length?examTests.map(testRow).join(''):'<div class="empty">No published tests are currently available for this examination.</div>';html+='</div></div><div class="catalog-card"><h2>Subjects</h2><div class="test-list">';if(!rows.length)html+='<div class="empty">No published subjects are currently available.</div>';rows.forEach(function(m){var n=tests.filter(function(t){return Number(t.course_subject_id)===Number(m.id)}).length;html+='<div class="test-item"><div><h3>'+esc(subjectName(m.subject_id))+'</h3><p>'+n+' published tests</p></div><a class="btn-open" href="'+go({exam:examId,stage:examId===3?stageParam:'',subject:m.id})+'">Open Subject →</a></div>'});html+='</div></div>';$('crumb').innerHTML='<a class="back" href="test-series.html">← All Exams</a>';$('content').innerHTML=html}async function topicPage(){var map=maps.find(function(m){return Number(m.id)===subjectId&&Number(m.course_id)===examId});if(!map){subjectsPage();return}var ts=topics.filter(function(t){return Number(t.course_subject_id)===subjectId});var html='<div class="catalog-card"><h2>'+esc(subjectName(map.subject_id))+'</h2><div class="test-list">';if(!ts.length)html+='<div class="empty">No published topics yet.</div>';ts.forEach(function(t){var n=tests.filter(function(x){return Number(x.course_subject_id)===subjectId&&Number(x.topic_id)===Number(t.id)}).length;html+='<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+n+' published tests</p></div><a class="btn-open" href="'+go({exam:examId,stage:examId===3?stageParam:'',subject:subjectId,topic:t.id})+'">View Tests →</a></div>'});html+='</div></div>';hero(examId===3?'GROUP 2 · '+(stageParam||'PRELIMS').toUpperCase()+' · MCQ':'MCQ TEST SERIES',subjectName(map.subject_id),'Topics and published tests for this subject.');$('crumb').innerHTML='<a class="back" href="'+go({exam:examId,stage:examId===3?stageParam:''})+'">← Back</a>';$('content').innerHTML=html}function testsPage(){var rows=tests.filter(function(t){return Number(t.course_subject_id)===subjectId&&Number(t.topic_id)===topicId});hero(examId===3?'GROUP 2 · '+(stageParam||'PRELIMS').toUpperCase()+' · MCQ':'MCQ TEST SERIES','Individual Topic Tests','Published tests for this topic.');$('crumb').innerHTML='<a class="back" href="'+go({exam:examId,stage:examId===3?stageParam:'',subject:subjectId})+'">← Back</a>';$('content').innerHTML='<div class="catalog-card"><div class="test-list">'+(rows.length?rows.map(function(t){return '<div class="test-item"><div><h4>'+esc(t.title)+'</h4><p>'+Number(t.question_count||50)+' questions · '+Number(t.duration_minutes||t.duration||30)+' min · '+money(t.price||2)+'</p></div><a class="btn-open" href="student-v2.html?test='+encodeURIComponent(t.id)+'">Open Test</a></div>'}).join(''):'<div class="empty">No published tests in this topic yet.</div>')+'</div></div>'}async function start(){await load();if(!examId){examPage();return}var course=courses.find(function(c){return Number(c.id)===examId});if(!course){hero('MCQ TEST SERIES','Examination not found','Please return to Test Series.');$('content').innerHTML='<div class="empty"><a href="test-series.html">Back to Test Series</a></div>';return}if(examId===3&&!stageParam&&!subjectId&&!topicId){group2Stage();return}if(subjectId&&topicId){testsPage();return}if(subjectId){await topicPage();return}subjectsPage()}start().catch(error)})();</script></body></html>
